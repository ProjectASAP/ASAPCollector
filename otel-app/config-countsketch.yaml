# otel-app — CountSketch SDK pre-aggregation (top-K / heavy hitters).
# Run:  otel-app -config config-countsketch.yaml
target: gateway:4317
sdk_window: 15s
sdk_agg: cs-full          # use cs-delta for sparse delta encoding
sketch_type: countsketch
cardinality: 500
freq_hz: 10.0
five_sketch_endpoints: 50
five_sketch_zipf_s: 1.2

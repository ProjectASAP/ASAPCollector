# SDK pipeline configuration — HyperLogLog (HLL) sketch, transmit_sketch: true
#
# HLL estimates cardinality. SDK pre-aggregates into HLL sketch registers;
# the collector's hllprocessor decodes them into cardinality gauges.

exporter:
  endpoint: localhost:4317
  insecure: true
  max_send_msg_size_mb: 64

reader:
  interval: 1s

sketch:
  type: hll
  transmit_sketch: true
  hll: {}   # HLL has no tunable parameters

instruments:
  - name: benchmark.latency
    description: Benchmark unique-value cardinality
    unit: "1"
    instrument_kind: histogram
    group_by:
      - host.name
      - service.name
    series_per_sketch: 1

asap_query:
  metrics:
    - metric: benchmark.latency
      labels:
        - host.name
        - service.name
  query_groups:
    - id: 1
      queries:
        - "cardinality_over_time(benchmark_latency[5m])"
      repetition_delay: 5000
      controller_options:
        accuracy_sla: 0.02
        latency_sla: 100.0

load:
  workers: 10
  series: 1000
  samples_per_sec_per_series: 50.0
  duration: 60s
  distribution:
    type: zipf
    s: 1.1
    v: 1.0
    max: 500
    mean: 250.0

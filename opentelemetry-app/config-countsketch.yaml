# SDK pipeline configuration — CountSketch, transmit_sketch: true
#
# SDK pre-aggregates into a CountSketch (signed frequency estimation with
# better accuracy than CountMinSketch for certain workloads).

exporter:
  endpoint: localhost:4317
  insecure: true
  max_send_msg_size_mb: 64

reader:
  interval: 1s
  enable_self_monitoring: true

sketch:
  type: countsketch
  transmit_sketch: true
  countsketch:
    rows: 5
    cols: 2000
    epsilon: 0.01
    delta:   0.99
    dimension: ""   # optional: label describing the sketched dimension

instruments:
  - name: benchmark.latency
    description: Benchmark latency measurement
    unit: ms
    instrument_kind: histogram
    group_by:
      - host.name
      - service.name
    series_per_sketch: 1

asap_query:
  metrics:
    - metric: benchmark.latency
      labels:
        - host.name
        - service.name
  query_groups:
    - id: 1
      queries:
        - "frequency_over_time(benchmark_latency[5m])"
      repetition_delay: 5000
      controller_options:
        accuracy_sla: 0.01
        latency_sla: 100.0

load:
  workers: 10
  series: 1000
  samples_per_sec_per_series: 50.0
  duration: 60s
  distribution:
    type: zipf
    s: 1.1
    v: 1.0
    max: 500
    mean: 250.0

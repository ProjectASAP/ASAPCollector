dist:
  module: OTEL
  name: OTEL
  output_path: ./bin/otel

exporters:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter v0.142.0
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.142.0
  - gomod: go.opentelemetry.io/collector/exporter/nopexporter v0.141.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.142.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/kllprocessor v0.0.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.142.0

# current path is bridge/bin/otel
replaces:
  - github.com/open-telemetry/opentelemetry-collector-contrib/processor/kllprocessor => ../../../opentelemetry-collector-contrib/processor/kllprocessor
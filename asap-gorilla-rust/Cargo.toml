[package]
name = "asap-gorilla"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Rust Gorilla XOR-delta block format encoder + decoder. Byte-compatible with asap-gorilla-go and the runtime edge processors."
license = "MIT"

# Canonical Rust implementation for the Gorilla-S3-cold-engine. Consumed by:
#   - `ASAPQuery-backend` (later phases) via path-dep / git URL,
#     to back the GorillaQueryEngine reading cold S3 chunks.
#   - Future Rust edge agents that produce blocks directly without the
#     OTel-collector-contrib `gorillaprocessor` Go path.
#
# The block layout we encode/decode here is the canonical "GORILLA1"
# format shared with `asap-gorilla-go`. Runtime edge collectors and
# processors should depend on that Go module instead of carrying private
# encoder copies. Bytes written by either implementation are interchangeable.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# Postings (mvp/v5) introduces a CRC32C trailer on its own JSON blob.
# The Gorilla `GORILLA1` block format itself remains CRC-free for byte
# compat with the canonical Go encoder — `postings-v1.json` is a
# sibling sidecar file, not part of the block.
crc32fast = "1"

[dev-dependencies]
# No external dev-deps — round-trip + byte-compat tests use std only.

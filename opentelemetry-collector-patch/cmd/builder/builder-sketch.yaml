dist:
  name: otelcol-sketch
  description: custom build with sketchmetrics
  output_path: ./bin
  version: 0.0.1
  module: github.com/example/otelcol-sketch

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.141.0

processors:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/sketchcountminprocessor v0.0.0
exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.141.0

replaces:
  - github.com/open-telemetry/opentelemetry-collector-contrib/processor/sketchcountminprocessor => ../../../../opentelemetry-collector-contrib/processor/sketchcountminprocessor

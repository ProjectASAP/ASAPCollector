[package]
name = "asap-gorilla"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Gorilla XOR-delta block format encoder + decoder. Byte-compatible with the Telegraf-side / opentelemetry-collector-contrib `gorillaprocessor` block layout."
license = "MIT"

# Phase 1 of the Gorilla-S3-cold-engine. Consumed by:
#   - `ASAPQuery-backend` (later phases) via path-dep / git URL,
#     to back the GorillaQueryEngine reading cold S3 chunks.
#   - Future Rust edge agents that produce blocks directly without the
#     OTel-collector-contrib `gorillaprocessor` Go path.
#
# The block layout we encode/decode here is the canonical "GORILLA1"
# format defined by `opentelemetry-collector-contrib-patch/processor/
# gorillaprocessor/{compress,encoder,bitwriter}.go`. Bytes written by
# either side are interchangeable; see `tests/golden/regen.sh` for the
# Telegraf/Go-side fixture regeneration recipe.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# NB: the canonical GORILLA1 format does not include a CRC footer
# (the Go gorillaprocessor does not write one). We stay byte-compatible
# rather than appending one here. If a future format revision adds a
# footer, re-introduce `crc32fast = "1"`.

[dev-dependencies]
# No external dev-deps — round-trip + byte-compat tests use std only.

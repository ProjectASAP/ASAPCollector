# Phase 6 Gorilla-S3 e2e overlay.
#
# This overlay is the SIBLING of `deploy/docker-compose/base.yml` —
# it brings up an EPHEMERAL stack on a separate compose project
# (`asap-gorilla-e2e`) and a separate port range (29xxx) so it
# can run side-by-side with the host-wide sweep stack
# (`docker-compose-{minio,backend,agent-1,...}` on 19xxx) without
# port collisions.
#
# Coordination: the e2e Go test calls `docker compose -p
# asap-gorilla-e2e -f integration/gorilla_s3_e2e/docker-compose/
# e2e-overlay.yml up -d` and tears it down with `down -v` on test
# completion. Sweep is left untouched.
#
# Services brought up:
#
#   minio-e2e          MinIO S3-compatible store, ports 29000/29001
#   minio-setup-e2e    Seeds the `asap-gorilla` bucket the
#                      gorillas3processor writes into
#   asap-otel-e2e      Single asap-otel agent running
#                      asap-otel-agent-gorillas3-tier.yaml — encodes
#                      raw samples to GORILLA1 + writes 60s chunks
#                      to MinIO
#   backend-e2e        asap/query-backend:dev with the
#                      Gorilla-S3 cold-store env wired against the
#                      ephemeral MinIO. Exposes PromQL on host 29091.
#
# fake-exporter is intentionally NOT in the compose stack; the Go
# test pushes the deterministic 100-sample fixture directly via OTLP
# to asap-otel-e2e:24317. This is the only way to drive a fixed,
# repeatable input — fake-exporter generates random data.

version: "3.9"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  minio-e2e:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: asap
      MINIO_ROOT_PASSWORD: asap-local-only
    ports:
      - "29000:9000"
      - "29001:9001"
    volumes:
      - minio-e2e-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

  # Pre-create the asap-gorilla bucket so gorillas3processor PUTs
  # land somewhere. The default base.yml only seeds `raw` (for the
  # JSONL cold-fallback adapter); the GORILLA1 chunks need a separate
  # bucket per the Phase-2 processor README.
  minio-setup-e2e:
    image: minio/mc:latest
    depends_on:
      minio-e2e:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set asap http://minio-e2e:9000 asap asap-local-only &&
        mc mb --ignore-existing asap/asap-gorilla &&
        mc anonymous set download asap/asap-gorilla
    logging: *default-logging

  # Single asap-otel agent running the Phase-2 gorillas3 tier config.
  # The OTLP receiver listens on 4317 (gRPC) + 4318 (HTTP); we expose
  # both on host 24317/24318 so the Go test can drive samples in
  # without going through a fake-exporter container.
  asap-otel-e2e:
    image: asap/asap-otel:dev
    depends_on:
      minio-setup-e2e:
        condition: service_completed_successfully
    command:
      - "--config=/etc/otel/config.yaml"
    volumes:
      # The Phase-2 config — drop_original=true, encode + PUT to MinIO.
      # Path is relative to the compose file's directory.
      - ../../../deploy/configs/asap-otel-agent-gorillas3-tier.yaml:/etc/otel/config.yaml:ro
    environment:
      RUST_LOG: "info"
      # The processor config inside the YAML hardcodes minio:9000;
      # this overlay relies on that hostname matching minio-e2e's
      # service name within the e2e network. Map the alias.
    networks:
      default:
        aliases:
          - minio
          # The agent config hardcodes endpoint http://minio:9000;
          # alias the e2e MinIO under that name so no YAML rewrite
          # is needed.
    ports:
      - "24317:4317"
      - "24318:4318"
      - "28890:8890"
    logging: *default-logging

  # Backend, wired against the e2e MinIO + the asap-gorilla bucket.
  # Note: as of Phase 5 the backend's HTTP server still wires
  # SimpleEngine directly (Phase 6 follow-up tracked in PROGRESS.md).
  # When that wiring lands, this service becomes the canonical surface
  # the e2e PromQL assertion drives. Until then,
  # TestGorillaS3End2End_HappyPath documents the gap and skips the
  # PromQL HTTP step (the chunk-bytes assertion still runs).
  backend-e2e:
    image: asap/query-backend:dev
    depends_on:
      minio-setup-e2e:
        condition: service_completed_successfully
    environment:
      RUST_LOG: "info"
      ASAP_COLD_STORE_ENDPOINT: "http://minio-e2e:9000"
      ASAP_COLD_STORE_BUCKET: "asap-gorilla"
      ASAP_COLD_STORE_ACCESS_KEY: "asap"
      ASAP_COLD_STORE_SECRET_KEY: "asap-local-only"
      ASAP_GORILLA_S3_ENDPOINT: "http://minio-e2e:9000"
      ASAP_GORILLA_S3_BUCKET: "asap-gorilla"
      ASAP_GORILLA_S3_ACCESS_KEY: "asap"
      ASAP_GORILLA_S3_SECRET_KEY: "asap-local-only"
      ASAP_GORILLA_S3_TENANT: "default"
    command:
      - "--ingest-port=9090"
      - "--query-port=9091"
    ports:
      - "29090:9090"
      - "29091:9091"
    logging: *default-logging

volumes:
  minio-e2e-data:

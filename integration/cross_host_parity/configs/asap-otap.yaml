# Phase 5 step E asap-otap agent config — OTAP Dataflow pipeline with
# the unified asap_sketches plugin instantiated five times (one per
# sketch family). Drives identical knobs to the asap-otel config so
# byte-parity at the SketchEnvelope.Payload level holds.
#
# Shape mirrors otap-patch/plugins/asap_sketches/sample.toml. OTAP
# accepts YAML or TOML; using YAML here for parity with the asap-otel
# config above.

receivers:
  - id: otlp
    plugin: otlp_receiver
    config:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  - id: resource_agent_id
    plugin: resource_processor
    config:
      attributes:
        - action: upsert
          key: asap.agent_id
          value: asap-otap

  - id: asap_ddsketch
    plugin: asap_sketches
    config:
      sketch_type: ddsketch
      window_size: "30s"
      output_metric_name: http_request_duration_ms
      sketch_params:
        relative_accuracy: 0.01

  - id: asap_kll
    plugin: asap_sketches
    config:
      sketch_type: kll
      window_size: "30s"
      output_metric_name: query_duration_ms
      sketch_params:
        k: 200
        seed: 42

  - id: asap_hll
    plugin: asap_sketches
    config:
      sketch_type: hll
      window_size: "30s"
      output_metric_name: unique_users
      sketch_params:
        precision: 12

  - id: asap_countsketch
    plugin: asap_sketches
    config:
      sketch_type: countsketch
      window_size: "30s"
      output_metric_name: error_codes
      sketch_params:
        rows: 3
        cols: 512

  - id: asap_countminsketch
    plugin: asap_sketches
    config:
      sketch_type: countminsketch
      window_size: "30s"
      output_metric_name: request_paths
      sketch_params:
        rows: 4
        cols: 2048

exporters:
  - id: otlp_tap
    plugin: otlp_exporter
    config:
      endpoint: envelope-tap:4317
      tls:
        insecure: true

pipelines:
  metrics:
    receivers: [otlp]
    processors:
      - resource_agent_id
      - asap_ddsketch
      - asap_kll
      - asap_hll
      - asap_countsketch
      - asap_countminsketch
    exporters: [otlp_tap]

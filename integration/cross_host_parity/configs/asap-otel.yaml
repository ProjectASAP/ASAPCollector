# Phase 5 step E asap-otel agent config — minimal pipeline that exercises
# all five sketch processors against an OTLP-driven input and forwards
# the emitted SketchEnvelope-carrying metrics to envelope-tap.
#
# Mirrors deploy/configs/asap-otel-agent-{ddsketch,kll,hll,cs,cms}-direct.yaml
# but folds all five processors into one pipeline so a single golden
# input drive exercises all five (the harness routes per-sketch by
# metric name, set in the input fixture).
#
# Reset stamp ASAP_AGENT_ID=asap-otel on the resource so the
# envelope-tap can route per-agent captures without ambiguity.

extensions: {}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  resource/agent_id:
    attributes:
      - action: upsert
        key: asap.agent_id
        value: asap-otel

  DDSketch:
    mode: window
    window_duration: 30s
    transmit_sketch: true
    enable_self_monitoring: false
    encoding: msgpack
    metric_match:
      - http_request_duration_ms
    relative_accuracy: 0.01

  KLL:
    mode: window
    window_duration: 30s
    transmit_sketch: true
    enable_self_monitoring: false
    encoding: msgpack
    metric_match:
      - query_duration_ms
    k: 200
    seed: 42

  HLL:
    mode: window
    window_duration: 30s
    transmit_sketch: true
    enable_self_monitoring: false
    encoding: msgpack
    metric_match:
      - unique_users

  CountSketch:
    mode: window
    window_duration: 30s
    transmit_sketch: true
    enable_self_monitoring: false
    encoding: msgpack
    metric_match:
      - error_codes
    rows: 3
    cols: 512

  CountMinSketch:
    mode: window
    window_duration: 30s
    transmit_sketch: true
    enable_self_monitoring: false
    encoding: msgpack
    metric_match:
      - request_paths
    rows: 4
    cols: 2048

  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  otlp/tap:
    endpoint: envelope-tap:4317
    tls:
      insecure: true
    compression: none

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors:
        - resource/agent_id
        - DDSketch
        - KLL
        - HLL
        - CountSketch
        - CountMinSketch
        - batch
      exporters: [otlp/tap]
  telemetry:
    logs:
      level: info

# Warm-path e2e overlay.
#
# Brings up an EPHEMERAL stack on a separate compose project
# (`asap-warm-e2e`) and a separate port range (29xxx) so it can run
# side-by-side with the host-wide sweep stack and the cold-path e2e
# stack without port collisions.
#
# Services brought up:
#
#   asap-otel-warm      Single asap-otel agent running the DDSketch
#                       window processor (10s flush interval; small
#                       so the test budget stays under 60s).
#   backend-warm        asap/query-backend:dev with --enable-otel-ingest
#                       wiring the warm-tier OTLP receiver. Exposes
#                       PromQL on host 29191 (note: 29191, not 29091
#                       which is owned by the cold-path overlay).
#
# The fake-exporter / MinIO / Thanos / mvp-multi-stage services are
# intentionally NOT in this overlay — this is a focused warm-path gate,
# not a copy of the MVP demo.

version: "3.9"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  asap-otel-warm:
    image: asap/asap-otel:dev
    command:
      - "--config=/etc/otel/config.yaml"
    volumes:
      - ../configs/asap-otel-agent-warm.yaml:/etc/otel/config.yaml:ro
    environment:
      RUST_LOG: "info"
    ports:
      - "24317:4317"
      - "24318:4318"
    depends_on:
      - backend-warm
    networks:
      - default
    logging: *default-logging

  backend-warm:
    image: asap/query-backend:dev
    environment:
      RUST_LOG: "info"
    command:
      - "--query-port=9091"
      - "--enable-otel-ingest"
      - "--otel-grpc-port=4317"
      - "--otel-http-port=4318"
    ports:
      - "29191:9091"
    networks:
      - default
    logging: *default-logging

networks:
  default:

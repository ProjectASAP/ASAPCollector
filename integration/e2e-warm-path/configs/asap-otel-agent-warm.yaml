# Warm-path e2e agent config.
#
# Single DDSketch processor in window mode with a small (10s) flush
# interval to keep the test runtime under 60s end-to-end. The processor
# emits typed `DDSketchDataPoint` data points alongside the raw input
# (drop_original=false default); the OTLP exporter forwards both to
# the backend's warm-tier OTLP receiver.
#
# Output metric: `http_requests_total_latency_ms_quantile` (typed
# DDSketchDataPoint variant). Backend's `DDSketchAccumulator` answers
# `quantile_over_time` PromQL queries from the merged sketch and
# stamps the response with `data_source: sketch_warm_tier`.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  ddsketch:
    mode: window
    window_duration: 10s
    transmit_sketch: true
    delta_transmission: false
    enable_self_monitoring: true
    quantiles: [0.5, 0.9, 0.99]
    metric_suffix: "_quantile"

  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  otlp/backend:
    endpoint: backend-warm:4317
    tls:
      insecure: true
    # Backend's tonic gRPC server doesn't accept gzip-compressed
    # request bodies — keep compression off (mirrors per-sketch
    # direct configs).
    compression: none

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [ddsketch, batch]
      exporters: [otlp/backend]

  telemetry:
    logs:
      level: info

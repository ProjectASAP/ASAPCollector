[[processors.allsketches]]
  ## Sketch type: ddsketch | kll | hll | countsketch | countminsketch
  sketch_type = "ddsketch"

  ## Window size for tumbling-window aggregation
  window_size = "10s"

  ## Field on the input metric carrying the observation value
  value_field = "value"

  ## Field carrying a pre-aggregated SketchEnvelope (base64-encoded)
  ## When present, the value_field is ignored.
  envelope_field = "_asap_envelope_b64"

  ## Output metric name (also used as MetricName in emitted envelopes)
  output_metric_name = "http_request_duration_ms"

  ## Sketch-specific parameters (only the fields for the configured sketch_type apply)
  alpha = 0.01     # ddsketch relative-accuracy
  k = 200          # kll, kll heap size
  seed = 0         # kll, fixed seed (0 = time-based)
  precision = 14   # hll precision
  width = 2048     # countsketch / cms width
  depth = 4        # countsketch / cms depth

  ## Delta transmission knobs
  delta_transmission = false
  delta_threshold = 0

  ## Series-key shape (most users leave defaults)
  omit_resource_attrs = false
  global_aggregation = false
  emit_window_stats = false

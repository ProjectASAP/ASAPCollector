# Encode numeric series into Gorilla blocks before shipping them to gorilla_s3.
[[aggregators.gorilla]]
  ## Flush one Gorilla block per aggregation period. Set the global `period`
  ## and this block interval to the same duration (e.g. 10m) and enable
  ## drop_original to avoid forwarding uncompressed metrics.
  # period = "10m"
  # drop_original = true

  ## Measurement name that carries the encoded blocks.
  # measurement = "gorilla_block"

  ## Duration of metrics per Gorilla block. Should match the aggregator period.
  # block_interval = "10m"

  ## Optional: split a block if the encoded payload would exceed this many
  ## bytes. Set to 0 to keep all series in a single object.
  # max_object_bytes = 0

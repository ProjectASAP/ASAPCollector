# Upload Gorilla aggregator blocks to S3.
[[outputs.gorilla_s3]]
  ## Required: S3 bucket and region. Leave blank to write blocks to local_dir only.
  bucket = "my-metrics-bucket"
  region = "us-east-1"

  ## Optional: prefix supports limited strftime-style tokens such as %Y/%m/%d.
  # prefix = "metrics/date=%Y-%m-%d/hour=%H/"

  ## Optional: SSE-KMS key ID for encryption.
  # sse_kms_key_id = ""

  ## Optional: fixed object name. Defaults to block-<unix>-<idx>-<rand>.gorilla
  # object_name = ""

  ## When set, write Gorilla blocks to disk instead of or in addition to S3.
  # local_dir = "/tmp/gorilla-blocks"

  ## Control which metrics are interpreted as Gorilla blocks.
  # block_measurement = "gorilla_block"
  # payload_field = "payload"

  ## Upload tuning parameters.
  # multipart_threshold = 8388608   # >= 5 MiB
  # multipart_part_bytes = 8388608  # >= 5 MiB
  # max_retries = 3
  # retry_backoff = "1s"
  # upload_timeout = "30s"

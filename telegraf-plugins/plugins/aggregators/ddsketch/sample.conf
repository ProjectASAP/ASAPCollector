# Encode numeric series into DDSketch structures over each aggregation period.
[[aggregators.ddsketch]]
  ## The aggregator period is configured via the global [[aggregators]] settings.
  ## This plugin simply summarizes each series within that tumbling window.

  ## Measurement name for emitted sketch metrics.
  # measurement = "ddsketch"

  ## Relative accuracy target passed to sketches-go.
  # accuracy = 0.01

  ## Optional quantiles to evaluate (0 < q < 1). Defaults to [0.5, 0.9, 0.99].
  # quantiles = [0.5, 0.9, 0.99]

# Approximate per-tag frequencies using Count-Min sketches over the aggregation period.
[[aggregators.countmin]]
  ## Configure the aggregation window using the standard [[aggregators]] settings.
  # period = "1m"
  # grace = "0s"
  # drop_original = false

  ## Measurement written by the aggregator when it emits sketches.
  # measurement = "countmin"

  ## Sketch dimensions (rows = hash functions, columns = buckets per row).
  # rows = 3
  # columns = 4096

  ## Base seed used to derive row-specific salts. Keep this stable to allow sketch merging.
  # seed = 11400714819323198485

  ## Limit the tags inserted into each sketch. When empty, every tag except those listed
  ## in group_by is inserted once per metric.
  # tag_keys = ["machineid", "tenant"]

  ## Optional set of tags used to partition sketches. Each unique combination of values
  ## across these tags produces an independent sketch.
  # group_by = ["scrape_url"]

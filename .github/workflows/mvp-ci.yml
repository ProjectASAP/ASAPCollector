name: MVP CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mvp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collector:
    name: MVP collector
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout ASAPCollector
        uses: actions/checkout@v4
        with:
          path: ASAPCollector

      - name: Checkout asap_sketchlib dependency
        uses: actions/checkout@v4
        with:
          repository: ProjectASAP/asap_sketchlib
          path: asap_sketchlib

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ASAPCollector/asap-precompute-rs

      - name: Check formatting
        working-directory: ASAPCollector/asap-precompute-rs
        run: cargo fmt -- --check

      - name: Check MVP collector
        working-directory: ASAPCollector/asap-precompute-rs
        run: cargo check --locked --all-features

      - name: Lint MVP collector
        working-directory: ASAPCollector/asap-precompute-rs
        run: cargo clippy --locked --all-features --all-targets

      - name: Test MVP collector
        working-directory: ASAPCollector/asap-precompute-rs
        run: cargo test --locked --all-features

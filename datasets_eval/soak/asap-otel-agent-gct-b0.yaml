# Agent config — RAW-FORWARD edge, GCT-trace b0 arm (edge soak).
#
# The "raw-forward (b0)" arm: a plain OTel collector pipeline with NO
# asap_edge processor — it just batches and forwards the raw OTLP stream to
# the same data_plane OTLP ingest the b3 sketch arm ships to. This isolates
# the edge process cost of sketch aggregation (b3) vs pure passthrough (b0):
# same image, same receiver, same backend endpoint, same constant load; the
# ONLY difference is whether asap_edge is in the pipeline.
#
# Mirrors deploy/mvp-multinode/configs/b0/asap-otel-agent-b0-otlp-none.yaml
# (the matched-NONE raw baseline) but (1) drops the opamp extension (bare
# agent, like stack-coldoff runs it) and (2) points the OTLP exporter at the
# cold-OFF data_plane (data-plane:14317) instead of VictoriaMetrics, so both
# arms share an identical downstream.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 4096
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 1280
    spike_limit_mib: 256
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  otlp/backend:
    endpoint: data-plane:14317
    compression: none
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/backend]
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8890

# Agent config — FUSED asap_edge edge, GCT-trace b3 sketch arm (edge soak).
#
# This is the "sketch (b3): DDSketch + Sum warm path (the normal edge)" arm
# for the §6 Fig-6 edge CPU/RSS + leak-slope soak. It is a STATIC asap_edge
# config (bare agent, no OpAMP supervisor) that maps the two metrics the
# Google-2019 mapper emits onto the two warm families the task names:
#
#   google_cluster_2019_cpu_rate      -> DDSketch (per-series quantile warm)
#   google_cluster_2019_memory_usage  -> Sum, aggregate_by [zone] (warm Sum)
#
# Differences vs deploy/.../asap-otel-agent-asapedge.yaml (the MVP-demo
# static config): (1) metric map targets the GCT metrics, not the synthetic
# http_requests_total family; (2) cold.enabled=false (cold-OFF stack has no
# gorilla-merger); (3) backend endpoint = data-plane:14317 (the cold-OFF
# data_plane OTLP ingest port, matching ASAP_EDGE_BACKEND_OTLP_PORT), not
# the controller-emit default :4317; (4) window_duration=30s for faster warm
# turnover during the soak. All keys map 1:1 to config.go.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 4096
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 1280
    spike_limit_mib: 256

  asap_edge:
    shard_count: 12
    window_duration: 30s
    drop_original: true
    max_series: 100000
    delta_transmission: false
    metrics:
      - metric: google_cluster_2019_cpu_rate
        family: ddsketch
        tier: warm
        relative_accuracy: 0.01
      - metric: google_cluster_2019_memory_usage
        family: sum
        aggregate_by: [zone]
        tier: warm
    cold:
      enabled: false
    control_channel:
      enabled: false

exporters:
  otlp/backend:
    endpoint: data-plane:14317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, asap_edge]
      exporters: [otlp/backend]
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8890

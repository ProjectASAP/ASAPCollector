# Auto-generated per-family agent config (multisketch eval). See make_perfamily.py.
receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317, max_recv_msg_size_mib: 4096}
      http: {endpoint: 0.0.0.0:4318}
processors:
  batch:
    send_batch_size: 800
    send_batch_max_size: 1500
  memory_limiter: {check_interval: 1s, limit_mib: 8192, spike_limit_mib: 1024}
  asap_edge:
    shard_count: 12
    window_duration: 60s
    drop_original: true
    max_series: 200000
    delta_transmission: false
    metrics:
      - {metric: google_cluster_2019_cpu_rate, family: sum, tier: both}
      - {metric: google_cluster_2019_memory_usage, family: sum, aggregate_by: [zone], tier: both}
      - metric: google_cluster_2019_cpu_rate_card_hll
        family: "hll"
        tier: "warm"
        delta_transmission: true
        item_label: "service"
    cold: {enabled: true, ship_endpoint: 'http://gorilla-merger:10908/ingest/gorilla', block_duration: 60s, reorder_grace: 2s, external_labels: {cluster: asap-mvp}}
    control_channel: {enabled: false}
exporters:
  otlp/backend:
    endpoint: data-plane:14317
    tls: {insecure: true}
    timeout: 120s
    sending_queue: {enabled: true, num_consumers: 4, queue_size: 5000}
service:
  pipelines:
    metrics: {receivers: [otlp], processors: [memory_limiter, asap_edge, batch], exporters: [otlp/backend]}
  telemetry:
    metrics:
      level: detailed
      readers: [{pull: {exporter: {prometheus: {host: 0.0.0.0, port: 8890}}}}]

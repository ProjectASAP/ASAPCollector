# GUARD workload — DDSketch + Sum only. Drives the cold-OFF sanity check:
# quantile_over_time(0.99, ..._q_ddsketch[60s]) must return a real value.
- metric_name: google_cluster_2019_cpu_rate
  query_string: sum(google_cluster_2019_cpu_rate)
  accuracy_sla: 0.0
  assign_to_role: agent
- metric_name: google_cluster_2019_cpu_rate_q_ddsketch
  query_string: quantile_over_time(0.99, google_cluster_2019_cpu_rate_q_ddsketch[60s])
  accuracy_sla: 0.05
  assign_to_role: agent
  sketch_family_override: DDSketch
  target_path: warm

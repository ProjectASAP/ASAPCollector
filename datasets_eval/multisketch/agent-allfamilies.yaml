# Static fused asap_edge agent config for the multi-sketch family eval.
#
# Standalone all-family evaluation config; unlike the MVP harness it
# (a) routes the google_cluster aliased metrics to the SIX sketch families,
# (b) exports to data-plane:14317 (collapsed single-host port map), and
# (c) carries its own `opamp`-free service block so it runs as a bare
#     (non-supervised) collector. We run it static because the prebuilt
#     control-plane image emits a per-sketch (non-fused) config carrying an
#     `enable_series_id` receiver key the prebuilt collector rejects — a
#     version skew between the two prebuilt images. The static fused config
#     exercises the SAME asap_edge processor + the same backend
#     streaming-config the controller already POSTed.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 4096
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    send_batch_size: 800
    send_batch_max_size: 1500
  memory_limiter:
    check_interval: 1s
    limit_mib: 8192
    spike_limit_mib: 1024

  asap_edge:
    shard_count: 12
    # 60s window — MUST match the backend's precompute window (the controller
    # clamps the streaming-config window to 60s regardless of the query range,
    # and sketch queries only resolve when the agent emit window == backend
    # window). The driver aligns the replay to start just after a fresh 60s
    # wall-clock boundary so the full ~40s replay lands in ONE window; it then
    # waits for that window to seal naturally and verifies via sum==GT.
    window_duration: 60s
    drop_original: true
    max_series: 200000
    delta_transmission: false

    metrics:
      # Sum / exact-agg (lossless) — cluster cpu + per-zone memory
      - metric: google_cluster_2019_cpu_rate
        family: sum
        tier: both
      - metric: google_cluster_2019_memory_usage
        family: sum
        aggregate_by: [zone]
        tier: both
      # DDSketch quantile
      - metric: google_cluster_2019_cpu_rate_q_ddsketch
        family: ddsketch
        tier: warm
        delta_transmission: true
      # KLL quantile (no delta variant)
      - metric: google_cluster_2019_cpu_rate_q_kll
        family: kll
        tier: warm
        k: 200
      # CountSketch topk by host
      - metric: google_cluster_2019_cpu_rate_topk_cs
        family: countsketch
        tier: warm
        rows: 5
        cols: 2048
        delta_transmission: true
        emit_heap: true
        heap_size: 100
        item_label: host
      # Plain CountSketch topk by host, NO heap (head-to-head vs heap-bearing).
      # asap_edge's heap-bearing topk is a CountSketch-only feature (emit_heap
      # rejects countminsketch), so the "CMS-heap" comparison maps to
      # heap (above, ~bounded heap frame) vs no-heap (here, full count matrix).
      - metric: google_cluster_2019_cpu_rate_topk_cms
        family: countsketch
        tier: warm
        rows: 5
        cols: 2048
        delta_transmission: true
        item_label: host
      # HLL distinct-service cardinality
      - metric: google_cluster_2019_cpu_rate_card_hll
        family: hll
        tier: warm
        delta_transmission: true
        item_label: service
      # CountMinSketch per-item frequency
      - metric: google_cluster_2019_cpu_rate_freq_cms
        family: countminsketch
        tier: warm
        rows: 5
        cols: 2048
        delta_transmission: true
        item_label: service

    cold:
      enabled: true
      ship_endpoint: http://gorilla-merger:10908/ingest/gorilla
      block_duration: 60s
      reorder_grace: 2s
      external_labels:
        cluster: asap-mvp

    control_channel:
      enabled: false

exporters:
  otlp/backend:
    endpoint: data-plane:14317
    tls:
      insecure: true
    # Large flush bursts (first window ships full state for all series at
    # once); raise the per-RPC timeout + queue so the seal doesn't time out.
    timeout: 120s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 5000

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, asap_edge, batch]
      exporters: [otlp/backend]
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8890

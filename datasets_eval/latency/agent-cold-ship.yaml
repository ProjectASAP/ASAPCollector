# Cold-ON edge agent for the Fig 7 cold-fallback latency arm.
#
# Derived from datasets_eval/multisketch/agent-ddsketch-coldon.yaml, but
# with a COMPLETE cold block (ship_endpoint + block_duration +
# external_labels) so the edge actually SHIPS cold ASAPFRG1 fragments to
# the gorilla-merger. The multisketch coldon config only set
# `cold: {enabled: true}` with NO ship_endpoint, which the asapedge
# processor treats as DRAIN-ONLY (no shipping) — that is why the
# original cold arm landed an empty MinIO (config.go: "Empty =>
# drain-only (no shipping)").
#
# The lossless raw `google_cluster_2019_cpu_rate` Sum family (tier: both)
# is the series that ships cold; the data-plane routes its queries to the
# gorilla cold tier (backend-storage-routing-coldon.yaml).
receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317, max_recv_msg_size_mib: 4096}
      http: {endpoint: 0.0.0.0:4318}
processors:
  batch:
    send_batch_size: 800
    send_batch_max_size: 1500
  memory_limiter: {check_interval: 1s, limit_mib: 8192, spike_limit_mib: 1024}
  asap_edge:
    shard_count: 12
    window_duration: 60s
    drop_original: true
    max_series: 200000
    delta_transmission: false
    metrics:
      - {metric: google_cluster_2019_cpu_rate, family: sum, tier: both}
      - {metric: google_cluster_2019_memory_usage, family: sum, aggregate_by: [zone], tier: both}
      - metric: google_cluster_2019_cpu_rate_q_ddsketch
        family: "ddsketch"
        tier: "both"
        delta_transmission: true
    cold:
      enabled: true
      ship_endpoint: http://gorilla-merger:10908/ingest/gorilla
      block_duration: 60s
      reorder_grace: 2s
      external_labels:
        # MUST be non-empty: Thanos rejects a block with empty external
        # labels ("empty external labels are not allowed for Thanos
        # block"); matches the merger's --external-labels cluster=asap-mvp.
        cluster: asap-mvp
    control_channel: {enabled: false}
exporters:
  otlp/backend:
    endpoint: data-plane:14317
    tls: {insecure: true}
    timeout: 120s
    sending_queue: {enabled: true, num_consumers: 4, queue_size: 5000}
service:
  pipelines:
    metrics: {receivers: [otlp], processors: [memory_limiter, asap_edge, batch], exporters: [otlp/backend]}
  telemetry:
    metrics:
      level: detailed
      readers: [{pull: {exporter: {prometheus: {host: 0.0.0.0, port: 8890}}}}]

# Cold-arm storage-routing table (Fig 7 cold-fallback latency arm).
#
# Routes the lossless raw `google_cluster_2019_cpu_rate` series — the
# Sum family the cold-enabled agent ships to the gorilla cold tier
# (MinIO via the merger) — to `gorilla_object_store`, so its PromQL
# queries are answered by the ThanosQueryEngine (data_source =
# thanos_query). This is what makes the COLD/archive path observable
# end-to-end: an instant query against this metric is dispatched
# through EngineRouter to thanos-query, which resolves the answer over
# the gorilla-merger StoreAPI + thanos-store-gateway (S3/MinIO blocks).
#
# `double_write` routes the metric to BOTH warm sketches and the
# archive, with the cost-aware dispatcher picking per query. We use
# the single-target `gorilla_object_store` here to GUARANTEE every
# timed query lands on the cold path (no warm shortcut) — we are
# measuring the cold arm, so we force the cold engine.
#
# Used by datasets_eval/latency/stack-coldon.sh (cold-ON stack).

default: sketch_store

routes:
  - metric: google_cluster_2019_cpu_rate
    targets:
      - backend: gorilla_object_store
        # all shapes route to the cold archive — sum / count /
        # quantile_over_time over the raw shipped samples are all
        # computed by thanos-query over the merger StoreAPI.
        applies_to_query_shape: [count, topk, rate_post_hoc, quantile, sum, last_over_time, other]

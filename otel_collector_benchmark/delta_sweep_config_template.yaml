# delta_sweep_config_template.yaml
#
# Template for the (window_duration x delta_threshold) sweep run by
# bench_delta_sweep.sh. Placeholders (substituted at render time):
#   WINDOW     -> e.g. "1s", "5s", "30s", "5m"
#   THRESHOLD  -> e.g. "0", "0.1", "1.0"
#   PROCESSOR  -> "countmin" or "countsketch"
#   PROC_BLOCK -> the body of the processor (rows/columns vs epsilon/delta)
#
# The script picks the right processor block per sketch type, then writes
# the rendered file to a per-cell tmp directory. The collector exports
# metrics over the prometheus exporter on :8889; bandwidth-out is measured
# by polling /metrics every second from the sweep harness.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 64
      http:
        endpoint: 0.0.0.0:4318

processors:
  ${PROCESSOR}:
${PROC_BLOCK}
    transmit_sketch: true
    drop_original: true
    window_duration: ${WINDOW}
    delta_transmission: true
    delta_threshold: ${THRESHOLD}

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [${PROCESSOR}]
      exporters: [prometheus]
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: warn
    resource:
      service.name: ${PROCESSOR}-sweep-w${WINDOW}-t${THRESHOLD}

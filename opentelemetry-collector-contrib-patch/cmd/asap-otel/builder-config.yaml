# MVP OpenTelemetry Collector distribution.
#
# Keep this manifest limited to components referenced by the MVP deployment
# and the retained Serf comparison arm.

dist:
  module: github.com/open-telemetry/opentelemetry-collector-contrib/cmd/asap-otel
  name: asap-otel
  description: ASAP MVP Collector with fused sketch processing and Serf baseline
  version: 0.141.0-dev
  output_path: ./cmd/asap-otel

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/opampextension v0.141.0
    path: ./extension/opampextension

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.141.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/serfreceiver v0.141.0
    path: ./receiver/serfreceiver

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.141.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.141.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/cumulativetodeltaprocessor v0.141.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/metricstransformprocessor v0.141.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/asapedgeprocessor v0.141.0
    path: ./processor/asapedgeprocessor
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/gorillas3processor v0.141.0
    path: ./processor/gorillas3processor
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/serfprocessor v0.141.0
    path: ./processor/serfprocessor

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.141.0
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.141.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.141.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/prometheusexporter v0.141.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/serfexporter v0.141.0
    path: ./exporter/serfexporter

connectors:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/routingconnector v0.141.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.47.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.47.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/httpprovider v1.47.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/httpsprovider v1.47.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.47.0

replaces:
  - github.com/open-telemetry/opentelemetry-collector-contrib => ../../../opentelemetry-collector-contrib
  - go.opentelemetry.io/collector => ../../../opentelemetry-collector
  - go.opentelemetry.io/collector/pdata => ../../../opentelemetry-collector/pdata
  - go.opentelemetry.io/collector/processor => ../../../opentelemetry-collector/processor
  - github.com/ProjectASAP/sketchlib-go => ../../../../sketchlib-go
  - github.com/ProjectASAP/asap-precompute-go => ../../../asap-precompute-go
  - github.com/ProjectASAP/asap-precompute-go/monitor/grpcclient => ../../../asap-precompute-go/monitor/grpcclient
  - github.com/ProjectASAP/asap-gorilla-go => ../../../asap-gorilla-go

# Matrix aggregation example for the KLL processor.
#
# A "matrix" aggregation selects related time series by label matching,
# collects their samples over a time range, and merges them into a single sketch.
#
# Two source modes are supported (same collector config works for both):
#
#   Mode 1 — SDK sends pre-aggregated sketches (fine granularity, e.g. 1 s reader
#             interval via e2esdkbench --sketch-type=kll). The collector merges the
#             per-series KLLSketch data points across series (aggregate_by) and across
#             time (window_duration) into one output sketch per group.
#
#   Mode 2 — SDK sends raw gauge values (e.g. e2esdkbench --sketch-type=baseline, or
#             any gauge instrument). The collector inserts the raw float64 samples from
#             all matching series into a single sketch per group.
#
# In both modes the label_matchers pre-filter which data points enter the sketch, and
# aggregate_by controls which label values define a "group" (cross-series merge key).
# The output data point carries only the aggregate_by labels.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:

processors:
  KLL:
    mode: window
    window_duration: 30s
    k: 256
    transmit_sketch: false
    quantiles: [0.5, 0.9, 0.99]

    # Cross-series (matrix) aggregation:
    # Only include data points where env=prod, then merge all series that share
    # the same "region" value into one sketch.  The output carries only "region".
    label_matchers:
      - key: env
        value: prod
    aggregate_by: [region]

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [KLL]
      exporters: [prometheus]
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: info
    resource:
      service.name: kllcol-matrix

# debug to see make sure output is correct
# recommended input:
# telemetrygen metrics --otlp-insecure --otlp-endpoint="localhost:4317" --rate 5 --duration 1s --workers 1 --unique-timeseries

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  KLL:
    k: 256
    transmit_sketch: false
    write_seen: true
    quantiles: 
      - 0.5
      - 0.99
    drop_original: true
    is_int: true
  
  batch:
    send_batch_size: 5000
    timeout: 200ms

exporters:
  file:
    path: output

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888
  
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [KLL, batch] 
      exporters: [file]

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  countmin:
    metric_name: "cms_bench_result" # Matches the script's grep logic
    rows: 5
    columns: 2000                   # Wider matrix for high-cardinality random data
    transmit_sketch: true
    group_by: []                    # Empty = 1 Global Sketch (Tests Hash/Lock speed)
    
    # CRITICAL: Logic triggers
    window_duration: 10s            # Accumulate for 10s, then emit ONE sketch
    drop_original: true             # Swallow raw data (don't forward 50k metrics/sec)

  batch:
    send_batch_size: 5000
    timeout: 200ms                  # Aggressive flushing for stability

exporters:
  # Accepts data and deletes it instantly. 
  # Used to measure maximum CPU throughput without Network/Disk I/O latency.
  nop: {}

  # Stores the latest sketch state in RAM so your script can check 'sample_count'.
  # We use port 9000 to avoid conflicting with internal telemetry (8888).
  prometheus:
    endpoint: "0.0.0.0:9000"

service:
  # Internal Collector Telemetry (CPU usage, Receiver stats)
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888          # Keep this on 8888 for the script's resource monitor
      level: normal

  pipelines:
    metrics:
      receivers: [otlp]
      processors: [countmin, batch]
      exporters: [nop, prometheus]  # Send to both

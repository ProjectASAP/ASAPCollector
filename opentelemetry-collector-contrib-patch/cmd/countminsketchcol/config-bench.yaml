receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"

processors:
  countmin:
    metric_name: "cms_bench_result"
    rows: 5
    columns: 2000
    seed: 1
    group_by: [] 

  batch:
    send_batch_size: 5000
    timeout: 200ms

exporters:
  nop: {}

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
      level: normal

  pipelines:
    metrics:
      receivers: [otlp]
      processors: [countmin, batch]
      exporters: [nop]
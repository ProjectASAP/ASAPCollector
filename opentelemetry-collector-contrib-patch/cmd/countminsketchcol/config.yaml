receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  countmin:
    metric_name: "cms_sketch_output"
    rows: 5
    columns: 2000
    transmit_sketch: true
    group_by: ["service.name", "method"]
    drop_original: true  # Do not forward the raw data, only the sketch
    window_duration: 10s # Aggregate 10s of data into 1 Sketch

  batch:
    send_batch_size: 5000 
    timeout: 1s

exporters:
  debug:
    verbosity: detailed

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [countmin, batch]
      exporters: [debug]

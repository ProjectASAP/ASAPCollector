# Benchmark mode: Delta CMS sketch transmission.
# SDK sends raw Float64Gauge data points every 1s; agent aggregates into CMS
# over a 10s window, then forwards only the sparse delta between consecutive
# windows. Implements Opt-1+2 (SerializeProtoBytesFO + sint64 varint) via
# the sketchlib-go commit b24e56e (sketchlib-go#45).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 64

processors:
  countmin:
    mode: window
    metric_name: "countmin_sketch"
    rows: 5
    columns: 2000
    transmit_sketch: true
    group_by: []
    drop_original: true
    window_duration: 10s
    delta_transmission: true
    delta_threshold: 1.0

exporters:
  otlp:
    endpoint: localhost:4319
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [countmin]
      exporters: [otlp]
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: warn
    resource:
      service.name: countminsketchcol-bench-cms-delta

# Builder manifest for the e2e harness — all five ASAP sketches
# (DDSketch + KLL + HLL + CountSketch + CountMinSketch). The agent
# uses sketchlib-go's portable proto / msgpack serializers; the
# bytes are wire-compatible with the Rust backend's
# `asap_sketchlib` / `sketch_core` decoders.
#
# Compared to the canonical `builder-config.yaml`, this minimal
# manifest excludes serfprocessor + gorillaprocessor (paper
# baselines for non-sketch encodings; not needed for sketch e2e)
# and the long tail of extension/exporter/receiver/connector
# entries that the upstream config carries by default. Trimming
# them keeps the build fast and the binary small without losing
# any sketch-path signal.

dist:
  module: github.com/open-telemetry/opentelemetry-collector-contrib/cmd/sketchcollector
  name: sketchcollector
  description: Sketchcollector with DDSketch + KLL + HLL + CountSketch + CountMinSketch (e2e harness)
  version: 0.141.0-dev-sketches
  output_path: ./cmd/sketchcollector

extensions:
  # OpAMP extension: lets the agent subscribe to remote configs
  # pushed by the controller's OpAMP server (`ws://controller:4320/v1/opamp`).
  # The controller's planner generates per-agent YAML and pushes it on
  # POST /api/v1/plan; without this extension the agent ignores those
  # pushes and runs its bootstrap config forever.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/opampextension v0.141.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.141.0
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.141.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.141.0
  # Required by the controller's `generate_agent_config` — the
  # default pushed yaml uses a Prometheus exporter at :8889 for
  # downstream scrape. Without this component the agent rejects
  # the pushed config with `'exporters' unknown type: "prometheus"`.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/prometheusexporter v0.141.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.141.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.141.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/attributesprocessor v0.141.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/ddsketchprocessor v0.141.0
    path: ./processor/ddsketchprocessor
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/kllprocessor v0.141.0
    path: ./processor/kllprocessor
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/hllprocessor v0.141.0
    path: ./processor/hllprocessor
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/countsketchprocessor v0.141.0
    path: ./processor/countsketchprocessor
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/countminsketchprocessor v0.141.0
    path: ./processor/countminsketchprocessor

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.141.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.47.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.47.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.47.0

replaces:
  - github.com/open-telemetry/opentelemetry-collector-contrib => ../../../opentelemetry-collector-contrib
  - go.opentelemetry.io/collector => ../../../opentelemetry-collector
  - go.opentelemetry.io/collector/pdata => ../../../opentelemetry-collector/pdata
  - go.opentelemetry.io/collector/processor => ../../../opentelemetry-collector/processor
  - github.com/ProjectASAP/sketchlib-go => ../../../../sketchlib-go

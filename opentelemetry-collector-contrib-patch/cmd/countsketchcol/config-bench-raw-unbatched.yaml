# Benchmark mode: Raw pass-through, unbatched (1s flush cadence).
# SDK sends raw Float64Gauge data points every 1s; agent forwards immediately
# without aggregation. Equivalent to raw telemetry transmission with no
# compression — the SDK's 1s PeriodicReader already batches one point per
# series per second via LastValue aggregation.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 64

processors:
  batch:
    timeout: 1s
    send_batch_size: 1000000  # effectively unlimited — flush on timeout only

exporters:
  otlp:
    endpoint: localhost:4319
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp]
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: warn
    resource:
      service.name: countsketchcol-bench-raw-unbatched

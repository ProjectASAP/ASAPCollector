receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  countsketch:
    transmit_sketch: false
    enable_self_monitoring: true
    epsilon: 0.02
    delta: 0.99
    window_duration: 5s
    drop_original: true 

exporters:
  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888
  
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [countsketch] 
      exporters: [debug]

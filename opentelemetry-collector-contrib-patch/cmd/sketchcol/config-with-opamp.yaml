# Collector config with OpAMP extension for controller-driven config updates.
#
# The controller can push new configs to this collector at runtime via
# the OpAMP WebSocket connection. No restart needed.
#
# Start: ./sketchcol --config file:config-with-opamp.yaml
#
# Environment variables:
#   CONTROLLER_OPAMP_ENDPOINT:  WebSocket URL (default: ws://controller:4320/v1/opamp)
#   AGENT_ID:                   Unique agent identifier (default: agent-001)

extensions:
  opamp:
    server:
      ws:
        endpoint: ${env:CONTROLLER_OPAMP_ENDPOINT:-ws://controller:4320/v1/opamp}
        headers:
          X-Agent-ID: ${env:AGENT_ID:-agent-001}
          X-Agent-Role: agent

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Default sketch processor — controller will push updated config via OpAMP
  ddsketch:
    mode: window
    window_duration: 60s
    relative_accuracy: 0.01
    quantiles: [0.5, 0.9, 0.99]
    transmit_sketch: true

exporters:
  otlp/backend:
    endpoint: ${env:BACKEND_ENDPOINT:-backend:4317}
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  extensions: [opamp]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [ddsketch]
      exporters: [otlp/backend, prometheus]

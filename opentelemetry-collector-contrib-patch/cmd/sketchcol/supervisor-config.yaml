# OpAMP Supervisor config for sketch collector.
#
# The supervisor connects to the controller's OpAMP server, receives
# remote config pushes (sketch type, parameters, window duration, etc.),
# and restarts the collector with the new config automatically.
#
# Usage:
#   ./opampsupervisor --config supervisor-config.yaml
#
# The supervisor will:
#   1. Connect to the controller's OpAMP WebSocket endpoint
#   2. Start the collector with the initial/bootstrap config
#   3. When the controller pushes a new config (e.g., after POST /api/v1/plan),
#      the supervisor writes the new YAML and restarts the collector

server:
  endpoint: ws://localhost:4320/v1/opamp
  headers:
    X-Agent-ID: sketch-agent-1
    X-Agent-Role: agent

capabilities:
  accepts_remote_config: true
  reports_remote_config: true
  reports_effective_config: true
  reports_health: true

storage:
  directory: /tmp/opamp-supervisor

agent:
  executable: ./countminsketchcol

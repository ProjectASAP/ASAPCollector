dist:
  module: github.com/open-telemetry/opentelemetry-collector-contrib/cmd/intervalcol
  name: intervalcol
  description: Minimal collector with only the contrib interval processor
  version: 0.141.0-dev
  output_path: ./cmd/intervalcol

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.141.0
    import: go.opentelemetry.io/collector/receiver/otlpreceiver

processors:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/intervalprocessor v0.141.0
    import: github.com/open-telemetry/opentelemetry-collector-contrib/processor/intervalprocessor
    path: ./processor/intervalprocessor

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.141.0
    import: go.opentelemetry.io/collector/exporter/otlpexporter

replaces:
  - github.com/open-telemetry/opentelemetry-collector-contrib => ../../..
  - go.opentelemetry.io/collector => ../../../opentelemetry-collector
  - go.opentelemetry.io/otel => ../../../opentelemetry-go
  - go.opentelemetry.io/proto/otlp => ../../../opentelemetry-proto/gen/go/go.opentelemetry.io/proto/otlp

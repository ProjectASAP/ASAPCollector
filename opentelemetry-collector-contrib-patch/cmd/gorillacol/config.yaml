receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 64

processors:
  gorilla:
    # Tumbling window: flush and compress every 10s so blocks are written
    # during the 60s benchmark run.
    window_interval: 10s
    drop_original: false
    local_dir: /tmp/gorilla-bench

  batch:
    send_batch_size: 5000
    timeout: 200ms

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

  pipelines:
    metrics:
      receivers: [otlp]
      processors: [gorilla, batch]
      exporters: [prometheus, debug]

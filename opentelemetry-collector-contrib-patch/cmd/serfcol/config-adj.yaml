receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 64

processors:
  serf:
    compression: xor
    window_interval: 10s
    max_diff: 1.0e-3
    # adjust_digit: shifts values by a fixed integer before FindAppLong so
    # the mantissa bits of consecutive samples align better.
    # Example: city temperatures (15–35 °C) → adjust_digit: 0
    #          stock prices (~245 USD)       → adjust_digit: 245
    #          city GPS latitude (~355°)     → adjust_digit: 355
    # Value 100 below approximates metrics in the 80–120 range (e.g. Celsius
    # offsets, percentage-scale counters). Replace with the integer nearest to
    # the mean of your metric series.
    adjust_digit: 100
    drop_original: false
    local_dir: /tmp/serf-bench-adj

  batch:
    send_batch_size: 5000
    timeout: 200ms

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

  pipelines:
    metrics:
      receivers: [otlp]
      processors: [serf, batch]
      exporters: [prometheus, debug]

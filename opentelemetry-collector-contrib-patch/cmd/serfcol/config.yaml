receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 64

processors:
  serf:
    # Tumbling window: flush and compress every 10s so blocks are written
    # during the 60s benchmark run.
    window_interval: 10s
    # Maximum absolute error tolerance for lossy Serf XOR approximation.
    # 1e-3 matches the default used in the Serf paper benchmarks.
    max_diff: 1.0e-3
    # Integer digit adjustment applied before XOR. 0 = no adjustment (safe
    # default for mixed-domain metrics from the load generator).
    adjust_digit: 0
    drop_original: false
    local_dir: /tmp/serf-bench

  batch:
    send_batch_size: 5000
    timeout: 200ms

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

  pipelines:
    metrics:
      receivers: [otlp]
      processors: [serf, batch]
      exporters: [prometheus, debug]

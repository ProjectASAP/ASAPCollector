receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 64

processors:
  serf:
    compression: xor
    window_interval: 10s
    # Looser error bound → better compression ratio, larger absolute error.
    # Paper sweep value: 1e-2.
    max_diff: 1.0e-2
    adjust_digit: 0
    drop_original: false
    local_dir: /tmp/serf-bench-1e2

  batch:
    send_batch_size: 5000
    timeout: 200ms

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

  pipelines:
    metrics:
      receivers: [otlp]
      processors: [serf, batch]
      exporters: [prometheus, debug]

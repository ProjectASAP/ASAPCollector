receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 64

processors:
  serf:
    compression: qt
    window_interval: 10s
    # Quantization step = 2 * max_diff * 0.999.
    # 1e-3 matches the Serf paper benchmark default.
    max_diff: 1.0e-3
    drop_original: false
    local_dir: /tmp/serf-qt-bench

  batch:
    send_batch_size: 5000
    timeout: 200ms

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

  pipelines:
    metrics:
      receivers: [otlp]
      processors: [serf, batch]
      exporters: [prometheus, debug]

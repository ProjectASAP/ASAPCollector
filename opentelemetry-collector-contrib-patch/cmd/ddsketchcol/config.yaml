receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  ddsketch:

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [ddsketch]
      exporters: [debug]
  telemetry:
    metrics:
      level: basic               # basic/normal/detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888       # same port you wanted before
    logs:
      level: info
    resource:
      service.name: ddsketchcol

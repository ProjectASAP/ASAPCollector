receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  ddsketch:
    mode: batch
    transmit_sketch: false
    enable_self_monitoring: true
    quantiles: [0.5, 0.9, 0.99]
    metric_suffix: "_quantile"

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [ddsketch]
      exporters: [prometheus]
  telemetry:
    metrics:
      level: basic               # basic/normal/detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888       # same port you wanted before
    logs:
      level: info
    resource:
      service.name: ddsketchcol

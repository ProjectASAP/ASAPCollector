receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  ddsketch:
    mode: window              # tumbling window mode
    window_duration: 10s      # shorter for benchmarking; production default is 60s
    relative_accuracy: 0.01
    emit_ddsketch: false
    quantiles: [0.5, 0.9, 0.99]
    metric_suffix: "_quantile"

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [ddsketch]
      exporters: [prometheus]
  telemetry:
    metrics:
      level: basic               # basic/normal/detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: info
    resource:
      service.name: ddsketchcol-window


receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 64

processors:
  nop:

  batch:
    send_batch_size: 5000
    timeout: 200ms

exporters:
  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888

  pipelines:
    metrics:
      receivers: [otlp]
      processors: [nop, batch]
      exporters: [debug]

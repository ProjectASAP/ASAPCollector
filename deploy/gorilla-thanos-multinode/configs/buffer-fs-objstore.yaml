# buffer-fs-objstore.yaml — Thanos FILESYSTEM objstore for gorilla-buffer-store.
# THIS is the config the buffer-store (hot-store) actually uses today.
#
# Points thanos store at the local directory written by gorilla-buffer-merger.
# gorilla-buffer-merger maintains one merged TSDB block per tumbling window
# (MERGE_WINDOW, configurable, default 1h) there, keeping the last
# BUFFER_STORE_DURATION of merged windows.
#
# Used in place of the S3 objstore (buffer-objstore.yaml, now unused) so the
# buffer-store reads the pre-merged local window blocks instead of re-reading
# individual 60s blocks from MinIO.
type: FILESYSTEM
config:
  directory: /var/gorilla-buffer/merged

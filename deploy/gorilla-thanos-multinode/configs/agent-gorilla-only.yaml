# agent-gorilla-only.yaml — OTel collector config: gorillas3 ONLY pipeline.
#
# ── What travels over the network with this config ────────────────────────
#
# INBOUND (producers → this agent):
#   gRPC port 4317  — standard OTLP/gRPC from fake-exporter producers
#   HTTP port 4318  — OTLP/HTTP (optional)
#
# OUTBOUND (this agent → backend):
#   S3 PUT to minio:9000 — Gorilla-compressed Prometheus TSDB blocks written
#   by gorillas3 processor. These are compact binary blocks, NOT raw OTLP.
#   Typical size: ~5–15 KB per block at 60s tsdb_block_duration.
#
#   NO outbound gRPC on port 4317: drop_original: true means the metric
#   stream does NOT reach the nop exporter. gorillas3 absorbs the data and
#   the downstream pipeline receives ZERO samples.
#   The nop exporter is required only because OTel's service graph validator
#   requires at least one exporter per pipeline.
#
# ── Why direct MinIO (no gorilla-gateway) ────────────────────────────────
#
# The gorilla-gateway hop was removed. gorillas3 now writes 60s TSDB blocks
# directly to MinIO (minio:9000). gorilla-buffer-store on node2 syncs from
# MinIO every 15s (vs. store-gateway's 30s) and serves only the last
# BUFFER_STORE_DURATION window of blocks, providing fresher query results
# while thanos-store-gateway covers all historical data.
#
# ── Image requirement ─────────────────────────────────────────────────────
#
# This config uses gorillas3 Phase 3 format: `bucket:` field is removed
# (confmap-strict rejects unknown keys). Requires asap/asap-otel:dev built
# after 2026-05-17 (gorillas3 B1 Phase 3, PR #388). To rebuild:
#   cd /mydata/ASAPCollector
#   bash restore_otel_collector_contrib_patches.sh
#   bash build_asap_otel.sh
#
# ── Pipeline summary ──────────────────────────────────────────────────────
#
# producers → [otlp receiver] → memory_limiter → gorillas3 → batch → [nop]
#                                                     ↓
#                                     S3 PUT (60s) → minio:9000
#                                                       ↓ sync 15s
#                                           gorilla-buffer-store (hot window)
#                                                       ↓ sync 30s
#                                          thanos-store-gateway (all history)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 4096
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 1280
    spike_limit_mib: 256

  gorillas3:
    window_interval: 60s
    drop_original: true
    endpoint: http://minio:9000
    region: us-east-1
    use_ssl: false
    access_key_id: asap
    secret_access_key: asap-local-only
    prefix_template: "{tenant}/{metric}/{YYYY}/{MM}/{DD}/{HH}/"
    tenant: default
    max_retries: 3
    retry_backoff: 1s
    upload_timeout: 30s
    block_format: prometheus_tsdb
    tsdb_bucket: asap-gorilla-tsdb
    tsdb_block_duration: 60s

  batch:
    send_batch_size: 1024
    timeout: 1s

exporters:
  nop: {}

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, gorillas3, batch]
      exporters: [nop]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8890

# Thanos object-store config for the gorilla-thanos-multinode stack.
#
# Points the Thanos store-gateway at the in-cluster MinIO that the
# gorillas3 processor populates with Prometheus-format TSDB blocks
# (block_format: prometheus_tsdb, tsdb_bucket: asap-gorilla-tsdb).
#
# NOTE: `endpoint` is host:port (NOT a URL). The Thanos S3 client
# constructs the URL internally — do NOT add http:// here.
# Credentials match MinIO MINIO_ROOT_USER / MINIO_ROOT_PASSWORD.
type: S3
config:
  bucket: asap-gorilla-tsdb
  endpoint: minio:9000
  access_key: asap
  secret_key: asap-local-only
  insecure: true
  signature_version2: false

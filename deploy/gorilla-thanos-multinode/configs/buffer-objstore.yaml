# buffer-objstore.yaml — LEGACY / UNUSED.
#
# Difference vs buffer-fs-objstore.yaml:
#   - buffer-objstore.yaml   (this file)        type: S3        — the OLD v2 "no-merge"
#       design where gorilla-buffer-store read the hot window straight from the MinIO
#       bucket with --min-time=-BUFFER_STORE_DURATION. NOT used anymore.
#   - buffer-fs-objstore.yaml (the active one)  type: FILESYSTEM — the current design
#       where gorilla-buffer-store reads the merged tumbling-window blocks that
#       gorilla-buffer-merger writes to local disk (/var/gorilla-buffer/merged).
#
# Kept only for reference / quick A-B comparison; the demo wires the buffer-store
# to buffer-fs-objstore.yaml. Safe to delete if the S3 hot-window path is dropped.
#
# (Historic notes for the S3 path below.)
# Points at the same MinIO bucket as thanos-objstore.yaml. gorilla-buffer-store
# used --min-time=-BUFFER_STORE_DURATION to serve only the hot window of recent
# blocks, syncing every 15s for lower latency than the main store-gateway (30s).
# Disk-backed cache (--data-dir) prevented OOM for large buffer windows.
type: S3
config:
  bucket: asap-gorilla-tsdb
  endpoint: minio:9000
  access_key: asap
  secret_key: asap-local-only
  insecure: true
  signature_version2: false

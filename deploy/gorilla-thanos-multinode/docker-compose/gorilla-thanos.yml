# gorilla-thanos.yml — Single-node docker-compose for local testing.
#
# Brings up the full gorilla-thanos stack on a single host (no gorilla-gateway):
#   MinIO + Thanos (store-gateway, query, compact) + gorilla-buffer-store + OTel agent + fake-exporter
#
# Pipeline:
#   agents write 60s TSDB blocks directly to MinIO (minio:9000, no gateway hop).
#   gorilla-buffer-merger: polls MinIO every 15s, downloads new 60s blocks to
#     /var/gorilla-buffer/staging/, buckets them by TUMBLING window (MERGE_WINDOW, default 1h), and
#     merges each window into one block in /var/gorilla-buffer/merged/ (one per
#     window). Drops windows older than BUFFER_STORE_DURATION.
#   gorilla-buffer-store (hot-store): thanos store with FILESYSTEM objstore on
#     /var/gorilla-buffer/merged/. Serves the recent merged tumbling windows via
#     StoreAPI :10921. (thanos-store-gateway is the archive-store, full MinIO history.)
#
# Quick start:
#   docker compose -f gorilla-thanos.yml up -d
#   # Wait ~60s for first TSDB block flush, then:
#   curl http://localhost:19092/api/v1/label/__name__/values   # metric names via Thanos
#   curl http://localhost:18890/metrics | grep gorilla          # agent self-metrics
#   # MinIO console: http://localhost:19001 (user: asap, pass: asap-local-only)
#
# Image notes:
#   asap/asap-otel:dev requires gorillas3 Phase 3 build (after 2026-05-17).
#     Rebuild: cd /mydata/ASAPCollector && bash restore_otel_collector_contrib_patches.sh && bash build_asap_otel.sh
#   asap/gorilla-buffer-merger:dev requires building:
#     cd /mydata/ASAPCollector && docker build -f deploy/docker/Dockerfile.gorilla-buffer-merger -t asap/gorilla-buffer-merger:dev .
#
# Note: host-port mappings are offset by 10000 from standard ports.

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: asap
      MINIO_ROOT_PASSWORD: asap-local-only
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 asap asap-local-only &&
        mc mb --ignore-existing local/asap-gorilla-tsdb &&
        mc anonymous set download local/asap-gorilla-tsdb &&
        echo 'Bucket ready'
      "

  thanos-store-gateway:
    image: quay.io/thanos/thanos:v0.41.0
    user: "0"
    command:
      - store
      - --objstore.config-file=/etc/thanos/objstore.yaml
      - --http-address=0.0.0.0:10902
      - --grpc-address=0.0.0.0:10901
      - --data-dir=/var/thanos/store
      - --sync-block-duration=30s
      - --block-sync-concurrency=20
    volumes:
      - ../configs/thanos-objstore.yaml:/etc/thanos/objstore.yaml:ro
      - thanos-store-data:/var/thanos/store
    depends_on:
      minio-setup:
        condition: service_completed_successfully

  # gorilla-buffer-merger — tumbling-window TSDB block merger.
  # Polls MinIO every 15s, downloads new blocks to staging, buckets them by
  # tumbling window (MERGE_WINDOW, configurable, default 1h), and merges each
  # window into one block (one per window) in the shared gorilla-buffer volume.
  # The window is the granularity at which merged state is flushed to S3/MinIO;
  # the agent's per-block emit interval (tsdb_block_duration) is independent.
  # Windows older than
  # BUFFER_STORE_DURATION are dropped; finalized windows are never re-merged.
  gorilla-buffer-merger:
    image: asap/gorilla-buffer-merger:dev
    user: "0"
    command:
      - -bucket=asap-gorilla-tsdb
      - -endpoint=minio:9000
      - -access-key=asap
      - -secret-key=asap-local-only
      - -window=${MERGE_WINDOW:-1h}
      - -retention=${BUFFER_STORE_DURATION:-1h}
      - -poll-interval=15s
      - -staging-dir=/var/gorilla-buffer/staging
      - -output-dir=/var/gorilla-buffer/merged
    volumes:
      - gorilla-buffer-data:/var/gorilla-buffer
    depends_on:
      minio-setup:
        condition: service_completed_successfully

  # gorilla-buffer-store (hot-store) — serves the merged tumbling-window blocks via StoreAPI.
  # Reads from the local FILESYSTEM directory written by gorilla-buffer-merger.
  # Serves the last BUFFER_STORE_DURATION of merged windows (one block per window, not 60).
  gorilla-buffer-store:
    image: quay.io/thanos/thanos:v0.41.0
    user: "0"
    command:
      - store
      - --objstore.config-file=/etc/thanos/objstore.yaml
      - --http-address=0.0.0.0:10922
      - --grpc-address=0.0.0.0:10921
      - --data-dir=/var/thanos/buffer-store
      - --sync-block-duration=20s
      - --block-sync-concurrency=4
    volumes:
      - ../configs/buffer-fs-objstore.yaml:/etc/thanos/objstore.yaml:ro
      - gorilla-buffer-data:/var/gorilla-buffer:ro
      - gorilla-buffer-store-cache:/var/thanos/buffer-store
    ports:
      - "19921:10921"
      - "19922:10922"
    depends_on:
      - gorilla-buffer-merger

  thanos-query:
    image: quay.io/thanos/thanos:v0.41.0
    command:
      - query
      - --http-address=0.0.0.0:10903
      - --endpoint=thanos-store-gateway:10901
      - --endpoint=gorilla-buffer-store:10921
    ports:
      - "19092:10903"
    depends_on:
      - thanos-store-gateway
      - gorilla-buffer-store

  thanos-compact:
    image: quay.io/thanos/thanos:v0.41.0
    user: "0"
    command:
      - compact
      - --objstore.config-file=/etc/thanos/objstore.yaml
      - --data-dir=/var/thanos/compact
      - --retention.resolution-raw=30d
      - --retention.resolution-5m=180d
      - --retention.resolution-1h=1y
      - --compact.concurrency=1
      - --wait
      - --http-address=0.0.0.0:10904
    volumes:
      - ../configs/thanos-objstore.yaml:/etc/thanos/objstore.yaml:ro
      - thanos-compact-data:/var/thanos/compact
    depends_on:
      minio-setup:
        condition: service_completed_successfully

  otel-agent:
    image: asap/asap-otel:dev
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ../configs/agent-gorilla-only.yaml:/etc/otel/config.yaml:ro
    ports:
      - "14317:4317"
      - "14318:4318"
      - "18890:8890"
    depends_on:
      minio-setup:
        condition: service_completed_successfully

  fake-exporter:
    image: asap/fake-exporter:dev
    environment:
      EXPORTER_TARGET: otel-agent:4317
      EXPORTER_CARDINALITY: ${EXPORTER_CARDINALITY:-1000}
      EXPORTER_FREQ_HZ: ${EXPORTER_FREQ_HZ:-10}
      EXPORTER_RATE: ${EXPORTER_RATE:-1000}
      EXPORTER_SDK_WINDOW: ${EXPORTER_SDK_WINDOW:-1s}
      EXPORTER_SDK_AGG: ${EXPORTER_SDK_AGG:-default}
      EXPORTER_MAX_BUFFER_PER_SERIES: ${EXPORTER_MAX_BUFFER_PER_SERIES:-10}
      EXPORTER_FRESHNESS_PROBES: ${EXPORTER_FRESHNESS_PROBES:-on}
      EXPORTER_FRESHNESS_PROBE_HZ: ${EXPORTER_FRESHNESS_PROBE_HZ:-1.0}
      EXPORTER_FIVE_SKETCH: ${EXPORTER_FIVE_SKETCH:-off}
    depends_on:
      - otel-agent

volumes:
  minio-data:
  thanos-store-data:
  thanos-compact-data:
  gorilla-buffer-data:
  gorilla-buffer-store-cache:

# gorilla-thanos.yml — Single-node docker-compose for local testing.
#
# Brings up the full gorilla-thanos stack on a single host (no gorilla-gateway):
#   MinIO + Thanos (store-gateway, query, compact) + gorilla-head-merger + gorilla-buffer-store + OTel agent + fake-exporter
#
# Pipeline:
#   agent builds 60s Gorilla blocks and POSTs them to gorilla-head-merger:9099/ingest
#     (ship_endpoint), NOT to MinIO.
#   gorilla-head-merger: receives per-emit blocks over HTTP, durably stages them in
#     /var/gorilla-buffer/served/ (block-level WAL + hot-store source), and on TUMBLING
#     window close (MERGE_WINDOW, default 1h) concatenates each window's per-series
#     chunks into one block, uploads that single block to MinIO, then prunes the
#     per-emit blocks. Drops windows older than BUFFER_STORE_DURATION.
#   gorilla-buffer-store (hot-store): thanos store with FILESYSTEM objstore on
#     /var/gorilla-buffer/served/. Serves the current window's per-emit blocks (fresh)
#     + recent cut blocks via StoreAPI :10921. (thanos-store-gateway is the
#     archive-store, MinIO cut-block history.)
#
# Quick start:
#   docker compose -f gorilla-thanos.yml up -d
#   # Wait ~60s for first TSDB block flush, then:
#   curl http://localhost:19092/api/v1/label/__name__/values   # metric names via Thanos
#   curl http://localhost:18890/metrics | grep gorilla          # agent self-metrics
#   # MinIO console: http://localhost:19001 (user: asap, pass: asap-local-only)
#
# Image notes:
#   asap/asap-otel:dev requires gorillas3 Phase 3 build (after 2026-05-17).
#     Rebuild: cd /mydata/ASAPCollector && bash restore_otel_collector_contrib_patches.sh && bash build_asap_otel.sh
#   asap/gorilla-head-merger:dev requires building:
#     cd /mydata/ASAPCollector && docker build -f deploy/docker/Dockerfile.gorilla-head-merger -t asap/gorilla-head-merger:dev .
#
# Note: host-port mappings are offset by 10000 from standard ports.

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: asap
      MINIO_ROOT_PASSWORD: asap-local-only
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 asap asap-local-only &&
        mc mb --ignore-existing local/asap-gorilla-tsdb &&
        mc anonymous set download local/asap-gorilla-tsdb &&
        echo 'Bucket ready'
      "

  thanos-store-gateway:
    image: quay.io/thanos/thanos:v0.41.0
    user: "0"
    command:
      - store
      - --objstore.config-file=/etc/thanos/objstore.yaml
      - --http-address=0.0.0.0:10902
      - --grpc-address=0.0.0.0:10901
      - --data-dir=/var/thanos/store
      - --sync-block-duration=30s
      - --block-sync-concurrency=20
    volumes:
      - ../configs/thanos-objstore.yaml:/etc/thanos/objstore.yaml:ro
      - thanos-store-data:/var/thanos/store
    depends_on:
      minio-setup:
        condition: service_completed_successfully

  # gorilla-head-merger — local head block + block-level WAL.
  # Receives per-emit Gorilla blocks from agents over HTTP (:9099/ingest), durably
  # stages them in the served dir (WAL + hot-store source), and on tumbling-window
  # close (MERGE_WINDOW, configurable, default 1h) concatenates each window's
  # per-series chunks into one block, uploads that single block to S3/MinIO, then
  # prunes the per-emit blocks. The window is the granularity at which the head is
  # cut and flushed to S3/MinIO; the agent's per-emit interval (tsdb_block_duration)
  # is independent. Windows older than BUFFER_STORE_DURATION are dropped.
  gorilla-head-merger:
    image: asap/gorilla-head-merger:dev
    user: "0"
    command:
      - -bucket=asap-gorilla-tsdb
      - -endpoint=minio:9000
      - -access-key=asap
      - -secret-key=asap-local-only
      - -window=${MERGE_WINDOW:-1h}
      - -retention=${BUFFER_STORE_DURATION:-1h}
      - -cut-interval=15s
      - -ingest-addr=:${MERGER_INGEST_PORT:-9099}
      - -served-dir=/var/gorilla-buffer/served
    volumes:
      - gorilla-buffer-data:/var/gorilla-buffer
    ports:
      - "${MERGER_INGEST_PORT:-9099}:${MERGER_INGEST_PORT:-9099}"
    depends_on:
      minio-setup:
        condition: service_completed_successfully

  # gorilla-buffer-store (hot-store) — serves the head-merger's served dir via StoreAPI.
  # Reads the FILESYSTEM objstore (served dir): the current window's per-emit blocks
  # (fresh) + the recent cut window blocks. The merger handles expiry.
  gorilla-buffer-store:
    image: quay.io/thanos/thanos:v0.41.0
    user: "0"
    command:
      - store
      - --objstore.config-file=/etc/thanos/objstore.yaml
      - --http-address=0.0.0.0:10922
      - --grpc-address=0.0.0.0:10921
      - --data-dir=/var/thanos/buffer-store
      - --sync-block-duration=20s
      - --block-sync-concurrency=4
    volumes:
      - ../configs/buffer-fs-objstore.yaml:/etc/thanos/objstore.yaml:ro
      - gorilla-buffer-data:/var/gorilla-buffer:ro
      - gorilla-buffer-store-cache:/var/thanos/buffer-store
    ports:
      - "19921:10921"
      - "19922:10922"
    depends_on:
      - gorilla-head-merger

  thanos-query:
    image: quay.io/thanos/thanos:v0.41.0
    command:
      - query
      - --http-address=0.0.0.0:10903
      - --endpoint=thanos-store-gateway:10901
      - --endpoint=gorilla-buffer-store:10921
    ports:
      - "19092:10903"
    depends_on:
      - thanos-store-gateway
      - gorilla-buffer-store

  thanos-compact:
    image: quay.io/thanos/thanos:v0.41.0
    user: "0"
    command:
      - compact
      - --objstore.config-file=/etc/thanos/objstore.yaml
      - --data-dir=/var/thanos/compact
      - --retention.resolution-raw=30d
      - --retention.resolution-5m=180d
      - --retention.resolution-1h=1y
      - --compact.concurrency=1
      - --wait
      - --http-address=0.0.0.0:10904
    volumes:
      - ../configs/thanos-objstore.yaml:/etc/thanos/objstore.yaml:ro
      - thanos-compact-data:/var/thanos/compact
    depends_on:
      minio-setup:
        condition: service_completed_successfully

  otel-agent:
    image: asap/asap-otel:dev
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ../configs/agent-gorilla-only.yaml:/etc/otel/config.yaml:ro
    ports:
      - "14317:4317"
      - "14318:4318"
      - "18890:8890"
    depends_on:
      minio-setup:
        condition: service_completed_successfully

  fake-exporter:
    image: asap/fake-exporter:dev
    environment:
      EXPORTER_TARGET: otel-agent:4317
      EXPORTER_CARDINALITY: ${EXPORTER_CARDINALITY:-1000}
      EXPORTER_FREQ_HZ: ${EXPORTER_FREQ_HZ:-10}
      EXPORTER_RATE: ${EXPORTER_RATE:-1000}
      EXPORTER_SDK_WINDOW: ${EXPORTER_SDK_WINDOW:-1s}
      EXPORTER_SDK_AGG: ${EXPORTER_SDK_AGG:-default}
      EXPORTER_MAX_BUFFER_PER_SERIES: ${EXPORTER_MAX_BUFFER_PER_SERIES:-10}
      EXPORTER_FRESHNESS_PROBES: ${EXPORTER_FRESHNESS_PROBES:-on}
      EXPORTER_FRESHNESS_PROBE_HZ: ${EXPORTER_FRESHNESS_PROBE_HZ:-1.0}
      EXPORTER_FIVE_SKETCH: ${EXPORTER_FIVE_SKETCH:-off}
    depends_on:
      - otel-agent

volumes:
  minio-data:
  thanos-store-data:
  thanos-compact-data:
  gorilla-buffer-data:
  gorilla-buffer-store-cache:

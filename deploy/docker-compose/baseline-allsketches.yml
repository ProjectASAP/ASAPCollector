# All-sketches single-agent demo overlay — paper §Architecture figure.
#
# Pairs with `deploy/configs/asap-otel-agent-allsketches.yaml`. One
# asap-otel agent runs ALL FIVE sketch families (DDSketch + KLL +
# HLL + CountSketch + CountMinSketch) concurrently in a single OTLP
# pipeline; the backend (already mounting the all-sketches
# `backend-inference.yaml` via base.yml) serves all five PromQL
# query families from that one agent.
#
# This is paper-figure / architecture-demo material, NOT §5
# evaluation data. The §5 sweep (`run_e2e_sweep.sh`) drives the
# per-sketch baselines (`baseline-{b3-delta,…}.yml`); this overlay
# is the YAML embodiment of the §3 architecture diagram for
# walkthrough / demo purposes.
#
#   AGENT_CONFIG=asap-otel-agent-allsketches.yaml \
#     docker compose \
#       -f deploy/docker-compose/base.yml \
#       -f deploy/docker-compose/agents-N1.yml \
#       -f deploy/docker-compose/baseline-allsketches.yml \
#       -f deploy/docker-compose/e2e-overlay.yml \
#       up -d
#
# Workload profile mirrors `baseline-b3-delta.yml` so the demo runs
# at the same load as the §5 sweep cells (1e5 cardinality × 100 Hz,
# ~50–70 % of one core on the Threadripper hardware described in
# `docs/phase-2-perf-deployment.md "Hardware"`). Override either
# from the host shell as needed.

services:
  controller:
    labels:
      asap.baseline: "allsketches-demo"

  fake-exporter:
    environment:
      EXPORTER_CARDINALITY: "${EXPORTER_CARDINALITY:-100000}"
      EXPORTER_FREQ_HZ: "${EXPORTER_FREQ_HZ:-100}"

# Baseline B4 selector — delta sketch with tunable window
# granularity via $SKETCH_WINDOW.  window-sweep.
#
#   SKETCH_WINDOW=10s AGENT_CONFIG=asap-otel-agent-b4-tunable.yaml \
#     docker compose -f base.yml -f agents-N1.yml \
#       -f baseline-b4-tunable.yml up -d
#
# Typical sweep: 5s / 30s / 60s / 300s. Shorter = fresher
# quantiles (accuracy-critical paths). Longer = fewer bytes-per-
# window (bandwidth-critical paths).
#
# $SKETCH_WINDOW is plumbed through agents-N*.yml's env block to
# every agent (default 60s), so this overlay is strictly a
# naming marker.

services:
  controller:
    labels:
      asap.baseline: "b4-tunable"

# Trace-replay overlay — composes with any baseline-*.yml to swap
# the synthetic log-normal workload for a CSV-driven trace replay.
# N=1 only; for N>1 copy the x-trace-fake-exporter anchor onto
# fake-exporter-{2..N} in a matching trace-replay-N<K>.yml.
#
# Usage:
#
#   EXPORTER_TRACE_FILE=/trace/demo-trace.csv \
#     docker compose -f base.yml -f agents-N1.yml \
#       -f baseline-b3-delta.yml -f trace-replay.yml up -d
#
# The CSV is bind-mounted from the host repo at
# `deploy/fake-exporter/traces/`. Drop your own preprocessed
# Google-cluster-trace CSV in there (same schema as
# `demo-trace.csv`) and point `EXPORTER_TRACE_FILE` at it to run
# real workloads against the baselines.

services:
  fake-exporter:
    environment:
      EXPORTER_TRACE_FILE: "${EXPORTER_TRACE_FILE:-/trace/demo-trace.csv}"
      EXPORTER_TRACE_SCALE: "${EXPORTER_TRACE_SCALE:-1.0}"
      EXPORTER_TRACE_LOOP: "${EXPORTER_TRACE_LOOP:-true}"
    volumes:
      - ../fake-exporter/traces:/trace:ro

# Baseline B0 — stock OTel → real Prometheus (issue #46 v4 MVP).
#
# Realistic baseline that the paper compares ASAP against.
# Pipeline:
#
#   producer ──OTLP──▶ agent ──PRW──▶ Prometheus :9090
#
# No precompute_engine in the loop. Prometheus's own TSDB +
# PromQL evaluator answer queries; the backend container is
# present in `base.yml` but irrelevant to this baseline (the
# replay client targets Prometheus directly).
#
# Bring up via:
#
#   AGENT_CONFIG=sketchcol-agent-b0-prometheus.yaml \
#     docker compose -f base.yml -f agents-N10.yml \
#       -f baseline-b0-prometheus.yml up -d
#
# Notes:
#   - Adds `--web.enable-remote-write-receiver` to Prometheus so
#     the PRW exporter on every agent has a sink.
#   - Mounts `prometheus-with-remote-write.yml` over the default
#     `prometheus.yml`; the v4 config keeps the existing scrape
#     targets and just enables the OTLP-conversion knob the
#     remote-write path needs.
#   - The fake-exporter still talks to `agent-1:4317` (set in
#     agents-N10.yml). The PRW path activates inside the agent.
#   - Ad-hoc queries during the demo target Prometheus's
#     :9090/api/v1/query, NOT the precompute backend's :19091.

services:
  controller:
    labels:
      asap.baseline: "b0-prometheus"

  prometheus:
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=otlp-write-receiver"
    volumes:
      - ../configs/prometheus-with-remote-write.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

volumes:
  prometheus-data:

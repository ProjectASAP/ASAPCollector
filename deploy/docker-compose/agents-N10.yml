# Overlay: 10 edge agents. Mid-scale point — what the paper
# uses for bandwidth / per-node CPU reduction figures when 100
# agents overwhelms the local box.
#
# Written as an explicit per-service list (rather than `deploy:
# replicas:` which only works under Swarm) so each agent gets a
# distinct AGENT_ID label for Prometheus scrape differentiation.
#
# See README.md for the commented one-shot generator if you
# want to regenerate this file at a different N.

version: "3.9"

x-agent: &agent-base
  image: asap/sketchcol:dev
  depends_on:
    - gateway
    - controller
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: 512M

services:
  agent-1:   { <<: *agent-base, hostname: agent-1,   environment: { AGENT_ID: "agent-1",   OTEL_EXPORTER_OTLP_ENDPOINT: "http://gateway:4317", CONTROLLER_OPAMP_URL: "ws://controller:4320/v1/opamp", SKETCH_RUNTIME_GRPC_ENDPOINT: "http://controller:4321", RUST_LOG: "info" } }
  agent-2:   { <<: *agent-base, hostname: agent-2,   environment: { AGENT_ID: "agent-2",   OTEL_EXPORTER_OTLP_ENDPOINT: "http://gateway:4317", CONTROLLER_OPAMP_URL: "ws://controller:4320/v1/opamp", SKETCH_RUNTIME_GRPC_ENDPOINT: "http://controller:4321", RUST_LOG: "info" } }

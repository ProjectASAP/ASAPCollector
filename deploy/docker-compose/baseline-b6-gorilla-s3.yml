# Baseline B6 — Gorilla-S3 cold-engine tier (issue-46 MVP demo).
#
#   AGENT_CONFIG=asap-otel-agent-b6-gorilla-s3.yaml \
#     docker compose -f base.yml -f agents-N1.yml \
#       -f baseline-b6-gorilla-s3.yml -f e2e-overlay.yml up -d
#
# Layers two independent paths on the agent's metrics pipeline:
#
#   1. ASAP all-sketches warm tier  — DDSketch + KLL + HLL +
#      CountSketch + CountMinSketch processors emit typed sketch
#      data points to the gateway → backend (warm-tier PromQL).
#   2. Gorilla-S3 cold archive       — gorillas3processor encodes
#      raw samples with Gorilla XOR-delta, writes 60s ASGB chunks
#      to MinIO under bucket `asap-gorilla`. Backend's
#      GorillaQueryEngine answers cold-tier queries via
#      `data_source: gorilla_archive`.
#
# This is the "double-write" mode the cold-engine design (PRs
# #280-#283 + backend #84-#87) describes: warm tier sees sketched
# OTLP, cold tier sees the raw-encoded Gorilla chunks in S3.
# Cold-fallback queries (PromQL shapes that the warm-tier inference
# table doesn't cover) hit the cold engine and return exact (ε=0)
# results.
#
# Bucket `asap-gorilla` is created on stack-up by the
# `minio-setup-gorilla` job below (additive to base.yml's
# `minio-setup` which only creates `raw`).

services:
  controller:
    labels:
      asap.baseline: "b6-gorilla-s3"

  # v3 (issue #46 multi-agent / cardinality redesign): the v2 4 GiB
  # mem_limit override on agent-1 was needed because v2 ran a single
  # agent at cardinality=10000 with all-five-sketches, which OOM'd
  # inside the default 1 GiB ceiling. v3 redistributes the working
  # set across N=10 agents at cardinality=1000 each — the realistic
  # deployment shape — so the per-agent footprint fits inside the
  # 1 GiB ceiling `agents-N10.yml` ships with. The override has
  # been dropped; if a workload trips it again, prefer scaling N up
  # rather than bumping the per-agent ceiling.

  # Additive bucket-seed for the Gorilla-S3 cold tier. base.yml's
  # `minio-setup` only creates the `raw` bucket (used by the
  # producer raw_tee + LocalFsColdStore JSONL fallback); the
  # cold-engine writes to a SEPARATE bucket so the two paths can
  # be reasoned about independently.
  minio-setup-gorilla:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set asap http://minio:9000 asap asap-local-only &&
        mc mb --ignore-existing asap/asap-gorilla &&
        mc anonymous set download asap/asap-gorilla &&
        echo "asap-gorilla bucket ready"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Backend env to point GorillaQueryEngine at the same MinIO.
  # The Phase-5/6 backend reads these on startup (see
  # `asap-query-engine/src/drivers/query/fallback/cold_store/gorilla_s3.rs::GorillaS3Config::from_env`)
  # and registers a `GorillaQueryEngine` on the capability router
  # with `data_source_id=gorilla_archive`. Bucket + region are
  # required; the rest fall back to defaults.
  #
  # v3 also mounts `backend-storage-routing.yaml` into the backend so
  # the HTTP query handler consults the per-metric routing table on
  # every request. Without this, the handler would fall back to
  # `StreamingConfig::storage_backend()` (always `SketchWarmTier` for
  # YAML-loaded configs) and silently bypass the EngineRouter — the
  # v2 criterion ⑤ failure mode. The `ASAP_BACKEND_STORAGE_ROUTING`
  # env var on the backend's CLI flag points at the mounted file;
  # the binary handles both the `query_engine_rust` and the
  # deployed `precompute_engine` entrypoints.
  backend:
    environment:
      ASAP_GORILLA_S3_ENDPOINT: "http://minio:9000"
      ASAP_GORILLA_S3_BUCKET: "asap-gorilla"
      ASAP_GORILLA_S3_REGION: "us-east-1"
      ASAP_GORILLA_S3_ACCESS_KEY_ID: "asap"
      ASAP_GORILLA_S3_SECRET_ACCESS_KEY: "asap-local-only"
      ASAP_GORILLA_S3_TENANT: "default"
      ASAP_GORILLA_S3_USE_SSL: "false"
      ASAP_GORILLA_S3_PREFIX_TEMPLATE: "{tenant}/{metric}/{YYYY}/{MM}/{DD}/{HH}/"
      ASAP_BACKEND_STORAGE_ROUTING: "/etc/asap/backend-storage-routing.yaml"
    volumes:
      - ../configs/backend-storage-routing.yaml:/etc/asap/backend-storage-routing.yaml:ro

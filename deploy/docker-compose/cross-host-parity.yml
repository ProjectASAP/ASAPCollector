# Phase 5 step E binary-mode parity harness.
#
# Brings up sketchcol, sketchotap, and (optionally, profile=telegraf)
# sketchtelegraf, plus a single shared query-backend instance and a
# small `envelope-tap` driver container that drives the canonical
# golden input through each agent and captures the emitted envelope
# bytes + PromQL responses.
#
# # Topology
#
# Each agent is configured to:
#   1. Receive on its native input protocol (OTLP gRPC for sketchcol /
#      sketchotap; line-protocol via http_listener_v2 for telegraf).
#   2. Run the unified ASAP sketch processor / plugin.
#   3. Emit envelopes to the envelope-tap (a tiny in-process OTLP
#      receiver that writes the raw SketchEnvelope.Payload bytes to
#      /captures/<agent>/<sketch>_envelope.bin keyed by metric name).
#
# The query-backend is fed each agent's envelopes in turn (the tap
# routes captures to a per-agent backend instance via the agent name
# encoded in the resource attributes). The replay-promql driver then
# issues queries-e2e.json against each backend instance and writes
# the JSON responses under /captures/promql/.
#
# # Image expectations
#
# All images are built host-side per the Dockerfile.<name> headers.
# This compose file does NOT build them; if any image is missing,
# `docker compose up` fails with a clear "image not found" error.
# See run_parity.sh's prerequisite check for the full image list +
# build commands.
#
# # Why this is a separate compose file
#
# The existing deploy/docker-compose/{base.yml, e2e-overlay*.yml}
# files target the eval pipeline (single-sketch end-to-end, Prometheus
# scrape, etc.). Phase 5 step E is a multi-agent cross-comparison —
# the topology is fundamentally different (three agents into one tap,
# not one agent into one backend). Sharing wouldn't simplify anything.

services:
  # === Agents ============================================================
  sketchcol:
    image: asap/sketchcol:dev
    container_name: parity-sketchcol
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      # Agent configs live next to the test driver under
      # integration/cross_host_parity/configs/ — keeps Phase 5E's
      # per-agent shape co-located with the harness that drives them
      # rather than scattered through deploy/configs/, which is owned
      # by the eval pipeline (agent #13).
      - ../../integration/cross_host_parity/configs/sketchcol.yaml:/etc/otel/config.yaml:ro
    environment:
      - ASAP_AGENT_ID=sketchcol
    networks:
      - parity-net
    # OTLP receiver port; envelope-tap drives this directly.
    expose:
      - "4317"

  sketchotap:
    image: asap/sketchotap:dev
    container_name: parity-sketchotap
    command: ["--config=/etc/otap/config.yaml"]
    volumes:
      - ../../integration/cross_host_parity/configs/sketchotap.yaml:/etc/otap/config.yaml:ro
    environment:
      - ASAP_AGENT_ID=sketchotap
    networks:
      - parity-net
    expose:
      - "4317"

  sketchtelegraf:
    profiles: ["telegraf"]
    image: asap/sketchtelegraf:dev
    container_name: parity-sketchtelegraf
    command: ["--config=/etc/telegraf/telegraf.conf"]
    volumes:
      - ../../integration/cross_host_parity/configs/sketchtelegraf.toml:/etc/telegraf/telegraf.conf:ro
    environment:
      - ASAP_AGENT_ID=sketchtelegraf
    networks:
      - parity-net
    # http_listener_v2 receives line-protocol drives.
    expose:
      - "8186"

  # === Envelope tap + query backend ======================================
  #
  # The tap is a tiny OTLP receiver that parses inbound
  # SketchEnvelope.Payload-carrying metric attributes and writes the raw
  # bytes to /captures/<agent>/<sketch>_envelope.bin. It also forwards
  # to query-backend so the same envelope stream can be queried via
  # PromQL — the tap container additionally exposes drive-parity (the
  # OTLP/line-protocol driver) and replay-promql (PromQL replay client).
  #
  # The tap is built from deploy/fake-exporter/ — that path already
  # carries the OTLP receive + envelope-extract logic the eval pipeline
  # uses. For Phase 5E the only addition is the per-agent capture
  # routing (resource attribute `asap.agent_id` encodes which agent
  # emitted the bytes; envelope-tap writes to the matching subdir).
  envelope-tap:
    image: asap/fake-exporter:dev
    container_name: parity-envelope-tap
    command: ["--mode=cross-host-parity-tap", "--capture-dir=/captures"]
    volumes:
      - ../../integration/cross_host_parity/captures:/captures
      - ../../integration/cross_host_parity/golden_input:/golden_input:ro
      - ../scripts/queries-e2e.json:/queries-e2e.json:ro
    networks:
      - parity-net

  query-backend:
    image: asap/query-backend:dev
    container_name: parity-query-backend
    command: ["--multi-tenant=by-agent-id"]
    networks:
      - parity-net
    expose:
      - "9090"

networks:
  parity-net:
    name: parity-net

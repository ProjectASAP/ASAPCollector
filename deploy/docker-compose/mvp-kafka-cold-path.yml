# Kafka-bridged cold-path overlay — durable_fragment mode demo.
#
# ── What this overlay adds ────────────────────────────────────────────
#
# Composes with `deploy/docker-compose/base.yml`:
#
#   docker compose -p asap-kafka-cold \
#       -f deploy/docker-compose/base.yml \
#       -f deploy/docker-compose/mvp-kafka-cold-path.yml up -d
#
# Brings up the durable_fragment cold-path:
#
#   agent-kafka  ──fragment metrics──▶  kafka  ──▶  gateway-kafka
#   (gorillas3 role=agent,                          (gorillas3 role=
#    drop_original=true,                             gateway_fragment,
#    delivery_mode=                                  delivery_mode=
#    durable_fragment)                               durable_fragment)
#                                                       │
#                                                       ▼
#                                                  MinIO (bucket
#                                                   asap-gorilla-tsdb)
#
# Reuses the existing `minio` from base.yml (host port 19000) — the
# overlay does NOT bring up a second MinIO. A short-lived
# `minio-setup-fragments` container pre-creates the
# `asap-gorilla-fragments` and `asap-gorilla-tsdb` buckets.
#
# ── Why a separate compose project name ───────────────────────────────
#
# `-p asap-kafka-cold` keeps this stack isolated from:
#
#   • the MVP demo on its default project (`asap-mvp`-ish, see
#     mvp-multi-stage.yml) which uses host ports 19090/19091,
#   • the gorilla_s3_e2e overlay (`-p asap-gorilla-e2e`, port range
#     29xxx).
#
# The overlay's only host-exposed port is `34317:4317` (agent OTLP gRPC)
# so the integration test driver can push the deterministic 100-sample
# fixture into the agent without going through fake-exporter.
#
# Kafka itself uses port 9092 *inside* the docker network; we do NOT
# expose 9092 on the host (no host-side Kafka clients in the e2e flow).
#
# ── Topic / bucket / encoding choices ─────────────────────────────────
#
#   topic   : asap.gorilla.fragments  (matches agent + gateway YAMLs)
#   buckets : asap-gorilla-fragments, asap-gorilla-tsdb (pre-seeded)
#   encoding: otlp_proto              (default; pinned in YAMLs)
#
# Topic is created with `--partitions 3 --replication-factor 1` by
# the kafka-init job. 3 partitions is the minimum useful for a
# multi-agent fan-out; replication-factor 1 because this is a
# single-broker dev stack (no replicas exist).

version: "3.9"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  # ───────── Kafka broker (KRaft mode, no Zookeeper) ────────────────────
  #
  # confluentinc/cp-kafka 7.6+ ships with KRaft (KIP-500 controller-as-
  # quorum) production-ready, so the broker can run without a
  # Zookeeper sidecar. Single-node `combined` mode: this container is
  # both the controller and the broker. KAFKA_NODE_ID/ROLES/QUORUM_VOTERS
  # are the canonical KRaft startup envs documented in cp-kafka's
  # quickstart.
  #
  # CLUSTER_ID is a fixed 22-char base64 ULID-shape string —
  # cp-kafka requires a stable cluster ID across restarts; a fixed
  # value keeps `up -d → down → up -d` idempotent without needing a
  # named volume to persist /var/lib/kafka/data/meta.properties.
  #
  # PLAINTEXT://kafka:9092 is the broker advertised listener for
  # in-cluster clients (the agent's kafkaexporter + the gateway's
  # kafkareceiver both reach kafka:9092 over the docker network).
  # The CONTROLLER listener is intra-broker and not exposed.
  kafka:
    image: confluentinc/cp-kafka:latest
    hostname: kafka
    environment:
      # KRaft node identity / quorum.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # Listeners.
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Single-broker so default replication = 1 for internal topics
      # too (offsets, txn, share). Stock defaults are 3 which would
      # block topic creation on a single-node deploy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Stable cluster id — see header comment.
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      # `kafka-broker-api-versions` is the lightest-weight RPC that
      # actually proves the broker is serving the listener. It returns
      # JSON describing supported API versions; on success exit 0.
      test:
        - "CMD-SHELL"
        - "kafka-broker-api-versions --bootstrap-server kafka:9092 >/dev/null 2>&1"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *default-logging

  # ───────── Topic seed — short-lived ──────────────────────────────────
  #
  # cp-kafka has KAFKA_AUTO_CREATE_TOPICS_ENABLE=true, but the auto-
  # created topic gets `num_partitions=1` (the broker default), which
  # collapses fan-out across hypothetical multi-agent producers. Pre-
  # create the topic with the partition count we want.
  #
  # Exits after creation; restart: "no" so a re-up does NOT re-run
  # (idempotent thanks to --if-not-exists).
  kafka-init:
    image: confluentinc/cp-kafka:latest
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        kafka-topics \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic asap.gorilla.fragments \
          --partitions 3 \
          --replication-factor 1 &&
        echo "topic asap.gorilla.fragments ready"
    restart: "no"
    logging: *default-logging

  # ───────── Bucket seed — short-lived ─────────────────────────────────
  #
  # The base.yml `minio-setup` only seeds `raw`. The Kafka cold-path
  # gateway PUTs to two new buckets:
  #
  #   • asap-gorilla-fragments — fragment-mode raw-chunk fallback
  #     (rarely written; the gorillas3 gateway_fragment role focuses
  #     on TSDB blocks, but the Config requires `bucket` to be non-
  #     empty so we give it a dedicated namespace).
  #   • asap-gorilla-tsdb      — Prometheus TSDB blocks; the canonical
  #     sink in fragment-mode. The integration test reads from this
  #     bucket via the host's MinIO port (19000) to assert round-trip
  #     correctness.
  #
  # Exits after creation; idempotent via `--ignore-existing`.
  minio-setup-fragments:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set asap http://minio:9000 asap asap-local-only &&
        mc mb --ignore-existing asap/asap-gorilla-fragments &&
        mc anonymous set download asap/asap-gorilla-fragments &&
        mc mb --ignore-existing asap/asap-gorilla-tsdb &&
        mc anonymous set download asap/asap-gorilla-tsdb &&
        echo "asap-gorilla-fragments and asap-gorilla-tsdb buckets ready"
    restart: "no"
    logging: *default-logging

  # ───────── Agent — gorillas3 role=agent, durable_fragment ────────────
  #
  # Mounts asap-otel-agent-kafka-fragment.yaml. The integration test
  # pushes 100 deterministic samples to the OTLP gRPC port exposed on
  # host 34317. The agent encodes them into XOR-delta fragments and
  # ships those fragments through the kafkaexporter to topic
  # asap.gorilla.fragments.
  #
  # depends_on kafka-init (NOT just kafka) so the topic exists with the
  # correct partition count before the producer's first send. With
  # AUTO_CREATE_TOPICS_ENABLE=true a missed dependency would still
  # work but with `num_partitions=1`.
  agent-kafka:
    image: asap/asap-otel:dev
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command:
      - "--config=/etc/otel/config.yaml"
    volumes:
      - ../configs/asap-otel-agent-kafka-fragment.yaml:/etc/otel/config.yaml:ro
    environment:
      # Optional source identity override; the YAML pins `edge-a` as
      # the default (see source_id under processors.gorillas3 in the
      # mounted config).
      ASAP_SOURCE_ID: "${ASAP_SOURCE_ID:-edge-a}"
    ports:
      # OTLP gRPC — the integration test pushes the deterministic
      # 100-sample fixture here. Host port 34317 picked to avoid
      # collision with:
      #   • base.yml gateway 14317
      #   • mvp 19090/19091
      #   • gorilla_s3_e2e 24317
      #   • backend 29xxx
      - "34317:4317"
    logging: *default-logging

  # ───────── Gateway — gorillas3 role=gateway_fragment, finalize ───────
  #
  # Mounts asap-otel-gateway-kafka-fragment.yaml. Consumes from
  # asap.gorilla.fragments via kafkareceiver, finalizes per-window
  # TSDB blocks, and PUTs them to MinIO bucket asap-gorilla-tsdb.
  #
  # depends_on BOTH kafka-init AND minio-setup-fragments so:
  #   • the consumer's topic exists,
  #   • the destination buckets exist before the first window flush.
  gateway-kafka:
    image: asap/asap-otel:dev
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio-setup-fragments:
        condition: service_completed_successfully
    command:
      - "--config=/etc/otel/config.yaml"
    volumes:
      - ../configs/asap-otel-gateway-kafka-fragment.yaml:/etc/otel/config.yaml:ro
    environment:
      # MinIO creds — env-resolved by the gateway YAML's
      # `${env:VAR:-default}` form. Defaults match base.yml.
      ASAP_S3_ACCESS_KEY: "${ASAP_S3_ACCESS_KEY:-asap}"
      ASAP_S3_SECRET_KEY: "${ASAP_S3_SECRET_KEY:-asap-local-only}"
    logging: *default-logging

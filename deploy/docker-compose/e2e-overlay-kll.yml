# Per-sketch overlay for the KLL e2e verification. Layered on top
# of base.yml + e2e-overlay.yml; replaces the canonical
# `backend-streaming.yaml` / `backend-inference.yaml` mounts with
# KLL-specific aggregations + query patterns.
#
#   AGENT_CONFIG=sketchcol-agent-kll-direct.yaml \
#   docker compose -f base.yml -f agents-N1.yml \
#                  -f baseline-b3-delta.yml -f e2e-overlay.yml \
#                  -f e2e-overlay-kll.yml up -d

services:
  backend:
    volumes:
      - ../configs/backend-streaming-kll.yaml:/etc/asap/streaming.yaml:ro
      - ../configs/backend-inference-kll.yaml:/etc/asap/inference.yaml:ro

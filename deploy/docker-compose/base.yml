# ASAP multi-agent eval — base stack.
#
# Brings up everything that's shared across the N ∈ {1, 10, 100}
# agent-count overrides: the backend (ASAPQuery), the gateway
# (OpenTelemetry aggregator), the controller, plus the infra
# the evaluation pipes through — MinIO (S3-compatible store
# for the Gorilla archive tier), Prometheus (scrape
# target for every agent / backend / controller), and Grafana
# (pre-wired with the backend + Prometheus data sources).
#
# Agent replicas live in `agents-N<K>.yml` overrides so the
# same base can scale from 1 → 100 agents just by selecting a
# different compose file combination:
#
#   docker compose -f base.yml -f agents-N1.yml up
#   docker compose -f base.yml -f agents-N10.yml up
#   docker compose -f base.yml -f agents-N100.yml up
#
# See README.md for build prerequisites (the `asap-otel` agent
# image still needs its Dockerfile + processor binaries built;
# tracked in PROGRESS.md).

version: "3.9"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ───────── S3-compatible store (Gorilla archive tier) ─────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: asap
      MINIO_ROOT_PASSWORD: asap-local-only
    ports:
      - "19000:9000"   # S3 API (host 19000 → container 9000; avoid collision)
      - "19001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging

  # Create the `raw` bucket on MinIO. Step-1 of the JSONL
  # deprecation removed the JSONL `raw/<metric>/YYYY/MM/DD/HH/part-*.jsonl`
  # seed layout; the surviving consumer is the gorilla-S3 archive
  # processor (writes Gorilla blocks under the same bucket prefix
  # but with the `.gor` extension and an `index.json` sidecar).
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set asap http://minio:9000 asap asap-local-only &&
        mc mb --ignore-existing asap/raw &&
        mc anonymous set download asap/raw
    logging: *default-logging

  # ───────── metrics source + scrape ─────────
  prometheus:
    image: prom/prometheus:v2.53.1
    volumes:
      - ../configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ../configs/grafana-datasources.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    logging: *default-logging

  # ───────── ASAP control / query plane ─────────
  controller:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.controller
    environment:
      CONTROLLER_ADDR: "0.0.0.0:8080"
      CONTROLLER_OPAMP_ADDR: "0.0.0.0:4320"
      CONTROLLER_GRPC_ADDR: "0.0.0.0:4321"
      RUST_LOG: "info,controller=debug"
      # Activate the typed-stage-split path for every compose
      # invocation that includes base.yml. Flipping this gate ON
      # routes:
      #   • Bootstrap GET /api/v1/collector-config/agent through the
      #     typed pipeline (PR #329).
      #   • OpAMP-on-connect agent config emission through the typed
      #     pipeline (PR #334 — replan handler ported to typed).
      #   • Per-metric sketch family routing across the five
      #     supported families: DDSketch / KLL / HLL / CountSketch /
      #     CountMinSketch (PR #339 + #340 + the parallel stitching
      #     PR that wires the routing-connector into the emitted
      #     pipeline).
      # Operators can still override via shell env (e.g.
      # `USE_TYPED_STAGE_SPLIT=0 docker compose up controller`) when
      # the legacy free-form emitter is needed for A/B comparison.
      USE_TYPED_STAGE_SPLIT: "${USE_TYPED_STAGE_SPLIT:-1}"
    ports:
      - "18080:8080"   # HTTP API (/api/v1/plan, /metrics for Prom scrape)
      - "14320:4320"   # OpAMP websocket
      - "14321:4321"   # gRPC asap.runtime.v1.RuntimeSamples (agent push)
    logging: *default-logging

  backend:
    # Image is built separately because the source lives in a
    # different private repo. From DataCollector root, run:
    #
    #   DOCKER_BUILDKIT=1 docker build \
    #     -f deploy/docker/Dockerfile.backend \
    #     --build-context backend-src=/path/to/ASAPQuery-backend \
    #     -t asap/query-backend:dev .
    #
    # Then `docker compose up backend` picks up the tagged image.
    image: asap/query-backend:dev
    depends_on:
      - minio
    environment:
      RUST_LOG: "${BACKEND_RUST_LOG:-info}"
      # Step-1 of the JSONL deprecation removed the
      # `ASAP_COLD_STORE_*` env-var family (the §5.2 LocalFsColdStore
      # / ColdFallback adapter is gone). The surviving archive path
      # is the Gorilla-S3 store, which reads its config from the
      # `ASAP_GORILLA_S3_*` env-var family — set those in the
      # baseline overlay (see `baseline-b6-gorilla-s3.yml`) when
      # the deploy needs the archive engine.
      # Controller push URL for capability-miss notifications.
      ASAP_CONTROLLER_URL: "http://controller:8080/api/v1/plan"
    volumes:
      - ../configs/backend-streaming.yaml:/etc/asap/streaming.yaml:ro
    command:
      - "--streaming-config=/etc/asap/streaming.yaml"
      # Deployed binary is `query_engine_rust` (the workspace's
      # default, from `asap-query-engine/src/main.rs`); see
      # `deploy/docker/Dockerfile.backend`. Ingest is OTLP-only
      # (Prometheus remote-write was deleted in PR #100), so the
      # backend's only HTTP listener is the PromQL query surface
      # — `--query-port=9091` (alias of `--http-port`, kept for
      # compose backwards compatibility with the previous
      # `precompute_engine` binary's flag spelling).
      - "--query-port=9091"
      # Warm-tier sketch ingest. Without this the OTel gateway's
      # PRW translator drops typed sketch data points
      # (DDSketch/KLLSketch/HLLSketch/CountSketch/CountMinSketch);
      # see ASAPQuery-backend#69 for the corresponding receiver.
      - "--enable-otel-ingest"
      - "--otel-grpc-port=4317"
      - "--otel-http-port=4318"
    ports:
      - "19091:9091"   # PromQL-compatible HTTP query surface
      # OTLP ingest is intra-docker only (gateway → backend).
      # Expose externally if you want to skip the gateway and
      # send OTLP straight to the backend from the host.
    logging: *default-logging

  # ───────── OpenTelemetry gateway (aggregator) ─────────
  gateway:
    # ASAP-patched OTel collector — same image the agents use.
    # Required because stock contrib 0.108's pdata silently drops
    # typed sketch data points (Metric.data tags 13–17) via
    # `ConsumeUnknown` during OTLP receive → in-memory → OTLP
    # export round-trip. The patched build's pdata knows about
    # those variants and preserves them. See the comment block in
    # `deploy/configs/gateway.yaml` for the code reference.
    #
    # Three gateway configs in deploy/configs/:
    #   gateway.yaml                          — pure forwarder (default)
    #   gateway-aggregate-from-raw.yaml       — sketch raw points at gateway tier
    #   gateway-aggregate-from-sketches.yaml  — merge already-sketched payloads
    # Override the mounted file via the GATEWAY_CONFIG env var,
    # same pattern agents use for AGENT_CONFIG.
    image: asap/asap-otel:dev
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ../configs/${GATEWAY_CONFIG:-gateway.yaml}:/etc/otel/config.yaml:ro
    depends_on:
      - backend
    ports:
      - "14317:4317"   # OTLP gRPC (host 14317 → container 4317; avoid collision)
      - "14318:4318"   # OTLP HTTP
      - "18890:8890"   # /metrics (gateway self-telemetry; patched build uses 8890)
    logging: *default-logging

  # ───────── workload: synthetic metrics producer ─────────
  fake-exporter:
    # Replays the Google cluster usage trace (or any OTel
    # source) at realistic rates to feed the agents. Observability
    # workload is the only kind we evaluate.
    # Placeholder image — the actual binary lives in
    # DataCollector/datasets_eval/.
    image: asap/fake-exporter:dev
    environment:
      EXPORTER_TARGET: "gateway:4317"
      # Workload knobs (can be overridden from sweep scripts via
      # host env). Legacy EXPORTER_RATE is accepted but deprecated
      # — fake-exporter itself logs a warning when set.
      EXPORTER_RATE: "${EXPORTER_RATE:-}"
      EXPORTER_CARDINALITY: "${EXPORTER_CARDINALITY:-1000}"
      EXPORTER_FREQ_HZ: "${EXPORTER_FREQ_HZ:-10}"
      # Three-axis SDK knobs (PR #190, see
      # docs/sdk-cost-evaluation.md). Empty
      # projection = keep all labels; "default" aggregation =
      # Sum for Counter / LastValue for Gauge.
      EXPORTER_SDK_WINDOW: "${EXPORTER_SDK_WINDOW:-15s}"
      EXPORTER_SDK_PROJECTION: "${EXPORTER_SDK_PROJECTION:-}"
      EXPORTER_SDK_AGG: "${EXPORTER_SDK_AGG:-default}"
      EXPORTER_MAX_BUFFER_PER_SERIES: "${EXPORTER_MAX_BUFFER_PER_SERIES:-0}"
    depends_on:
      - gateway
    logging: *default-logging

  # Agents are defined in `agents-N<K>.yml` overrides — keeping
  # them out of the base lets the same base compose serve every
  # scale point.

volumes:
  minio-data:

# Overlay: 1 edge agent. Smallest scale point, useful for
# dev loop + single-node sanity checks.
#
# Flow after this overlay is applied on top of base.yml:
#
#   fake-exporter ──OTLP──▶ agent-1 ──OTLP──▶ gateway ──promRW──▶ backend
#                   :4317            :4317           :9090
#
# The agent mounts `sketchcol-agent.yaml` and runs DDSketch + HLL
# on the pipeline, so the bytes reaching the gateway are already
# sketched (paper §6.2 bandwidth-reduction signal).

x-agent: &agent-base
  image: asap/sketchcol:dev
  depends_on:
    - gateway
    - controller
  # Agents are configured via the mounted sketch pipeline; overriding
  # the entrypoint isn't needed — the patched sketchcollector binary
  # is the default.
  command:
    - "--config=/etc/otel/config.yaml"
  volumes:
    - ../configs/sketchcol-agent.yaml:/etc/otel/config.yaml:ro
  environment:
    CONTROLLER_OPAMP_URL: "ws://controller:4320/v1/opamp"
    # Runtime-samples push endpoint — sketch-runtime sends
    # per-key batches here; controller's /metrics exposer
    # aggregates them for Prometheus.
    SKETCH_RUNTIME_GRPC_ENDPOINT: "http://controller:4321"
    RUST_LOG: "info"
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: 512M

services:
  agent-1:
    <<: *agent-base
    hostname: agent-1
    environment:
      AGENT_ID: "agent-1"
      CONTROLLER_OPAMP_URL: "ws://controller:4320/v1/opamp"
      SKETCH_RUNTIME_GRPC_ENDPOINT: "http://controller:4321"
      RUST_LOG: "info"

  # Override fake-exporter to target the agent instead of
  # the gateway — the agent's sketch pipeline is the thing we
  # actually want exercised.
  fake-exporter:
    environment:
      EXPORTER_TARGET: "agent-1:4317"
      EXPORTER_RATE: "1000"
      EXPORTER_CARDINALITY: "1000"

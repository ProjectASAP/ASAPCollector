# Overlay: 1 edge agent. Smallest scale point, useful for
# dev loop + single-node sanity checks.

version: "3.9"

x-agent: &agent-base
  image: asap/sketchcol:dev
  depends_on:
    - gateway
    - controller
  environment:
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://gateway:4317"
    CONTROLLER_OPAMP_URL: "ws://controller:4320/v1/opamp"
    # PushExporter streams runtime-bench records here. The
    # controller's /api/v1/runtime-samples ring buffer is the
    # real-time decision-loop input (JSONL + zstd).
    SKETCH_RUNTIME_PUSH_URL: "http://controller:8080/api/v1/runtime-samples"
    RUST_LOG: "info"
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: 512M

services:
  agent-1:
    <<: *agent-base
    hostname: agent-1
    environment:
      # Merge-key override per-agent so Prometheus can tell
      # agents apart.
      AGENT_ID: "agent-1"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://gateway:4317"
      CONTROLLER_OPAMP_URL: "ws://controller:4320/v1/opamp"
      SKETCH_RUNTIME_GRPC_ENDPOINT: "http://controller:4321"
      RUST_LOG: "info"

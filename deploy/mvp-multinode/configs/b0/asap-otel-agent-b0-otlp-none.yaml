# Baseline B0 — raw OTel → VictoriaMetrics via OTLP, compression NONE.
#
# ── Role in the compression-matched bandwidth sweep ──────────────────
# B0 is the matched-NONE raw baseline. It ships the FULL-cardinality
# raw counter/gauge stream over OTLP HTTP to VictoriaMetrics with
# `compression: none`, so it shares the EXACT SAME wire codec (none) as
# the plain `asap` arm (OTLP→backend, compression none). The only
# difference between B0 and asap is aggregation:
#
#   B0:   producer ──OTLP──▶ agent ──OTLP/none──▶ VictoriaMetrics
#         (no aggregation; ~10k raw series stream continuously)
#   asap: producer ──OTLP──▶ agent ──OTLP/none──▶ asap-backend
#         (edge Sum-by-zone + per-series sketches; 4 zone-sums + sketch)
#
# So `asap < b0` at codec=none isolates the AGGREGATION gain, with the
# transport+codec held fixed. (The gzip-matched partner is b1-vs-asap-gzip.)
#
# Transport: `otlphttp` exporter at VictoriaMetrics' OTLP ingest endpoint
# `/opentelemetry/v1/metrics` (port 8428). VM stores OTLP cumulative
# counters natively, so PromQL `rate()` / `sum by (zone)(...)` evaluate
# correctly without any cumulativetodelta on the agent (that conversion
# is only needed on the asap path where the backend SumAccumulator folds
# deltas). Like B2's PRW config we DO NOT inject cumulativetodelta here.
#
# Metric naming: VM is run WITHOUT `-opentelemetry.usePrometheusNaming`
# (see run_demo.sh::backend_up), so OTLP metric names are stored verbatim
# — `http_requests_total` and `http_requests_total_latency_ms` match the
# replay query suite (queries-e2e.json) exactly. The latency gauge's
# `ms` unit is NOT suffixed onto the name in that mode.
extensions:
  opamp:
    server:
      ws:
        endpoint: ws://controller:4320/v1/opamp
        headers:
          X-Agent-ID: "agent-1"

receivers:
  otlp:
    protocols:
      grpc:
        max_recv_msg_size_mib: 4096
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  # OTLP HTTP straight at VictoriaMetrics' OTLP ingest receiver.
  # `compression: none` — the matched-NONE codec for the b0-vs-asap pair.
  otlphttp/vm:
    metrics_endpoint: "http://victoriametrics:8428/opentelemetry/v1/metrics"
    compression: none
    tls:
      insecure: true

service:
  extensions: [opamp]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/vm]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8890

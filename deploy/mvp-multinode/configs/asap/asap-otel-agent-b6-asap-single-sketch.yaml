# Agent — single-pipeline FUSED asap_edge (issue #46).
#
# ── What changed ──────────────────────────────────────────────────────
#
# This replaces the previous topology:
#
#   routing connector  →  6 per-family pipelines, each
#                          [gorillas3, <sum|sketch>, batch] → otlp/backend
#
# with ONE processor, asap_edge, that does the cold archive (gorilla),
# the Sum-by-zone aggregation, and all five sketch families in a SINGLE
# sharded decode pass:
#
#   otlp → cumulativetodelta → asap_edge → otlp/backend
#
# Why (profiling, issue #46):
#   1. The old shape decoded each data point + rebuilt the series key
#      TWICE (cold processor + warm aggregator). asap_edge decodes +
#      keys ONCE and feeds both (gorilla AddSampleKeyed / precompute
#      ObserveKeyed).
#   2. Every processor took a processor-wide mutex, pinning ingestion to
#      ~1 core. asap_edge key-hash-shards (shard_count) for multi-core.
#   3. The Sum-by-zone path ran through contrib metricstransform, whose
#      dataPointHashKey builds a group key per point via json.Marshal +
#      reflection (~17% of agent CPU). asap_edge's Sum aggregator uses a
#      reflection-free group key and emits the SAME zone-keyed delta Sum
#      metric the backend ingests today.
#
# Cold: asap_edge builds per-emit Gorilla blocks and SHIPS them to the
# backend gorilla storage-engine ingest (cold.ship_endpoint) — the edge
# no longer PUTs to S3. See the Track-2 backend work; until that ingest
# endpoint exists, cold blocks are built but not shipped (warm tier +
# passthrough are unaffected).
#
# Unconfigured metrics (e.g. the freshness probes) pass through raw to
# the backend; aggregated metrics' raw is dropped (their sum/sketch
# output is emitted on the flush tick).

extensions:
  opamp:
    server:
      ws:
        endpoint: ws://control-plane:4320/v1/opamp
        headers:
          X-Agent-ID: "agent-1"

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 4096
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Backpressure before the fused processor buffers a window in memory.
  memory_limiter:
    check_interval: 1s
    limit_mib: 1280
    spike_limit_mib: 256

  # Counters → delta upstream of asap_edge so the Sum aggregator and the
  # backend SumAccumulator see deltas (Issue #298). match_type: strict
  # leaves gauges (latency) untouched.
  cumulativetodelta:
    include:
      metrics:
        - http_requests_total
        - endpoint_request_freq
        - unique_users_per_min
        - top_endpoint_qps
      match_type: strict

  # The fused edge processor. metrics[] is the metric→family map (the job
  # the routing connector + per-family pipelines used to do); everything
  # else is cold-archived + passed through.
  asap_edge:
    shard_count: 4
    window_duration: 60s
    drop_original: true
    metrics:
      - { metric: http_requests_total,            family: sum,            aggregate_by: [zone] }
      - { metric: http_requests_total_latency_ms, family: ddsketch,       relative_accuracy: 0.01 }
      - { metric: request_size_bytes,             family: kll,            k: 200 }
      - { metric: unique_users_per_min,           family: hll }
      - { metric: top_endpoint_qps,               family: countsketch,    rows: 5, cols: 2048 }
      - { metric: endpoint_request_freq,          family: countminsketch, rows: 5, cols: 2048 }
    cold:
      enabled: true
      # Ship compact XOR-chunk fragments (ASAPFRG1) to the backend
      # gorilla-merger's HTTP ingest. The merger (a Thanos-Receive-style
      # service: tsdb.DB -> 2h block -> S3, + StoreAPI for the pending window)
      # runs on node2 as host `gorilla-merger`, HTTP ingest on :10908.
      # Empty endpoint = build-and-drop (measurement / warm-only).
      ship_endpoint: http://gorilla-merger:10908/ingest/gorilla
      block_duration: 60s
      reorder_grace: 2s
      external_labels:
        cluster: asap-mvp

exporters:
  otlp/backend:
    # Agents push OTLP straight to data-plane:4317 (the asap-gateway hop was
    # removed in #400; the data plane does cross-agent fan-in itself).
    endpoint: data-plane:4317
    tls:
      insecure: true

service:
  extensions: [opamp]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, cumulativetodelta, asap_edge]
      exporters: [otlp/backend]

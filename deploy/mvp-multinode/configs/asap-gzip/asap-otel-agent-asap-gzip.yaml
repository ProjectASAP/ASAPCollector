# Matched-codec ASAP arm. This is the static bootstrap used before a typed
# CollectorPlan arrives; the fused processor owns every warm materialization.

extensions:
  opamp:
    server:
      ws:
        endpoint: ws://control-plane:4320/v1/opamp
        headers:
          X-Agent-ID: agent-1

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 4096
      http:
        endpoint: 0.0.0.0:4318

processors:
  cumulativetodelta:
    include:
      metrics:
        - http_requests_total
        - endpoint_request_freq
        - unique_users_per_min
        - top_endpoint_qps
      match_type: strict

  memory_limiter:
    check_interval: 1s
    limit_mib: 1280
    spike_limit_mib: 256

  asap_edge:
    window_duration: 60s
    drop_original: true
    delta_transmission: true
    metrics:
      - metric: http_requests_total
        family: sum
        aggregate_by: [zone]
      - metric: http_requests_total_latency_ms
        family: ddsketch
        relative_accuracy: 0.01
      - metric: request_size_bytes
        family: kll
        k: 200
        delta_transmission: false
      - metric: unique_users_per_min
        family: hll
      - metric: top_endpoint_qps
        family: countsketch
        rows: 4
        cols: 4096
      - metric: endpoint_request_freq
        family: countminsketch
        rows: 4
        cols: 4096
    cold:
      enabled: true
      block_duration: 60s
      endpoint: http://minio:9000
      tsdb_bucket: asap-gorilla-tsdb
      tenant: default
      region: us-east-1
      access_key_id: asap
      secret_access_key: asap-local-only
      use_ssl: false

  batch:
    send_batch_size: 1024
    timeout: 1s

exporters:
  otlp/backend:
    endpoint: data-plane:4317
    compression: gzip
    tls:
      insecure: true

service:
  extensions: [opamp]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [cumulativetodelta, memory_limiter, asap_edge, batch]
      exporters: [otlp/backend]
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8890

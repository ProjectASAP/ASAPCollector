# Serf-gateway collector (b3 arm) — runs on node1.
#
# The decompression half of the serf-as-real-wire-codec arm. Receives
# serf-XOR-compressed SERF1 blocks from the b3 agents (node0/node3) over
# HTTP, DECODES them back into raw metric data points, and inserts the
# decompressed raw stream into VictoriaMetrics (node2) via OTLP HTTP.
# NO prometheusremotewrite — the only compressed hop is agent→gateway.
#
#   agent ──serfhttp (XOR, compressed)──▶ serf-gw  ──OTLP raw──▶ VM (node2)
#
# Measurement:
#   - serf_receiver_bytes_received_bytes_total  (compressed ingress)
#   - serf_receiver_decoded_points_total        (decoded points; must be > 0)
#   on this collector's :8891 prometheus reader.
#   - node1 NIC RX on enp130s0f0 == serf-compressed wire bytes at the sink.
#
# Correctness: compression: xor + max_diff: 0.0 mirrors the agent's
# serfexporter, so decode is lossless and the values reconstructed here
# are bit-for-bit identical to what the producers emitted.

receivers:
  # Serf HTTP server. Listens on 0.0.0.0:9000 and handles POSTs to /serf.
  # `serf-gw:9000/serf` (agent endpoint) resolves to this node's IP.
  serfhttp:
    endpoint: 0.0.0.0:9000
    compression: xor
    max_diff: 0.0

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  # OTLP HTTP straight at VictoriaMetrics' OTLP ingest receiver on node2.
  # Same sink + metric-naming convention as the b0/b1 OTLP→VM arms: VM
  # runs WITHOUT -opentelemetry.usePrometheusNaming, so the decoded metric
  # names (`http_requests_total`, `http_requests_total_latency_ms`) are
  # stored verbatim and match the replay query suite (queries-e2e.json).
  otlphttp/vm:
    metrics_endpoint: "http://victoriametrics:8428/opentelemetry/v1/metrics"
    compression: none
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [serfhttp]
      processors: [batch]
      exporters: [otlphttp/vm]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8891

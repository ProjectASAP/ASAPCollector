# Baseline B3 — Serf as a REAL end-to-end wire codec.
#
# ── Role: serf as an actual wire-compression codec ──────────────────
# B3 measures serf the way b1 measures gzip and b2 measures Snappy: as a
# codec that crosses the network. The agent serf-XOR-COMPRESSES the
# metric stream and ships the compressed SERF1 blocks over HTTP to a
# serf-GATEWAY collector (node1). The gateway serf-DECOMPRESSES and
# inserts the raw, decompressed stream into VictoriaMetrics via OTLP.
# NO prometheusremotewrite anywhere on this arm — the bytes that cross
# the agent→gateway hop ARE the serf-compressed wire.
#
#   producer ──OTLP──▶ agent ──serfhttp (XOR, compressed)──▶ serf-gw (node1)
#                                                              │
#                                                serf-DECODE ──┘
#                                                              │
#                                              ──OTLP raw──▶ VictoriaMetrics (node2)
#
# This is serf's analog of b1's gzip-compressed wire / b2's Snappy-
# compressed wire. The authoritative compressed-bytes-sent metric is the
# serfexporter's `serf_exporter_bytes_sent_bytes_total` self-telemetry
# (scrape the agent's :8890 prometheus reader). The serf-gateway's
# ingress on node1's NIC is the same compressed wire viewed at the sink.
#
# Correctness: max_diff: 0.0 makes SerfXOR LOSSLESS (findAppLong returns
# the exact Float64bits when maxDiff==0), so the gateway reconstructs the
# original values bit-for-bit. `sum by (zone) (http_requests_total)`
# against VM must return 4 zones with the correct magnitude.
#
# The earlier B3 design ran the serfprocessor with drop_original:false,
# writing compressed blocks to LOCAL DISK while forwarding the RAW stream
# via PRW to VM — so the measured wire was just raw PRW and serf never
# crossed the network. This config replaces that with the serfexporter so
# serf is measured as a true wire codec.

extensions:
  opamp:
    server:
      ws:
        endpoint: ws://control-plane:4320/v1/opamp
        headers:
          X-Agent-ID: "agent-1"

receivers:
  otlp:
    protocols:
      grpc:
        max_recv_msg_size_mib: 4096
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  # Serf wire codec: XOR-compress the metric stream over a tumbling
  # window and POST SERF1 blocks to the serf-gateway collector on node1.
  # `serf-gw` resolves to node1's IP via --add-host (injected by
  # run_demo.sh for the b3 arm). compression: xor + max_diff: 0.0 =>
  # lossless. window_interval matches the agent batch cadence enough to
  # keep latency bounded while still amortising the per-block metadata.
  serfhttp:
    endpoint: "http://serf-gw:9000/serf"
    compression: xor
    max_diff: 0.0
    window_interval: 5s

service:
  extensions: [opamp]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [serfhttp]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8890

# Overlay: 1 edge agent. Smallest scale point, useful for
# dev loop + single-node sanity checks.
#
# Flow after this overlay is applied on top of base.yml:
#
#   fake-exporter ──OTLP──▶ agent-1 ──OTLP──▶ backend
#                   :4317            :4317
#
# The agent mounts `asap-otel-agent.yaml` and runs DDSketch + HLL
# on the pipeline, so the bytes reaching the backend are already
# sketched (bandwidth-reduction signal).
#
# Issue #400 (2026-05): the asap-gateway hop was retired; the
# backend now does cross-agent fan-in for sum-by aggregations
# natively (ASAPQuery-backend #283/#287/#290), so the gateway
# middle-tier earns no place on the pipeline.

x-agent: &agent-base
  image: asap/asap-otel:dev
  depends_on:
    - backend
    - controller
  # The opampextension's `remote_config_path` (ASAPCollector#391)
  # writes the controller-pushed RemoteConfig back to
  # `/etc/otel/config.yaml` and exits, expecting Docker to restart
  # the container so the new config takes effect. Both of the
  # following are required for that flow to work:
  #   - the mount must be RW (no `:ro`) so the on-disk write succeeds
  #   - `restart: unless-stopped` so Docker brings the agent back up
  # See /mydata/mvp-smoke-test/compose/smoke-overlay.yml for the
  # working reference that established this contract.
  restart: unless-stopped
  # Agents are configured via the mounted sketch pipeline; overriding
  # the entrypoint isn't needed — the patched asap-otel binary
  # is the default.
  command:
    - "--config=/etc/otel/config.yaml"
  volumes:
    # Default baseline = B2 full-sketch. Override via env var
    # AGENT_CONFIG to mount a different pipeline yaml — the
    # paper baselines' compose overlays (baseline-b*.yml) set
    # it before `docker compose up`. Compose expands the
    # ${VAR:-default} syntax at container start.
    - ../configs/${AGENT_CONFIG:-asap-otel-agent-b2-full.yaml}:/etc/otel/config.yaml
  environment:
    CONTROLLER_OPAMP_URL: "ws://controller:4320/v1/opamp"
    # Runtime-samples push endpoint — sketch-runtime sends
    # per-key batches here; controller's /metrics exposer
    # aggregates them for Prometheus.
    SKETCH_RUNTIME_GRPC_ENDPOINT: "http://controller:4321"
    RUST_LOG: "info"
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 1024M

services:
  agent-1:
    <<: *agent-base
    hostname: agent-1
    environment:
      AGENT_ID: "agent-1"
      CONTROLLER_OPAMP_URL: "ws://controller:4320/v1/opamp"
      SKETCH_RUNTIME_GRPC_ENDPOINT: "http://controller:4321"
      RUST_LOG: "info"
      # Consumed by asap-otel-agent-b4-tunable.yaml; other
      # baselines ignore it. Default 60s.
      SKETCH_WINDOW: "${SKETCH_WINDOW:-60s}"

  # Override fake-exporter to target the agent so its sketch
  # pipeline is the thing we actually want exercised. Pre-#400
  # the bare base.yml fake-exporter targeted the gateway; with
  # the gateway gone the base default is backend:4317 (a no-
  # sketch sanity probe), so this overlay's override is now the
  # canonical "sketch pipeline" entry point.
  fake-exporter:
    environment:
      EXPORTER_TARGET: "agent-1:4317"
      # workload-sweep knobs; override via shell env.
      EXPORTER_RATE: "${EXPORTER_RATE:-1000}"
      EXPORTER_CARDINALITY: "${EXPORTER_CARDINALITY:-1000}"

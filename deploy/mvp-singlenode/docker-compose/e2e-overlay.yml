# e2e harness overlay — adds the wiring P3-P9 need on top of
# `base.yml + agents-N<K>.yml + baseline-*.yml`. Layered as the last
# `-f` flag so it can override env / volumes / commands.
#
# What it adds:
#   1. EXPORTER_CONTROL_ADDR  → fake-exporter exposes the swappable
#      filter HTTP control endpoint (P2).
#   2. Mounts deploy/mvp-singlenode/configs/workloads.yaml into the controller and
#      sets CONTROLLER_WORKLOADS to point at it. Without this the
#      controller's startup log says "workloads file not found; using
#      empty registry" and never publishes a plan id, so
#      plan_transition.py sees `before_plan: null / after_plan: null`.
#   3. Sets CONTROLLER_BACKEND_ENDPOINT so the controller's replanner
#      pushes StreamingConfig YAML to the backend on every plan
#      change. The backend's hot-reload handler is on the query port
#      (9091) at /api/v1/streaming-config — same surface the planner
#      tests in `controller/src/backend_client.rs` exercise.
#
# Step-1 of the JSONL deprecation removed the cold-store volume +
# raw-tee + `--cold-store-root` wiring. The §5.2 LocalFsColdStore
# fallback was deleted in the backend at the same commit; the
# surviving fallback chain is just Prometheus
# (`--forward-unsupported-queries`).
#
# Wire it as:
#
#   AGENT_CONFIG=asap-otel-agent-b3-delta.yaml \
#   docker compose \
#     -f base.yml \
#     -f agents-N1.yml \
#     -f baseline-b3-delta.yml \
#     -f e2e-overlay.yml \
#     up -d

services:
  # Phase-9 single-binary refactor (#373): the standalone
  # `asap/controller:dev` image is gone. The controller binary now
  # ships from `asap/query-backend:dev` (multi-bin build in
  # Dockerfile.backend), and base.yml's controller service points
  # at that image with an entrypoint override to
  # /usr/local/bin/controller. This overlay's controller block kept
  # for its environment + volume tweaks; the image: and build:
  # overrides are no longer needed (base.yml already pins the
  # right image, and there's no build stanza to neutralize).
  controller:
    environment:
      # Point the declarative workload registry parser at our
      # mounted YAML. Default lookup path is "workloads.yaml"
      # relative to the controller's CWD (which is `/` in the
      # debian-slim runtime image), so we must override.
      CONTROLLER_WORKLOADS: "/etc/asap/workloads.yaml"
      # Wires the controller → backend StreamingConfig push path.
      # On every plan change the controller POSTs a
      # `StreamingConfig` YAML to this URL; the backend's hot-reload
      # handler swaps its active config without a restart.
      CONTROLLER_BACKEND_ENDPOINT: "http://backend:9091/api/v1/streaming-config"
    volumes:
      - ../configs/workloads.yaml:/etc/asap/workloads.yaml:ro

  # The canonical gateway forwards everything as OTLP (sketches +
  # raw) to the backend. The default `gateway.yaml` uses
  # `prometheusremotewrite` which silently drops sketch-typed data
  # points — fine for a raw-metrics-only deployment, wrong for an
  # ASAP run. Override the mounted config in this overlay so the
  # e2e harness gets sketch-through-gateway-to-backend by default.
  gateway:
    volumes:
      - ../configs/gateway-otlp-forward.yaml:/etc/otelcol-contrib/config.yaml:ro

  fake-exporter:
    environment:
      EXPORTER_CONTROL_ADDR: "0.0.0.0:7700"
      EXPORTER_INSTANCE_ID: "${EXPORTER_INSTANCE_ID:-fake-1}"
      # When this overlay is in the chain, the producer talks to
      # the agent rather than the gateway directly. The agents-N1
      # overlay does the same; we leave it alone here.
    ports:
      - "17700:7700"   # POST /control/projection from the host

  backend:
    environment:
      RUST_LOG: "info,query_engine_rust::drivers::ingest=debug,query_engine_rust::engines=debug,query_engine_rust::precompute_engine=debug"
    command:
      - "--streaming-config=/etc/asap/streaming.yaml"
      - "--inference-config=/etc/asap/inference.yaml"
      - "--ingest-port=9090"
      - "--query-port=9091"
      - "--forward-unsupported-queries"
      # Step 2g (2026-05): Prometheus container was replaced with
      # VictoriaMetrics; the `--prometheus-server` flag stays — it
      # only requires a Prometheus-wire-compatible /api/v1/query
      # surface, which VM provides on port 8428.
      - "--prometheus-server=http://victoriametrics:8428"
      - "--enable-otel-ingest"
      - "--otel-grpc-port=4317"
      - "--otel-http-port=4318"
      - "--allowed-lateness-ms=60000"
    ports:
      - "14380:4317"   # backend OTLP gRPC (host 14380 → container 4317; gateway already owns 14317)
      - "14381:4318"   # backend OTLP HTTP
    volumes:
      - ../configs/backend-inference.yaml:/etc/asap/inference.yaml:ro

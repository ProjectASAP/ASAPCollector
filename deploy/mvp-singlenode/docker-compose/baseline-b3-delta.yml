# Baseline B3 selector — delta sketch transmission, fixed 60s
# window.  — delta payloads are sparse diffs of only-
# changed buckets/registers since the last flush; once the
# sketch fills in, per-window bytes drop dramatically vs B2.
#
#   AGENT_CONFIG=asap-otel-agent-b3-delta.yaml \
#     docker compose -f base.yml -f agents-N1.yml \
#       -f baseline-b3-delta.yml up -d
#
# Workload profile (see docs/phase-2-perf-deployment.md "Gaps" #6):
# the legacy 1k cardinality × 10 Hz default ran the agent at ~0.25%
# of one core, three orders of magnitude below saturation. At that
# load CPU diffs sit inside measurement noise so a 10% shim
# regression is invisible. The override below pins B3 to a
# saturating profile — 1e5 cardinality × 100 Hz — chosen to keep the
# agent in the 50–70% one-core band where CPU deltas discriminate.
# Each value can be overridden from the host shell (e.g.
# `OTELAPP_FREQ_HZ=50 docker compose ...`); the override here only
# changes the default fallback. Phase 2.11B gap #4.

services:
  controller:
    labels:
      asap.baseline: "b3-delta"

  # compose `command:` fully replaces the command set by the
  # base.yml + agents-N* layers, so the full flag list is restated
  # here with the saturating profile. Target stays agent-1.
  otel-app:
    command:
      - "-target=agent-1:4317"
      # 1e5 cardinality × 100 Hz ≈ 1e7 obs/s into the agent's input
      # ring. Empirically lands the agent at ~50–70% of one core on
      # the Threadripper hardware described in docs/phase-2-perf-
      # deployment.md "Hardware". Tune downward if the host caps out
      # before the agent does — agent CPU is the gate metric for the
      # shim regression check, not host CPU.
      - "-cardinality=${OTELAPP_CARDINALITY:-100000}"
      - "-freq-hz=${OTELAPP_FREQ_HZ:-100}"
      - "-sdk-window=${OTELAPP_SDK_WINDOW:-15s}"
      - "-sdk-projection=${OTELAPP_SDK_PROJECTION:-}"
      - "-agg=${OTELAPP_SDK_AGG:-default}"
      - "-max-buffer-per-series=${OTELAPP_MAX_BUFFER_PER_SERIES:-0}"

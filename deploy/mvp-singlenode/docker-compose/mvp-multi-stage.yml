# MVP demo multi-stage topology overlay
#
# Layers:
#
#   10 fake-exporter  (×100-500 series each → 1K-5K SDK total)
#         │ OTLP/4317
#         ▼
#    2 agents          (×~5K series → 10K aggregate)
#         │ OTLP/4317
#         ▼
#    1 gateway         (10K aggregated; sketch fan-in merge processors)
#         │ OTLP/4317
#         ▼
#    1 backend         (query_engine_rust — workspace default binary)
#                      + VictoriaMetrics :8428 (B0 baseline only —
#                        receives via prometheusremotewrite from the
#                        agents when overlay invoked with
#                        `--profile b0`; was previously Prometheus
#                        with --web.enable-remote-write-receiver,
#                        replaced in Step 2g 2026-05)
#
# Drives the controller-driven multi-stage demo for issue #46.
# See docs/mvp-demo-runbook.md.
#
# Compose stack:
#   docker compose \
#       -f deploy/mvp-singlenode/docker-compose/base.yml \
#       -f deploy/mvp-singlenode/docker-compose/mvp-multi-stage.yml \
#       up -d
#
# Knobs:
#   PER_AGENT_CARDINALITY   # default 500; total = N_PRODUCERS × this
#   N_PRODUCERS             # default 10 (split 5+5 between agent-A / agent-B)
#   ASAP_SKETCH_FAMILY      # default ddsketch (overridden per-metric by
#                             controller-emitted configs)

x-fake-exporter: &fake-exporter-base
  image: asap/fake-exporter:dev
  depends_on:
    - controller
  environment:
    EXPORTER_RATE: "${EXPORTER_RATE:-1000}"
    EXPORTER_CARDINALITY: "${PER_AGENT_CARDINALITY:-500}"
    EXPORTER_FREQ_HZ: "${EXPORTER_FREQ_HZ:-10}"
    EXPORTER_SDK_WINDOW: "${EXPORTER_SDK_WINDOW:-15s}"
    # Freshness probes (criterion ⑥) — explicit propagation so the
    # producer-* services emit the three timestamp-encoded counters
    # regardless of what the host shell exports. Default is `on` in
    # probes.go; thread it deterministically here so the CSVs are
    # populated even when the host shell is silent.
    EXPORTER_FRESHNESS_PROBES: "${EXPORTER_FRESHNESS_PROBES:-on}"
    EXPORTER_FRESHNESS_PROBE_HZ: "${EXPORTER_FRESHNESS_PROBE_HZ:-1.0}"

x-agent: &agent-base
  image: asap/asap-otel:dev
  depends_on:
    # This overlay's "multi-stage" intent is that the gateway sits
    # between agent and asapquery-backend. To preserve that flow,
    # bring the stack up with `--profile gateway-legacy` AND override
    # AGENT_CONFIG_A/B to point at an agent config whose `otlp/*`
    # exporter targets `gateway:4317` instead of the new default
    # `backend:4317`. Default `depends_on` still references backend so
    # agents come up even when the gateway-legacy profile is off
    # (in which case this overlay degrades to the default agent →
    # backend data path).
    - backend
    - controller
  command:
    - "--config=/etc/otel/config.yaml"
  deploy:
    resources:
      limits:
        cpus: "1.5"
        memory: 1536M

services:

  # ─────────────────────────────── 10 fake-exporters ─────────────────────────
  # Five fan into agent-a, five fan into agent-b. Each emits its own
  # "shard" of cardinality so the producer-side cardinality is
  # PER_AGENT_CARDINALITY × N_PRODUCERS at the gateway.

  # NOTE on the per-producer environment block: YAML's `<<:` merge key
  # does NOT deep-merge nested mappings, and docker-compose treats
  # the per-service `environment` map as a complete override of any
  # anchor-supplied `environment`. The full env is therefore inlined
  # per producer so the EXPORTER_RATE / EXPORTER_CARDINALITY /
  # EXPORTER_FREQ_HZ / EXPORTER_FRESHNESS_* knobs propagate
  # deterministically (a previous attempt that relied on the anchor
  # silently dropped them inside the containers, producing empty
  # freshness CSVs).
  #
  # Each producer pulls the host-shell env (which the driver script
  # exports) via Compose's `${VAR:-default}` interpolation.
  producer-a-1:
    <<: *fake-exporter-base
    environment: &producer-env-a-1
      EXPORTER_TARGET: "agent-a:4317"
      EXPORTER_PRODUCER_ID: "p-a-1"
      EXPORTER_RATE: "${EXPORTER_RATE:-1000}"
      EXPORTER_CARDINALITY: "${PER_AGENT_CARDINALITY:-500}"
      EXPORTER_FREQ_HZ: "${EXPORTER_FREQ_HZ:-10}"
      EXPORTER_SDK_WINDOW: "${EXPORTER_SDK_WINDOW:-15s}"
      EXPORTER_FRESHNESS_PROBES: "${EXPORTER_FRESHNESS_PROBES:-on}"
      EXPORTER_FRESHNESS_PROBE_HZ: "${EXPORTER_FRESHNESS_PROBE_HZ:-1.0}"
  producer-a-2:
    <<: *fake-exporter-base
    environment:
      EXPORTER_TARGET: "agent-a:4317"
      EXPORTER_PRODUCER_ID: "p-a-2"
      EXPORTER_RATE: "${EXPORTER_RATE:-1000}"
      EXPORTER_CARDINALITY: "${PER_AGENT_CARDINALITY:-500}"
      EXPORTER_FREQ_HZ: "${EXPORTER_FREQ_HZ:-10}"
      EXPORTER_SDK_WINDOW: "${EXPORTER_SDK_WINDOW:-15s}"
      EXPORTER_FRESHNESS_PROBES: "${EXPORTER_FRESHNESS_PROBES:-on}"
      EXPORTER_FRESHNESS_PROBE_HZ: "${EXPORTER_FRESHNESS_PROBE_HZ:-1.0}"
  producer-a-3:
    <<: *fake-exporter-base
    environment:
      EXPORTER_TARGET: "agent-a:4317"
      EXPORTER_PRODUCER_ID: "p-a-3"
      EXPORTER_RATE: "${EXPORTER_RATE:-1000}"
      EXPORTER_CARDINALITY: "${PER_AGENT_CARDINALITY:-500}"
      EXPORTER_FREQ_HZ: "${EXPORTER_FREQ_HZ:-10}"
      EXPORTER_SDK_WINDOW: "${EXPORTER_SDK_WINDOW:-15s}"
      EXPORTER_FRESHNESS_PROBES: "${EXPORTER_FRESHNESS_PROBES:-on}"
      EXPORTER_FRESHNESS_PROBE_HZ: "${EXPORTER_FRESHNESS_PROBE_HZ:-1.0}"
  producer-a-4:
    <<: *fake-exporter-base
    environment:
      EXPORTER_TARGET: "agent-a:4317"
      EXPORTER_PRODUCER_ID: "p-a-4"
      EXPORTER_RATE: "${EXPORTER_RATE:-1000}"
      EXPORTER_CARDINALITY: "${PER_AGENT_CARDINALITY:-500}"
      EXPORTER_FREQ_HZ: "${EXPORTER_FREQ_HZ:-10}"
      EXPORTER_SDK_WINDOW: "${EXPORTER_SDK_WINDOW:-15s}"
      EXPORTER_FRESHNESS_PROBES: "${EXPORTER_FRESHNESS_PROBES:-on}"
      EXPORTER_FRESHNESS_PROBE_HZ: "${EXPORTER_FRESHNESS_PROBE_HZ:-1.0}"
  producer-a-5:
    <<: *fake-exporter-base
    environment:
      EXPORTER_TARGET: "agent-a:4317"
      EXPORTER_PRODUCER_ID: "p-a-5"
      EXPORTER_RATE: "${EXPORTER_RATE:-1000}"
      EXPORTER_CARDINALITY: "${PER_AGENT_CARDINALITY:-500}"
      EXPORTER_FREQ_HZ: "${EXPORTER_FREQ_HZ:-10}"
      EXPORTER_SDK_WINDOW: "${EXPORTER_SDK_WINDOW:-15s}"
      EXPORTER_FRESHNESS_PROBES: "${EXPORTER_FRESHNESS_PROBES:-on}"
      EXPORTER_FRESHNESS_PROBE_HZ: "${EXPORTER_FRESHNESS_PROBE_HZ:-1.0}"

  producer-b-1:
    <<: *fake-exporter-base
    environment:
      EXPORTER_TARGET: "agent-b:4317"
      EXPORTER_PRODUCER_ID: "p-b-1"
      EXPORTER_RATE: "${EXPORTER_RATE:-1000}"
      EXPORTER_CARDINALITY: "${PER_AGENT_CARDINALITY:-500}"
      EXPORTER_FREQ_HZ: "${EXPORTER_FREQ_HZ:-10}"
      EXPORTER_SDK_WINDOW: "${EXPORTER_SDK_WINDOW:-15s}"
      EXPORTER_FRESHNESS_PROBES: "${EXPORTER_FRESHNESS_PROBES:-on}"
      EXPORTER_FRESHNESS_PROBE_HZ: "${EXPORTER_FRESHNESS_PROBE_HZ:-1.0}"
  producer-b-2:
    <<: *fake-exporter-base
    environment:
      EXPORTER_TARGET: "agent-b:4317"
      EXPORTER_PRODUCER_ID: "p-b-2"
      EXPORTER_RATE: "${EXPORTER_RATE:-1000}"
      EXPORTER_CARDINALITY: "${PER_AGENT_CARDINALITY:-500}"
      EXPORTER_FREQ_HZ: "${EXPORTER_FREQ_HZ:-10}"
      EXPORTER_SDK_WINDOW: "${EXPORTER_SDK_WINDOW:-15s}"
      EXPORTER_FRESHNESS_PROBES: "${EXPORTER_FRESHNESS_PROBES:-on}"
      EXPORTER_FRESHNESS_PROBE_HZ: "${EXPORTER_FRESHNESS_PROBE_HZ:-1.0}"
  producer-b-3:
    <<: *fake-exporter-base
    environment:
      EXPORTER_TARGET: "agent-b:4317"
      EXPORTER_PRODUCER_ID: "p-b-3"
      EXPORTER_RATE: "${EXPORTER_RATE:-1000}"
      EXPORTER_CARDINALITY: "${PER_AGENT_CARDINALITY:-500}"
      EXPORTER_FREQ_HZ: "${EXPORTER_FREQ_HZ:-10}"
      EXPORTER_SDK_WINDOW: "${EXPORTER_SDK_WINDOW:-15s}"
      EXPORTER_FRESHNESS_PROBES: "${EXPORTER_FRESHNESS_PROBES:-on}"
      EXPORTER_FRESHNESS_PROBE_HZ: "${EXPORTER_FRESHNESS_PROBE_HZ:-1.0}"
  producer-b-4:
    <<: *fake-exporter-base
    environment:
      EXPORTER_TARGET: "agent-b:4317"
      EXPORTER_PRODUCER_ID: "p-b-4"
      EXPORTER_RATE: "${EXPORTER_RATE:-1000}"
      EXPORTER_CARDINALITY: "${PER_AGENT_CARDINALITY:-500}"
      EXPORTER_FREQ_HZ: "${EXPORTER_FREQ_HZ:-10}"
      EXPORTER_SDK_WINDOW: "${EXPORTER_SDK_WINDOW:-15s}"
      EXPORTER_FRESHNESS_PROBES: "${EXPORTER_FRESHNESS_PROBES:-on}"
      EXPORTER_FRESHNESS_PROBE_HZ: "${EXPORTER_FRESHNESS_PROBE_HZ:-1.0}"
  producer-b-5:
    <<: *fake-exporter-base
    environment:
      EXPORTER_TARGET: "agent-b:4317"
      EXPORTER_PRODUCER_ID: "p-b-5"
      EXPORTER_RATE: "${EXPORTER_RATE:-1000}"
      EXPORTER_CARDINALITY: "${PER_AGENT_CARDINALITY:-500}"
      EXPORTER_FREQ_HZ: "${EXPORTER_FREQ_HZ:-10}"
      EXPORTER_SDK_WINDOW: "${EXPORTER_SDK_WINDOW:-15s}"
      EXPORTER_FRESHNESS_PROBES: "${EXPORTER_FRESHNESS_PROBES:-on}"
      EXPORTER_FRESHNESS_PROBE_HZ: "${EXPORTER_FRESHNESS_PROBE_HZ:-1.0}"

  # ─────────────────────────────── controller workload mount ────────────────
  # Controller reads the MVP workload manifest at startup so its plan
  # covers the three canonical query classes from mvp-workload.yaml.
  # The typed-stage-split emitter consumes the resulting plan.

  controller:
    environment:
      CONTROLLER_WORKLOADS: "/etc/asap/mvp-workload.yaml"
      USE_TYPED_STAGE_SPLIT: "${USE_TYPED_STAGE_SPLIT:-1}"
      # When set, the typed-stage-split Backend arm actually pushes
      # the emitted streaming-config JSON instead of silently logging
      # "no backend client configured". Required for §8 STATUS=live
      # in the demo.
      CONTROLLER_BACKEND_ENDPOINT: "${CONTROLLER_BACKEND_ENDPOINT:-http://backend:9091/api/v1/streaming-config}"
    volumes:
      - ../configs/mvp-workload.yaml:/etc/asap/mvp-workload.yaml:ro

  # ─────────────────────────────── backend ───────────────────────────────────
  # The base.yml backend block omits the per-metric routing table and
  # the GorillaQueryEngine env block. The MVP demo needs both: the
  # cold-archive marker for criterion ⑤, and the per-tier routing for
  # the http_freshness_probe_{warm,archive} probes (criterion ⑥).
  # Mirrors the wiring already proven in
  # `baseline-b6-asap-single-sketch.yml`.
  backend:
    # Step 2.4: drop the legacy host-:19090 PRW-ingest publish so
    # baseline mode (which brings up `victoriametrics-b0` on
    # host:19090; was `prometheus-b0` pre Step 2g) doesn't collide
    # with the backend container at boot. The MVP demo only ever
    # issues queries through the host:19091 PromQL surface; nobody
    # relies on remote-write straight to the backend in this stack.
    # Asap mode still gets full functionality because the gateway/
    # agents reach the backend over the intra-docker network at
    # backend:9090, which is unaffected by what's *published* to the
    # host.
    ports: !override
      - "19091:9091"   # PromQL-compatible HTTP query surface
    environment:
      ASAP_SKETCH_FAMILY: "${ASAP_SKETCH_FAMILY:-ddsketch}"
      ASAP_GORILLA_S3_ENDPOINT: "http://minio:9000"
      ASAP_GORILLA_S3_BUCKET: "asap-gorilla"
      ASAP_GORILLA_S3_REGION: "us-east-1"
      ASAP_GORILLA_S3_ACCESS_KEY_ID: "asap"
      ASAP_GORILLA_S3_SECRET_ACCESS_KEY: "asap-local-only"
      ASAP_GORILLA_S3_TENANT: "default"
      ASAP_GORILLA_S3_USE_SSL: "false"
      ASAP_GORILLA_S3_PREFIX_TEMPLATE: "{tenant}/{metric}/{YYYY}/{MM}/{DD}/{HH}/"
      ASAP_BACKEND_STORAGE_ROUTING: "/etc/asap/backend-storage-routing.yaml"
      # Thanos archive-tier endpoint. When set, the backend's
      # archive-tier dispatcher forwards `gorilla_archive`-routed
      # queries to thanos-query (mvp-thanos-archive.yml overlay)
      # instead of running the in-process Rust GorillaQueryEngine.
      # The toggle itself lands with Step 2.3 (separate PR); the env
      # knob is wired here so the next dispatch flips behavior
      # without touching compose.
      ASAP_THANOS_QUERY_URL: "${ASAP_THANOS_QUERY_URL:-http://thanos-query:10903}"
    volumes:
      - ../configs/backend-storage-routing.yaml:/etc/asap/backend-storage-routing.yaml:ro

  # Bucket-seed for the Gorilla-S3 cold tier (additive to base.yml's
  # `minio-setup`). Without this the gorillas3 processor's first PUT
  # fails with NoSuchBucket and no archive chunk ever lands on MinIO.
  #
  # Also seeds `asap-gorilla-tsdb`, the Prometheus-format TSDB-block
  # bucket consumed by the Thanos store-gateway sidecar in
  # mvp-thanos-archive.yml. Step 2.1 will start writing blocks here
  # once the gorillas3processor switches to TSDB block format; the
  # bucket needs to exist *before* either thanos-store-gateway scans
  # it or the processor PUTs into it. Note that compose's
  # `depends_on` only waits for this service to *start* — Thanos
  # tolerates an empty bucket and rescans on its sync interval, so a
  # race here is self-healing rather than fatal.
  minio-setup-gorilla:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set asap http://minio:9000 asap asap-local-only &&
        mc mb --ignore-existing asap/asap-gorilla &&
        mc anonymous set download asap/asap-gorilla &&
        mc mb --ignore-existing asap/asap-gorilla-tsdb &&
        mc anonymous set download asap/asap-gorilla-tsdb &&
        echo "asap-gorilla and asap-gorilla-tsdb buckets ready"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────────────────────── 2 agents ──────────────────────────────────
  # Each agent runs the controller-emitted edge config. Until Phase B
  # lands, AGENT_CONFIG defaults to the existing all-sketches overlay
  # so the topology is testable. Phase E swaps these to the
  # controller-emitted YAMLs.

  agent-a:
    <<: *agent-base
    hostname: agent-a
    environment:
      AGENT_ID: "agent-a"
      CONTROLLER_OPAMP_URL: "ws://controller:4320/v1/opamp"
      ASAP_SKETCH_FAMILY: "${ASAP_SKETCH_FAMILY:-ddsketch}"
    volumes:
      - ../configs/${AGENT_CONFIG_A:-asap-otel-agent-b6-asap-single-sketch.yaml}:/etc/otel/config.yaml:ro

  agent-b:
    <<: *agent-base
    hostname: agent-b
    environment:
      AGENT_ID: "agent-b"
      CONTROLLER_OPAMP_URL: "ws://controller:4320/v1/opamp"
      ASAP_SKETCH_FAMILY: "${ASAP_SKETCH_FAMILY:-ddsketch}"
    volumes:
      - ../configs/${AGENT_CONFIG_B:-asap-otel-agent-b6-asap-single-sketch.yaml}:/etc/otel/config.yaml:ro

  # ─────────────────────────────── 1 gateway ─────────────────────────────────
  # Opt-in only (`profiles: ["gateway-legacy"]`). The default
  # deployment routes agent → asapquery-backend directly; this
  # overlay's "wants the gateway running sketch-merge processors"
  # intent requires explicit opt-in:
  #
  #   docker compose --profile gateway-legacy \
  #     -f base.yml -f mvp-multi-stage.yml up
  #
  # Plus the agent configs (mounted via AGENT_CONFIG_A / AGENT_CONFIG_B)
  # must target `gateway:4317` — see the comment on `x-agent` above.
  gateway:
    profiles: ["gateway-legacy"]
    image: asap/asap-otel:dev
    hostname: gateway
    command:
      - "--config=/etc/otel/config.yaml"
    volumes:
      - ../configs/${GATEWAY_CONFIG:-asap-otel-gateway-mvp-placeholder.yaml}:/etc/otel/config.yaml:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  # ─────────────────────────────── B0 baseline VictoriaMetrics ───────────────
  # Brought up only when invoked with `--profile b0`. Receives raw
  # remote-write from the agents (B0/B1/B5 PRW configs) when
  # criterion ① bandwidth comparison is being measured.
  #
  # Step 2g (2026-05): was `prometheus-b0` (prom/prometheus:v2.55.0
  # with --web.enable-remote-write-receiver +
  # prometheus-with-remote-write.yml scrape config). VM accepts the
  # same PRW protocol on /api/v1/write natively — no config file
  # required, CLI flags only.

  victoriametrics-b0:
    image: victoriametrics/victoria-metrics:v1.105.0
    hostname: victoriametrics-b0
    profiles: ["b0"]   # `--profile b0` to enable
    command:
      - "--httpListenAddr=:8428"
      - "--retentionPeriod=2h"
    ports:
      - "19090:8428"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M

  # ─────────────────────────────── pre-work placeholder ──────────────────────
  # Override the base.yml fake-exporter so it doesn't run alongside
  # the 10 producers above (would double-count cardinality).

  fake-exporter:
    image: alpine:3.19
    command: ["sh", "-c", "echo 'mvp overlay disables base fake-exporter; producers-a/b run instead' && sleep infinity"]
    depends_on: []
    environment:
      OVERRIDDEN_BY: "mvp-multi-stage.yml"

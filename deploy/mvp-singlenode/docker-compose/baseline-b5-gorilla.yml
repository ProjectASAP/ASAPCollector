# Baseline B5 selector — Gorilla XOR compression (lossless).
#
# v4 (issue #46) update: the v3 overlay was a pure no-op label —
# fine while Gorilla wrote to disk and bypassed the gateway/
# backend, but wrong now that the v4 demo expects EVERY baseline
# to share the same Prometheus query surface (criterion ⑥
# freshness probes the warm tier via Prometheus). v4 layers the
# Prometheus remote-write-receiver flag so the
# `asap-otel-agent-b5-gorilla-prometheus.yaml` agent config (PRW
# exporter) has a sink.  Without this flag the agent's PRW
# requests would 404 and the freshness/accuracy CSVs would carry
# NaN for B5.
#
# Bring up via:
#
#   AGENT_CONFIG=asap-otel-agent-b5-gorilla-prometheus.yaml \
#     docker compose -f base.yml -f agents-N10.yml \
#       -f baseline-b5-gorilla.yml up -d
#
# Gorilla still writes compressed blobs to /var/tmp/asap-gorilla-out
# inside each agent container; bytes-written are read from the
# patched processor's self-telemetry on :8890. The blob volume is
# container-only tmpfs (carries no host-disk dependency).
#
# v3-compat: legacy callers using
# `AGENT_CONFIG=asap-otel-agent-b5-gorilla.yaml` still work — the
# Prometheus flag is harmless when no PRW client connects.

services:
  controller:
    labels:
      asap.baseline: "b5-gorilla"

  prometheus:
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=otlp-write-receiver"
    volumes:
      - ../configs/prometheus-with-remote-write.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data-b5:/prometheus

volumes:
  prometheus-data-b5:

# Baseline B2 selector — full sketch transmission (DDSketch + HLL
# with `transmit_sketch: true, mode: batch`). This is the default
# already baked into agents-N*.yml's AGENT_CONFIG default, so this
# overlay is strictly a naming marker.
#
#   docker compose -f base.yml -f agents-N1.yml \
#     -f baseline-b2-full.yml up -d
#
# (No AGENT_CONFIG env needed — the default already is this.)

services:
  controller:
    labels:
      asap.baseline: "b2-full"

# Baseline B6-single — single-sketch ASAP + Gorilla-S3 cold archive.
#
# v4 (issue #46) MVP demo replacement for the v3 "all-five-sketches"
# overlay. Same Gorilla-S3 archive wiring as
# `baseline-b6-gorilla-s3.yml`, but the agent config drops four of
# the five sketch processors so the warm tier only carries DDSketch
# (or whatever family `ASAP_SKETCH_FAMILY` selects). Production
# deployments pick ONE sketch per (metric, query family, workload)
# per the controller's plan; the all-five overlay was a
# §3-architecture figure, NOT §5 evaluation data.
#
# Bring up via:
#
#   AGENT_CONFIG=asap-otel-agent-b6-asap-single-sketch.yaml \
#     docker compose -f base.yml -f agents-N10.yml \
#       -f baseline-b6-asap-single-sketch.yml -f e2e-overlay.yml \
#       up -d
#
# Same backend env wiring as v3's b6-gorilla-s3.yml:
#   - GorillaQueryEngine sees the asap-gorilla bucket on MinIO
#   - backend mounts `backend-storage-routing.yaml` so the HTTP
#     query handler dispatches `http_requests_total` (count) and
#     `http_freshness_probe_archive` to the cold engine, and
#     `http_requests_total_latency_ms_quantile` /
#     `http_freshness_probe_warm` to the warm tier.
#
# `ASAP_SKETCH_FAMILY` is read by the agent config; default
# `ddsketch` is the v4 demo's headline path.

services:
  controller:
    labels:
      asap.baseline: "b6-asap-single-sketch"

  # Bucket-seed for the Gorilla-S3 cold tier (additive to base.yml's
  # `minio-setup`).
  minio-setup-gorilla:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set asap http://minio:9000 asap asap-local-only &&
        mc mb --ignore-existing asap/asap-gorilla &&
        mc anonymous set download asap/asap-gorilla &&
        echo "asap-gorilla bucket ready"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Backend env: GorillaQueryEngine + per-metric routing table.
  backend:
    environment:
      ASAP_SKETCH_FAMILY: "${ASAP_SKETCH_FAMILY:-ddsketch}"
      ASAP_GORILLA_S3_ENDPOINT: "http://minio:9000"
      ASAP_GORILLA_S3_BUCKET: "asap-gorilla"
      ASAP_GORILLA_S3_REGION: "us-east-1"
      ASAP_GORILLA_S3_ACCESS_KEY_ID: "asap"
      ASAP_GORILLA_S3_SECRET_ACCESS_KEY: "asap-local-only"
      ASAP_GORILLA_S3_TENANT: "default"
      ASAP_GORILLA_S3_USE_SSL: "false"
      ASAP_GORILLA_S3_PREFIX_TEMPLATE: "{tenant}/{metric}/{YYYY}/{MM}/{DD}/{HH}/"
      ASAP_BACKEND_STORAGE_ROUTING: "/etc/asap/backend-storage-routing.yaml"
    volumes:
      - ../configs/backend-storage-routing.yaml:/etc/asap/backend-storage-routing.yaml:ro

  # v4 freshness measurement (criterion ⑥): expose agent-1's OTLP
  # HTTP receiver to the host so `measure_freshness.py` can push the
  # synthetic `http_freshness_probe_*` gauges through the agent's
  # pipeline (gorillas3 + ddsketch). Without this the freshness probe
  # would have to push at the gateway, bypassing the agent's
  # gorillas3 processor — the cold archive would never see chunks for
  # the freshness probe metric and the criterion-⑥ archive-path
  # number would be uncomputable.
  agent-1:
    ports:
      - "14328:4318"   # OTLP HTTP (host 14328 → container 4318)

# Phase ε.1 — Mode 3 (RawAtEdgeArchive) overlay.
#
# Step 2g (2026-05): was `mvp-prometheus-archive.yml` (Prometheus 2.55
# with --web.enable-otlp-receiver + --enable-feature=otlp-deltatocumulative
# + prometheus-otlp-receiver.yml). Replaced with VictoriaMetrics v1.105.0:
# VM serves an OTLP HTTP endpoint at `/opentelemetry/api/v1/push` on its
# main port (default 8428) with no configuration required — both OTLP
# HTTP receive and PRW receive are wired on the same listener.
#
# Brings up VictoriaMetrics so the ASAP controller can route
# low-sample-per-window / low-cardinality metrics directly to it
# (Mode 3) instead of building a sketch at the edge or backend.
#
# Layered on top of `mvp-multi-stage.yml`:
#
#   docker compose \
#       -f deploy/mvp-singlenode/docker-compose/base.yml \
#       -f deploy/mvp-singlenode/docker-compose/mvp-multi-stage.yml \
#       -f deploy/mvp-singlenode/docker-compose/mvp-victoriametrics-archive.yml \
#       up -d victoriametrics-archive
#
# The agent's emitted YAML (controller-driven) defaults to
# `http://victoriametrics-archive:8428/opentelemetry/api/v1/push`
# (was `http://prometheus-archive:9090/api/v1/otlp/v1/metrics` pre
# Step 2g — different path prefix, same OTLP HTTP wire format).
# Override via `ASAP_PROMETHEUS_OTLP_URL` (kept the historical env-var
# name to avoid breaking deployments — the value just points at VM
# now) if your deployment uses a different hostname / port.
#
# Backend forwarding:
# The ASAPQuery backend's `prometheus_remote` engine (Phase ε.2)
# consults `ASAP_PROMETHEUS_QUERY_URL` (default
# `http://victoriametrics-archive:8428`; previously
# `http://prometheus-archive:9090`) for query forwarding to
# `/api/v1/query`. VM serves the PromQL HTTP API on the same port as
# its OTLP / PRW receivers — no separate config needed beyond this
# overlay.
#
# Notes on the deltatocumulative knob:
#   The Prometheus version of this overlay required
#   `--enable-feature=otlp-deltatocumulative` so OTel delta-encoded
#   counters / sums (the SDK default) survived ingest. VM accepts
#   both delta and cumulative temporality natively, so there's no
#   equivalent flag to set — the moving part is just gone.

services:
  victoriametrics-archive:
    image: victoriametrics/victoria-metrics:v1.105.0
    hostname: victoriametrics-archive
    command:
      - "--httpListenAddr=:8428"
      - "--retentionPeriod=2h"
    ports:
      - "29090:8428"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1536M

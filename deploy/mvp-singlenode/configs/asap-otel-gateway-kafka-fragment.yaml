# Kafka-bridged cold-path GATEWAY config — durable_fragment delivery mode.
#
# ── Why this file exists ──────────────────────────────────────────────
#
# Pair to asap-otel-agent-kafka-fragment.yaml — the gateway-side
# pipeline that drains the durable Kafka bridge, finalizes a Prometheus
# TSDB block per window, and PUTs the block to the asap-gorilla-tsdb
# bucket on MinIO.
#
# Pipeline:
#
#     kafkareceiver (consumer group: asap-gateway-fragment)
#         │   ── fragment metrics from topic asap.gorilla.fragments ──
#         ▼
#     gorillas3 (role=gateway_fragment, delivery_mode=durable_fragment)
#         │   ── finalize + PUT to S3 internally
#         │      (asap-gorilla-tsdb bucket, prometheus_tsdb block format)
#         ▼
#     debug exporter (no-op)
#
# `role=gateway_fragment` means the processor consumes fragment metrics
# (NOT raw samples) and finalizes them into a TSDB block. The
# downstream `debug` exporter is a placeholder — the processor itself
# is the terminal sink in this pipeline (the S3 PUT is internal to
# gorillas3, not exporter-mediated). OCB still requires a downstream
# exporter for pipeline validation, hence `debug`. Mirrors the same
# pattern as asap-otel-agent-gorillas3-tier.yaml.
#
# ── Deploy shape ──────────────────────────────────────────────────────
#
# Composes with deploy/mvp-singlenode/docker-compose/base.yml +
# deploy/mvp-singlenode/docker-compose/mvp-kafka-cold-path.yml. The gateway-kafka
# service in the overlay mounts this YAML at /etc/otel/config.yaml.
#
# `endpoint: http://minio:9000` matches the existing MinIO service in
# base.yml. Bucket `asap-gorilla-tsdb` is pre-created by the overlay's
# `minio-setup-fragments` short-lived container; without that the first
# PUT would fail NoSuchBucket and the e2e assertion would never see
# blocks land.
#
# Health/telemetry on :8889 (NOT :8888 like the agent half) so the
# overlay can run agent-kafka and gateway-kafka on the same host
# network without double-binding. Mirrors the gateway-vs-agent port
# split convention in mvp-multi-stage.yml (gateway :18890 host →
# :8890 container).
#
# Comment density mirrors asap-otel-agent-b6-asap-single-sketch.yaml.

receivers:
  # ── Durable bridge: Kafka consumer ───────────────────────────────────
  #
  # Upstream contrib `kafkareceiver`, bundled in
  # cmd/asap-otel/builder-config.yaml. Config keys mirror
  # opentelemetry-collector-contrib/receiver/kafkareceiver/config.go:
  #
  #   • brokers          — bootstrap server list (matches the agent's
  #                        kafkaexporter brokers verbatim).
  #   • group_id         — distinct consumer group per cold-path stage
  #                        so multiple gateway replicas would share the
  #                        partition assignment via Kafka's standard
  #                        rebalance, while a hypothetical sibling
  #                        `gateway_raw` consumer (durable_raw mode)
  #                        could read the same topic with a different
  #                        group_id without stealing offsets. Pinned
  #                        per the brief: `asap-gateway-fragment`.
  #   • initial_offset   — `earliest` so the e2e test sees fragments
  #                        the agent produced BEFORE the gateway's
  #                        consumer group registered (avoids a race
  #                        where agent-kafka starts before
  #                        gateway-kafka and the gateway misses the
  #                        first window). Default is `latest`.
  #   • metrics.topic    — match the agent's exporter
  #                        `metrics.topic`. This is the canonical
  #                        topic for fragment-mode bridging:
  #                        `asap.gorilla.fragments`.
  #   • metrics.encoding — `otlp_proto`, mirroring the producer side.
  kafka:
    brokers:
      - kafka:9092
    group_id: asap-gateway-fragment
    initial_offset: earliest
    metrics:
      topic: asap.gorilla.fragments
      encoding: otlp_proto

processors:
  # ── Cold tier (gateway half): Prometheus TSDB block finalizer ────────
  #
  # role=gateway_fragment + delivery_mode=durable_fragment finalizes
  # fragment metrics into a TSDB block per window_interval and PUTs the
  # block to the asap-gorilla-tsdb bucket. The OTLP downstream sees
  # nothing — gorillas3 swallows the fragment-input stream by design
  # (the cold-path is terminal at the gateway).
  #
  # Field rationale:
  #   • bucket / tsdb_bucket — split so warm OTLP-forwarded raw chunks
  #     (asap-gorilla, .gor format) are kept SEPARATE from the
  #     Prometheus TSDB blocks (asap-gorilla-tsdb, block_format:
  #     prometheus_tsdb) the Thanos store-gateway sidecar reads. In
  #     fragment-mode there are no .gor files written (the agent
  #     already encoded everything before Kafka), but the Config still
  #     requires `bucket` to be non-empty for non-agent roles
  #     (config.go:205-207). We set `bucket: asap-gorilla-fragments` to
  #     give the gorilla raw-chunk path a dedicated bucket if the
  #     processor's internals ever spill there; the canonical sink for
  #     this pipeline is `tsdb_bucket: asap-gorilla-tsdb`.
  #   • endpoint / region / use_ssl — match the MinIO defaults from
  #     base.yml (the gateway runs on the same docker network so the
  #     `minio` hostname resolves directly).
  #   • access_key_id / secret_access_key — env-resolved with MinIO
  #     defaults via the `${env:VAR:-default}` confmap form. The
  #     OTel v0.106 confmap rejects shell-style `${VAR:-default}` (see
  #     the b6 placeholder's comment about that), but the
  #     `${env:VAR:-default}` form with the `env:` provider prefix is
  #     accepted at v0.141 — see go.opentelemetry.io/collector/confmap/
  #     provider/envprovider. If a deploy ever ships without the env
  #     vars set, the defaults match base.yml's MINIO_ROOT_USER /
  #     MINIO_ROOT_PASSWORD verbatim.
  #   • window_interval: 60s — same default as the rest of the
  #     gorillas3 family. Each tick drains the per-window fragment
  #     buffer, finalizes a TSDB block, and PUTs it.
  #   • block_format: prometheus_tsdb — the only supported format
  #     today (see config.go BlockFormat type). Pinned explicitly so
  #     a future format addition doesn't silently change behavior.
  gorillas3:
    role: gateway_fragment
    delivery_mode: durable_fragment
    window_interval: 60s
    endpoint: http://minio:9000
    bucket: asap-gorilla-fragments
    tsdb_bucket: asap-gorilla-tsdb
    block_format: prometheus_tsdb
    region: us-east-1
    use_ssl: false
    access_key_id: ${env:ASAP_S3_ACCESS_KEY:-asap}
    secret_access_key: ${env:ASAP_S3_SECRET_KEY:-asap-local-only}
    prefix_template: "{tenant}/{metric}/{YYYY}/{MM}/{DD}/{HH}/"
    tenant: default
    max_retries: 3
    retry_backoff: 1s
    upload_timeout: 30s

  batch:
    send_batch_size: 1024
    timeout: 1s

exporters:
  # The gorillas3 processor is the terminal sink (PUTs to S3
  # internally). OCB requires a downstream exporter for pipeline
  # validation, so we wire `debug` as a documented no-op — same shape
  # as asap-otel-agent-gorillas3-tier.yaml.
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [kafka]
      processors: [gorillas3, batch]
      exporters: [debug]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8889

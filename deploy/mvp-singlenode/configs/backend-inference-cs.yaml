# Warm-tier dispatch table (CountSketch single-sketch overlay).
#
# Subset of `backend-inference.yaml` (which mirrors PR #79's
# `inference_config.yaml`) restricted to the families that route to
# the CountSketch accumulator:
#
#   * `topk(N, …)` — Statistic::Topk; CountSketch's `query_statistic`
#     returns the row-mean total when no key is supplied. Per-key
#     enumeration is served by the heap-bearing variant
#     `CountSketchWithHeap` (see asapquery-backend PR #258 for the
#     wire-up); the heap-less CountSketch agent overlay used here
#     answers point-frequency only.
#   * Spatial `sum` / `count` — Statistic::{Sum,Count} no-key
#     fallback (PROGRESS.md "All-five-sketch runtime e2e verification
#     (2026-04-30)" — `sum_over_time(http_requests_total[1m])` →
#     24266 with ε=0.03 `additive_frequency` envelope).
#   * `sum_over_time` / `count_over_time` × [1m]/[2m]/[5m].
#   * `rate` / `increase` — same Sum family.
#
# `quantile_over_time` / `histogram_quantile` excluded (CountSketch
# does not back rank statistics).
#
# Metric: `http_requests_total` (no suffix). The CountSketch direct
# agent overlay (`asap-otel-agent-cs-direct.yaml`) preserves the raw
# metric name through the processor.
cleanup_policy:
  name: "circular_buffer"
metrics:
  http_requests_total:
  - zone
  - rack
  - node
  - pod
queries:
# ── Spatial Sum / Count ───────────────────────────────────────────────
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: sum(http_requests_total)
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: count(http_requests_total)
# ── sum_over_time / count_over_time × wider ranges ────────────────────
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: sum_over_time(http_requests_total[1m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: sum_over_time(http_requests_total[2m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: sum_over_time(http_requests_total[5m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: count_over_time(http_requests_total[1m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: count_over_time(http_requests_total[2m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: count_over_time(http_requests_total[5m])
# ── rate / increase (delta arithmetic over Sum family) ────────────────
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: rate(http_requests_total[1m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: rate(http_requests_total[2m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: rate(http_requests_total[5m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: increase(http_requests_total[1m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: increase(http_requests_total[5m])
# ── Top-K (CountSketch heavy-hitter readout) ──────────────────────────
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: topk(5, http_requests_total)
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: topk(10, http_requests_total)
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: topk(50, http_requests_total)

# Warm-tier dispatch table (HyperLogLog single-sketch overlay).
#
# Subset of `backend-inference.yaml` (which mirrors PR #79's
# `inference_config.yaml`) restricted to the families that route to
# the HLL accumulator:
#
#   * `count(metric)` — Statistic::Count; HLL's `query_statistic`
#     accepts both `Cardinality` and `Count` (alias) and returns the
#     unique-cardinality estimate. PROGRESS.md "All-five-sketch
#     runtime e2e verification (2026-04-30)" verified
#     `count(http_requests_total)` → 149.68 distinct, ε=0.008
#     `relative_cardinality` envelope.
#   * `count_over_time(metric[…])` — temporal Count.
#
# `sum` / `quantile_over_time` / `topk` / `rate` excluded (HLL is a
# cardinality sketch — no value semantics).
#
# Metric: `http_requests_total` / `http_requests_total_latency_ms`
# — Refactor-2026-05: the HLL processor preserves the input metric
# name; sketch encoding is identified by the OTLP HLLSketch variant
# tag, so the backend ingests under the raw name. The `_hll`-suffixed
# keys below are stale relative to the agent emit and should be
# rewritten to the bare names; tracked as a follow-up.
cleanup_policy:
  name: "circular_buffer"
metrics:
  http_requests_total_hll:
  - zone
  - rack
  - node
  - pod
  http_requests_total_latency_ms_hll:
  - zone
  - rack
  - node
  - pod
queries:
# ── Spatial Cardinality (count over an HLL-backed metric) ─────────────
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: count(http_requests_total_hll)
- aggregations:
  - aggregation_id: 2
    num_aggregates_to_retain: 6
  query: count(http_requests_total_latency_ms_hll)
# ── count_over_time × wider ranges ────────────────────────────────────
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: count_over_time(http_requests_total_hll[1m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: count_over_time(http_requests_total_hll[2m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: count_over_time(http_requests_total_hll[5m])
- aggregations:
  - aggregation_id: 2
    num_aggregates_to_retain: 6
  query: count_over_time(http_requests_total_latency_ms_hll[1m])
- aggregations:
  - aggregation_id: 2
    num_aggregates_to_retain: 6
  query: count_over_time(http_requests_total_latency_ms_hll[2m])
- aggregations:
  - aggregation_id: 2
    num_aggregates_to_retain: 6
  query: count_over_time(http_requests_total_latency_ms_hll[5m])

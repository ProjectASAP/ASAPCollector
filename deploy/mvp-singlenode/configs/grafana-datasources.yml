apiVersion: 1

datasources:
  # Step 2g (2026-05): the upstream metrics sink is now VictoriaMetrics
  # (was Prometheus). VM is wire-compatible with the Prometheus
  # datasource type — Grafana queries it through the same
  # `/api/v1/query` HTTP API, so `type: prometheus` stays. Only the
  # `url:` and the user-facing `name:` change.
  - name: VictoriaMetrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    editable: false

  # The ASAPQuery backend exposes a PromQL-compatible HTTP
  # surface on port 9090; Grafana can query it as a second
  # Prometheus-type datasource. The evaluation latency CDF
  # panels switch between these two to produce the "backend vs
  # upstream Prom/VM" figure.
  - name: ASAPQuery
    type: prometheus
    access: proxy
    url: http://backend:9090
    editable: false

# Gateway config: aggregate from SKETCHES. Agents already sketched
# (running their own ddsketch / kll / hll / countsketch /
# countminsketch processor on raw inputs); the gateway receives
# those typed sketch payloads
# (Metric.data = {DDSketch | KLLSketch | HLLSketch | CountSketch
#  | CountMinSketch} on tags 13–17), merges them per series_key
# inside a window, and forwards the merged sketches downstream.
#
# Use when:
#   - Agents emit sketches (the standard ASAP sketch-at-the-edge
#     deployment) and the controller has placed a *gateway-tier
#     merge* in the plan to combine cross-agent sketches before
#     backend ingest.
#   - Bandwidth between gateway and backend is constrained: a
#     single merged sketch per window per metric replaces N
#     per-agent sketches.
#
# Requires the `asap/asap-otel:dev` image (built from
# `opentelemetry-collector-contrib-patch/`).
#
# IMPORTANT: this config uses the SAME processors the agent uses
# (`ddsketch`, `kll`, `hll`, `countsketch`, `countminsketch`), not
# the separate `countminsketchmerge` / `countsketchmerge`
# processors. Each of those five processors handles BOTH:
#   - raw input (`Metric.data = Gauge|Sum`) → sketch (agent role)
#   - typed sketch input (`Metric.data = DDSketch|...`) → merge
#     (gateway role)
# The dispatch is in the processor's input switch — see
# e.g. `processor/countminsketchprocessor/processor.go`
# `case pmetric.MetricTypeCountMinSketch:` and
# `processor/ddsketchprocessor/processor.go`
# `consumeDDSketchDataPoints`. Configuring them at the gateway
# tier with the same window the agents used produces a
# windowed cross-agent merge for the typed wire format.
#
# (The legacy `countminsketchmerge` / `countsketchmerge`
# processors handle a *different* wire format — Gauge data
# points with `aggregation_key` + `sketch_payload` byte
# attributes, used before typed `Metric.data` variants 13–17
# were added. Not used in today's e2e.)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 64
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  attributes/drop-internal:
    actions:
      - key: telemetry.sdk.name
        action: delete
      - key: telemetry.sdk.language
        action: delete
      - key: telemetry.sdk.version
        action: delete

  # ---------- Sketch processors in MERGE mode ----------
  # Same window/transmit settings as the agent. When the input is
  # a typed sketch data point, the processor decodes it,
  # accumulates by series_key for window_duration, and emits the
  # merged sketch downstream as a typed data point.
  ddsketch:
    mode: window
    window_duration: 30s
    transmit_sketch: true
    delta_transmission: false
    enable_self_monitoring: true
    quantiles: [0.5, 0.9, 0.99]

  # Uncomment to also merge KLL / HLL / CountSketch / CMS at the
  # gateway tier. Each pipeline-processor entry below must be added
  # to `service.pipelines.metrics.processors` for the merge to fire.
  #
  # kll:
  #   mode: window
  #   window_duration: 30s
  #   transmit_sketch: true
  #   k: 200
  #
  # hll:
  #   mode: window
  #   window_duration: 30s
  #   transmit_sketch: true
  #   precision: 14
  #
  # countsketch:
  #   mode: window
  #   window_duration: 30s
  #   transmit_sketch: true
  #   width: 1024
  #   depth: 5
  #
  # countminsketch:
  #   mode: window
  #   window_duration: 30s
  #   transmit_sketch: true
  #   width: 2048
  #   depth: 5

exporters:
  otlp/backend:
    endpoint: backend:4317
    tls:
      insecure: true
    sending_queue:
      enabled: true
    compression: none

service:
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8890
  pipelines:
    metrics:
      receivers: [otlp]
      # Order: prune attributes first; merge sketches; batch last.
      # Two-tier windowing trade-off: the gateway adds 1× window
      # latency on top of the agent's window. Set `window_duration`
      # below the agent's window for tighter end-to-end latency at
      # the cost of more partial merges.
      processors: [attributes/drop-internal, ddsketch, batch]
      exporters: [otlp/backend]

# Kafka-bridged cold-path AGENT config — durable_fragment delivery mode.
#
# ── Why this file exists ──────────────────────────────────────────────
#
# The gorillas3processor advertises three transport reliability envelopes
# via its `delivery_mode` knob (see processor/gorillas3processor/config.go
# DeliveryMode + the README "Durability"):
#
#   • best_effort       — agent fragments → OTel transport → gateway → S3
#                          (zero durability bridge; this is the MVP demo
#                          shape implicitly used by the older
#                          gorillas3-tier config — now removed).
#   • durable_raw       — raw → Kafka → gateway_raw → S3. Replay starts
#                          from raw input.
#   • durable_fragment  — agent fragments → Kafka → gateway_fragment → S3.
#                          Smaller Kafka bandwidth (samples are XOR-
#                          delta-encoded BEFORE the broker sees them);
#                          NO raw replay (the broker only carries
#                          pre-aggregated fragment metrics).
#
# This file ships the AGENT half of the durable_fragment composition.
# The processor itself does NOT touch Kafka (config.go:71-72 is explicit:
# "The processor does not create Kafka topics; durable modes are achieved
# by placing Kafka before gateway_raw or between agent and
# gateway_fragment"); the durability envelope is emergent from the
# pipeline shape:
#
#     otlp receiver
#         │
#         ▼
#     gorillas3 (role=agent, delivery_mode=durable_fragment,
#                drop_original=true)
#         │   ── fragment metrics (msgpack-encoded XOR chunks
#         │      wrapped in OTLP datapoint attributes) ──
#         ▼
#     kafkaexporter → topic asap.gorilla.fragments
#                     │
#                     ▼  (network durability)
#                gateway-side: kafkareceiver consumes the same topic and
#                feeds gorillas3 (role=gateway_fragment) which finalizes
#                a Prometheus TSDB block in the asap-gorilla-tsdb bucket.
#
# `drop_original: true` — fragment metrics are the only thing that needs
# to traverse Kafka; the agent must not also OTLP-forward the raw stream
# (the gateway pipeline is Kafka-only, no OTLP entry point). This matches
# the agent-side comment pattern from the older gorillas3-tier
# config (now removed).
#
# ── Deploy shape ──────────────────────────────────────────────────────
#
# Composes with deploy/mvp-singlenode/docker-compose/base.yml +
# deploy/mvp-singlenode/docker-compose/mvp-kafka-cold-path.yml. The agent-kafka service
# in the overlay mounts this YAML at /etc/otel/config.yaml.
#
# Source identity (`source_id`) is hardcoded `edge-a` here — the overlay
# only spawns one agent. For multi-agent deploys, override via
# `${env:ASAP_SOURCE_ID}` once the overlay scales out (mirrors the
# AGENT_ID env-var handling in mvp-multi-stage.yml's agent-base).
#
# Health/telemetry on :8888 (NOT :8890 like the b6 pipelines) so a host
# wiring `mvp-multi-stage.yml` + `mvp-kafka-cold-path.yml` together
# would not double-bind 8890 if both came up at once.
#
# Comment density mirrors asap-otel-agent-b6-asap-single-sketch.yaml.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        # Match the agent receivers in the b6 family: 64 MiB so a
        # high-cardinality producer batch doesn't trip the 4 MiB grpc
        # default. The fragment encoder reduces wire bytes downstream
        # anyway, but the receive side still has to admit the raw OTLP
        # batch.
        max_recv_msg_size_mib: 64
      http:
        endpoint: 0.0.0.0:4318

processors:
  # ── Cold tier (agent half): Gorilla XOR-delta fragment encode ────────
  #
  # role=agent + delivery_mode=durable_fragment is the contract that
  # makes this pipeline a fragment producer rather than a TSDB-block
  # writer. In agent role:
  #   • Bucket / TSDB-bucket / S3 endpoint are NOT required (the agent
  #     never PUTs to S3 in this role — it just emits fragment metrics).
  #     Validate() in processor/gorillas3processor/config.go skips the
  #     "bucket must be set" check when Role == agent (see config.go:205,
  #     `if c.Role != ProcessorRoleAgent && c.Bucket == ""`).
  #   • drop_original=true so the raw OTLP stream is consumed by this
  #     processor and only the synthesized fragment metric leaves the
  #     pipeline. Without this the agent would also push raw samples
  #     through the kafkaexporter, doubling Kafka bandwidth and breaking
  #     the "smaller Kafka bandwidth, no raw replay" property of
  #     durable_fragment mode.
  #   • source_id labels the fragments so the gateway can attribute
  #     them back to the originating agent (mirrors the SourceID field
  #     in config.go:124).
  #   • fragment_samples_per_chunk default is 120 — the encoder packs
  #     120 raw samples into one XOR fragment before emitting it
  #     downstream (see config.go:128). Held at the default here; the
  #     b6 baselines tune this only when the producer cardinality is
  #     known.
  gorillas3:
    role: agent
    delivery_mode: durable_fragment
    drop_original: true
    window_interval: 60s
    fragment_samples_per_chunk: 120
    source_id: edge-a
    # No bucket / endpoint / credentials — agent role never writes to S3.
    # The gateway half (asap-otel-gateway-kafka-fragment.yaml) holds those.

  batch:
    send_batch_size: 1024
    timeout: 1s

exporters:
  # ── Durable bridge: Kafka producer ───────────────────────────────────
  #
  # `kafka` is the upstream contrib `kafkaexporter`, bundled in
  # cmd/asap-otel/builder-config.yaml. Config keys mirror
  # opentelemetry-collector-contrib/exporter/kafkaexporter/config.go:
  #
  #   • brokers       — bootstrap server list. `kafka:9092` is the
  #                     service name from mvp-kafka-cold-path.yml.
  #   • metrics.topic — signal-specific override; the deprecated
  #                     top-level `topic` key still works at v0.141 but
  #                     emits a deprecation warning. Use the per-signal
  #                     form to stay current (see kafkaexporter
  #                     config.go:42-47).
  #   • metrics.encoding — `otlp_proto`, the canonical OTLP/Protobuf
  #                     wire format. The gateway's kafkareceiver MUST
  #                     declare the same encoding or the consumer side
  #                     will fail to decode. otlp_proto is the default
  #                     when omitted, but pin it explicitly for clarity.
  #   • producer.required_acks: 1 — wait only for the leader to ack;
  #                     overrides default `WaitForLocal`. For the e2e
  #                     test we never run with replicas, so a single
  #                     ack is sufficient and minimizes flush latency.
  #   • producer.compression: snappy — fragment metrics are already
  #                     XOR-encoded and msgpack-wrapped, so snappy on
  #                     the broker payload mostly squeezes the OTLP
  #                     envelope. Negligible per-message but compounds
  #                     across a 60s flush window.
  kafka:
    brokers:
      - kafka:9092
    metrics:
      topic: asap.gorilla.fragments
      encoding: otlp_proto
    producer:
      required_acks: 1
      compression: snappy

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [gorillas3, batch]
      exporters: [kafka]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

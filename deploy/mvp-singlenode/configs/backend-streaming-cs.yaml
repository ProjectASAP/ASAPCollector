# Refactor-2026-05: NO sketch processor (CountSketch / CMS / DDSketch
# / KLL / HLL) adds a metric-name suffix on the wire — sketch type is
# identified by the OTLP pdata.Metric variant tag instead. Wire metric
# names always match the input: `http_requests_total` (Sum) and
# `http_requests_total_latency_ms` (Gauge).
aggregations:
- aggregationId: 1
  aggregationType: CountSketch
  aggregationSubType: ''
  labels:
    grouping: [zone]
    rollup: [rack, node, pod]
    aggregated: []
  metric: http_requests_total
  parameters:
    d: 5
    w: 1024
  windowSize: 30
  windowType: tumbling
  spatialFilter: ''
- aggregationId: 2
  aggregationType: CountSketch
  aggregationSubType: ''
  labels:
    grouping: [zone]
    rollup: [rack, node, pod]
    aggregated: []
  metric: http_requests_total_latency_ms
  parameters:
    d: 5
    w: 1024
  windowSize: 30
  windowType: tumbling
  spatialFilter: ''
metrics:
  http_requests_total:
    - zone
    - rack
    - node
    - pod
  http_requests_total_latency_ms:
    - zone
    - rack
    - node
    - pod

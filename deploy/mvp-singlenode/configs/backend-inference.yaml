# Warm-tier dispatch table (all-sketch default).
#
# Mirrors `ASAPQuery-backend/asap-query-engine/examples/promql/inference_config.yaml`
# (PR #79 — eval(inference): expand warm-tier PromQL pattern coverage)
# entry-for-entry, transposed onto the metric names the deploy
# stack actually emits:
#
#   * `http_requests_total_latency_ms_quantile`  — DDSketch / KLL,
#     produced by `gateway-aggregate-from-raw.yaml` (`metric_suffix:
#     "_quantile"`) from the fake-exporter's `*_latency_ms` gauge.
#   * `http_requests_total_quantile`             — DDSketch / KLL,
#     produced by the same gateway path from the `http_requests_total`
#     counter.
#   * `http_requests_total`                       — raw counter
#     emitted by fake-exporter and forwarded unsuffixed by the
#     CountMinSketch / CountSketch agent processors (which preserve
#     metric_name). Routes to CMS / CountSketch on Sum / Count.
#
# Each (query, aggregation_id) pair binds a PromQL pattern to a
# precompute plan. The exact-string match in `find_query_config`
# requires the request query to canonicalize to one of the listed
# strings — wider-range / wider-shape variants need their own entries
# here, otherwise the request falls through to capability matching
# and (failing that) the cold tier. See PR #79's
# `tests/inference_yaml_pattern_coverage.rs` for the runtime contract.
#
# NOT covered: `histogram_quantile(φ, …)`. The engine's
# `controller_patterns` (asap-query-engine/src/engines/simple_engine.rs)
# does not include a `histogram_quantile` pattern block; queries of
# that shape are rejected before reaching this YAML. Use
# `quantile_over_time(φ, *_quantile[…])` against the pre-aggregated
# `*_quantile` metric instead. Tracked upstream for engine
# pattern-matcher extension.
cleanup_policy:
  name: "circular_buffer"
metrics:
  http_requests_total_latency_ms_quantile:
  - zone
  - rack
  - node
  - pod
  http_requests_total_quantile:
  - zone
  - rack
  - node
  - pod
  http_requests_total:
  - zone
  - rack
  - node
  - pod
queries:
# ── Spatial quantile (multi-quantile) ─────────────────────────────────
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile by (zone) (0.5, http_requests_total_latency_ms_quantile)
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile by (zone) (0.9, http_requests_total_latency_ms_quantile)
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile by (zone) (0.95, http_requests_total_latency_ms_quantile)
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile by (zone) (0.99, http_requests_total_latency_ms_quantile)
# ── quantile_over_time: multi-quantile × wider ranges ─────────────────
# Routes to `Statistic::Quantile`; supported by DDSketch / KLL
# accumulators.
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile_over_time(0.5, http_requests_total_latency_ms_quantile[1m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile_over_time(0.9, http_requests_total_latency_ms_quantile[1m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile_over_time(0.95, http_requests_total_latency_ms_quantile[1m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile_over_time(0.99, http_requests_total_latency_ms_quantile[1m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile_over_time(0.5, http_requests_total_latency_ms_quantile[2m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile_over_time(0.9, http_requests_total_latency_ms_quantile[2m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile_over_time(0.95, http_requests_total_latency_ms_quantile[2m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile_over_time(0.99, http_requests_total_latency_ms_quantile[2m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile_over_time(0.5, http_requests_total_latency_ms_quantile[5m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile_over_time(0.9, http_requests_total_latency_ms_quantile[5m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile_over_time(0.95, http_requests_total_latency_ms_quantile[5m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile_over_time(0.99, http_requests_total_latency_ms_quantile[5m])
# ── sum_over_time / count_over_time: wider ranges ─────────────────────
# Routes to `Statistic::Sum` / `Statistic::Count`; supported by
# DDSketch / CountSketch / CountMinSketch accumulators (no-key
# total-volume fallback per PROGRESS.md 2026-04-30 verification).
- aggregations:
  - aggregation_id: 2
    num_aggregates_to_retain: 6
  query: sum_over_time(http_requests_total[1m])
- aggregations:
  - aggregation_id: 2
    num_aggregates_to_retain: 6
  query: sum_over_time(http_requests_total[2m])
- aggregations:
  - aggregation_id: 2
    num_aggregates_to_retain: 6
  query: sum_over_time(http_requests_total[5m])
- aggregations:
  - aggregation_id: 2
    num_aggregates_to_retain: 6
  query: count_over_time(http_requests_total[1m])
- aggregations:
  - aggregation_id: 2
    num_aggregates_to_retain: 6
  query: count_over_time(http_requests_total[2m])
- aggregations:
  - aggregation_id: 2
    num_aggregates_to_retain: 6
  query: count_over_time(http_requests_total[5m])
# ── rate / increase: delta-capable sketches ───────────────────────────
# Routes to `Statistic::Rate` / `Statistic::Increase`; supported by
# IncreaseAccumulator / MultipleIncreaseAccumulator. KLL has no delta
# and will return an error for these — pair this YAML with an
# Increase-typed streaming aggregation when serving rate/increase
# queries.
- aggregations:
  - aggregation_id: 2
    num_aggregates_to_retain: 6
  query: rate(http_requests_total[1m])
- aggregations:
  - aggregation_id: 2
    num_aggregates_to_retain: 6
  query: rate(http_requests_total[2m])
- aggregations:
  - aggregation_id: 2
    num_aggregates_to_retain: 6
  query: rate(http_requests_total[5m])
- aggregations:
  - aggregation_id: 2
    num_aggregates_to_retain: 6
  query: increase(http_requests_total[1m])
- aggregations:
  - aggregation_id: 2
    num_aggregates_to_retain: 6
  query: increase(http_requests_total[5m])
# ── Cardinality / generic spatial aggregations ────────────────────────
# `count` over an HLL-backed aggregation routes to `Statistic::Count`,
# which the HLL accumulator answers as a unique-cardinality estimate.
# `sum` / `avg` route to `Statistic::Sum` / `(Sum, Count)`.
- aggregations:
  - aggregation_id: 2
    num_aggregates_to_retain: 6
  query: count(http_requests_total)
- aggregations:
  - aggregation_id: 2
    num_aggregates_to_retain: 6
  query: sum(http_requests_total)
- aggregations:
  - aggregation_id: 2
    num_aggregates_to_retain: 6
  query: avg(http_requests_total)
# ── Top-K (CountSketch / CountMinSketch heavy-hitter readout) ─────────
# `topk(N, …)` routes to `Statistic::Topk`. Per-key enumeration is
# answered by heap-bearing variants (`CountSketchWithHeap` /
# `CountMinSketchWithHeap`) — see asapquery-backend PR #258 for the
# wire-up. Heap-less CountSketch / CountMin return the row-mean
# total when no key is supplied (frequency point query).
- aggregations:
  - aggregation_id: 2
    num_aggregates_to_retain: 6
  query: topk(5, http_requests_total)
- aggregations:
  - aggregation_id: 2
    num_aggregates_to_retain: 6
  query: topk(10, http_requests_total)
- aggregations:
  - aggregation_id: 2
    num_aggregates_to_retain: 6
  query: topk(50, http_requests_total)

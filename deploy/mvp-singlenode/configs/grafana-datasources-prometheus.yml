apiVersion: 1

# Prometheus-backend variant of `grafana-datasources.yml`. Mounted by
# `mvp-prometheus.yml` when the user opts into the Prometheus storage
# overlay instead of the default VictoriaMetrics. The ASAPQuery
# backend datasource is unaffected — it speaks PromQL on its own
# port regardless of which storage tier is in front of it.

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: ASAPQuery
    type: prometheus
    access: proxy
    url: http://backend:9090
    editable: false

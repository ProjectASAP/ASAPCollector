# Bootstrap config for the KLL e2e verification — single-sketch
# pipeline using the patched KLL processor (sketchlib-go-backed,
# `SerializePortable` wire format byte-compatible with the Rust
# backend's `DatasketchesKLLAccumulator::from_sketchlib_proto_bytes`).
extensions:
  opamp:
    server:
      ws:
        endpoint: ws://controller:4320/v1/opamp
        headers:
          X-Agent-ID: "agent-1"

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  KLL:
    mode: window
    window_duration: 30s
    k: 200
    transmit_sketch: true
    enable_self_monitoring: true
    quantiles: [0.5, 0.9, 0.99]

  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  otlp/backend:
    endpoint: backend:4317
    tls:
      insecure: true
    compression: none

service:
  extensions: [opamp]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [KLL, batch]
      exporters: [otlp/backend]

  telemetry:
    logs:
      level: info

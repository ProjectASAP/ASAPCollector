# Gorilla-S3 cold-engine tier (Phase 2 of the cold-engine integration).
#
# Mirrors the b5-gorilla baseline shape but swaps the local-dir sink
# for the S3-cold-engine `gorillas3` processor: encode raw samples
# with Gorilla XOR-delta, write 60s chunks to MinIO, and DROP the
# original metric so the agent does not OTLP-forward the bytes.
#
# Reuses the existing `minio` container in deploy/docker-compose/base.yml
# (no overlay change needed). Bucket `asap-gorilla` must exist; the
# minio-setup container only seeds `raw` for the cold-fallback adapter,
# so add a second `mc mb asap/asap-gorilla` step in your overlay or
# pre-create the bucket via `mc`.
#
# Selfmonitor counters published on :8890 (Prometheus pull):
#   gorillas3_chunks_written_total
#   gorillas3_chunk_bytes_written_total
#   gorillas3_chunk_points_written_total
#   gorillas3_s3_put_failures_total
# plus the standard otelcol_datacollector_processor_* counters from
# the upstream selfmonitor.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  gorillas3:
    window_interval: 60s
    drop_original: true
    endpoint: http://minio:9000
    bucket: asap-gorilla
    region: us-east-1
    use_ssl: false
    # MinIO root creds from base.yml. Replace with env-resolution in
    # production deploys (e.g. ${env:MINIO_ACCESS_KEY}).
    access_key_id: asap
    secret_access_key: asap-local-only
    prefix_template: "{tenant}/{metric}/{YYYY}/{MM}/{DD}/{HH}/"
    tenant: default
    max_retries: 3
    retry_backoff: 1s
    upload_timeout: 30s

exporters:
  # The agent does not forward when drop_original=true, but a
  # downstream pipeline component is still required so OCB validates
  # the pipeline. We use `debug` to keep the wire-out side a no-op.
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [gorillas3]
      exporters: [debug]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8890

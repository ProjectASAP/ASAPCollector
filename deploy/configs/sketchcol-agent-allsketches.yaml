# All-sketches single-agent demo config — paper §Architecture figure.
#
# This config is the YAML embodiment of the architecture diagram in
# `docs/paper-outline.md` §Architecture: ONE sketchcol agent runs ALL
# FIVE sketch families (DDSketch + KLL + HLL + CountSketch +
# CountMinSketch) concurrently in a single OTLP metrics pipeline, so
# the backend can serve ALL FIVE PromQL query families
# (`quantile_over_time`, `count` cardinality, `sum_over_time`,
# `topk`, `rate`/`increase`) from a single agent.
#
# This is paper-figure / architecture-demo material, NOT §5
# evaluation data. The per-sketch direct configs
# (`sketchcol-agent-{cs,cms,hll,kll}-direct.yaml` plus
# `sketchcol-agent-b3-delta.yaml`) are what the §5 sweep
# (`run_e2e_sweep.sh`) drives — each cell isolates one sketch so
# per-family resource numbers (CPU, bytes/s, accuracy) are
# attributable. Production deployments likewise pick ONE sketch per
# (metric, query family, workload) per the controller's plan; running
# all five at once on the same input only makes sense when the goal
# is to demonstrate "one agent → five concurrent sketch pipelines →
# backend serves five concurrent query families" for §3 architecture
# walkthrough.
#
# Pairs with `deploy/configs/backend-inference.yaml`, which is the
# warm-tier dispatch table covering all five sketches' query patterns
# against the metric names this config emits (see "Output metric
# naming" below).
#
# ──────────────────────────────────────────────────────────────────
# Output metric naming (verified against `backend-inference.yaml`,
# the unified all-sketch warm-tier dispatch table this config pairs
# with):
#   * DDSketch     → `<input>_quantile`     (metric_suffix "_quantile")
#       e.g. `http_requests_total_latency_ms_quantile`. Backend's
#       `DDSketchAccumulator` answers the `_quantile` queries in
#       `backend-inference.yaml`.
#   * KLL          → `<input>_quantile`     (metric_suffix "_quantile")
#       Same name AS DDSketch — the unified inference table's
#       comment (line ~8 of `backend-inference.yaml`) explicitly
#       documents `*_quantile` as "DDSketch / KLL". DDSketch and KLL
#       emit different typed `Metric.data` variants
#       (`DDSketchDataPoint` vs `KLLSketchDataPoint` — proto tags 13
#       vs 14, see `opentelemetry-proto-patch/`), so they do not
#       collide on the OTLP wire. The backend's `OtlpReceiver`
#       dispatches on the typed variant, not the metric name; both
#       accumulators ingest into separate per-typed-variant streams.
#   * HLL          → `<input>_hll`          (metric_suffix "_hll")
#       e.g. `http_requests_total_hll`. The unified
#       `backend-inference.yaml` lists `count(http_requests_total)`
#       (raw name) under HLL coverage, but the HLL processor's
#       encode path always appends a non-empty suffix — `<input>_hll`
#       when `metric_suffix: "_hll"` is set, or
#       `<input>_hll_cardinality` (default) when unset. There is no
#       way to make HLL emit on the bare raw name; HLL queries
#       against this agent currently fall through to the cold tier
#       under the unified inference table. Tracked as a follow-up
#       (add an `http_requests_total_hll` block to the unified
#       table); out of scope for the §3 paper-figure story.
#   * CountSketch  → `<input>` (raw name preserved; typed
#       `CountSketchDataPoint`). The processor has no metric_suffix
#       option (see countsketchprocessor/config.go); the unified
#       inference YAML routes `topk` / `sum_over_time` /
#       `count_over_time` over `http_requests_total` to
#       `CountSketchAccumulator` via the typed-data-point variant.
#   * CountMin     → `<input>` (raw name preserved; typed
#       `CountMinSketchDataPoint`). `metric_name` filters which
#       input metric the processor consumes (it does not auto-
#       process every series).
#
# CountSketch and CountMin both emit on the raw metric name
# `http_requests_total`, but each emits a *different* typed
# `Metric.data` variant (`CountSketchDataPoint` vs
# `CountMinSketchDataPoint` — proto tags 16 vs 17, see
# `opentelemetry-proto-patch/`), so they do not collide on the
# OTLP wire — same disambiguation pattern as DDSketch + KLL
# above.
# ──────────────────────────────────────────────────────────────────
extensions:
  opamp:
    server:
      ws:
        endpoint: ws://controller:4320/v1/opamp
        # Header-based agent identification — see
        # `sketchcol-agent-b3-delta-direct.yaml` for the rationale
        # (controller's OpAMP server uses X-Agent-ID, not the
        # InstanceUid carried in the OpAMP message body).
        headers:
          X-Agent-ID: "agent-1"

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # ── DDSketch — quantile family (relative-error). ─────────────────
  # Emits `<input>_quantile` typed DDSketch data points; backend's
  # `DDSketchAccumulator` answers `quantile_over_time` /
  # `quantile by (...)` from the merged sketch.
  ddsketch:
    mode: window
    window_duration: 30s
    transmit_sketch: true
    # Delta-encoded transmission (DDSketch + HLL + CountSketch +
    # Count-Min default) — only buckets that changed since the last
    # flush travel on the wire. Matches the processor factory's
    # `DeltaTransmission: true` default; pinned here for clarity so
    # the all-sketches demo doesn't accidentally regress to
    # full-state if the default ever flips back.
    delta_transmission: true
    enable_self_monitoring: true
    quantiles: [0.5, 0.9, 0.99]
    metric_suffix: "_quantile"

  # ── KLL — quantile family (rank-error). ──────────────────────────
  # `<input>_quantile` typed KLLSketch data points (same name as
  # DDSketch above; different typed `Metric.data` variant — see the
  # header comment for the wire-format disambiguation rationale).
  # Decoded by the backend's
  # `DatasketchesKLLAccumulator::from_msgpack_bytes`.
  #
  # NO delta_transmission flag for KLL: KLL uses randomised
  # compaction so two sketches over the same input history are not
  # bit-identical and not linearly mergeable. KLL has no delta
  # variant and the wire payload is always full state. See
  # `kllprocessor/config.go::Config.Validate` (rejects
  # `delta_transmission: true`) and `Implementation.tex`
  # ("KLL has no delta variant and matches its full cost").
  KLL:
    mode: window
    window_duration: 30s
    k: 200
    transmit_sketch: true
    enable_self_monitoring: true
    quantiles: [0.5, 0.9, 0.99]
    encoding: msgpack
    metric_suffix: "_quantile"

  # ── HLL — cardinality family. ────────────────────────────────────
  # `<input>_hll` typed HLLSketch data points; backend's
  # `HLLAccumulator::query_statistic` answers `count(<metric>)`
  # (Cardinality + Count alias) from the merged sketch.
  HLL:
    mode: window
    window_duration: 30s
    transmit_sketch: true
    # Delta-encoded transmission default — only registers that
    # increased since the last flush travel on the wire (max
    # semantics). Matches the processor factory default.
    delta_transmission: true
    enable_self_monitoring: true
    encoding: msgpack
    metric_suffix: "_hll"

  # ── CountSketch — heavy-hitter / frequency family. ───────────────
  # Preserves raw metric name (no metric_suffix on this processor —
  # see countsketchprocessor/config.go). Backend routes
  # `topk` / `sum_over_time` / `count_over_time` over
  # `http_requests_total` to `CountSketchAccumulator` via the typed
  # `CountSketchDataPoint` variant.
  countsketch:
    mode: window
    window_duration: 30s
    epsilon: 0.01
    delta: 0.01
    transmit_sketch: true
    # Delta-encoded transmission default — only cells that changed
    # by ≥ delta_threshold since the last flush travel on the wire.
    # Matches the processor factory default.
    delta_transmission: true
    enable_self_monitoring: true
    encoding: msgpack

  # ── CountMinSketch — additive frequency family. ──────────────────
  # `metric_name` is required and filters which input metric the
  # processor consumes (CMS does not auto-process every series).
  # Output preserves the raw name on a typed
  # `CountMinSketchDataPoint`; backend's `CountMinSketchAccumulator`
  # answers Sum / Count via the min-row-sum estimator (PROGRESS.md
  # 2026-04-30: `sum_over_time(http_requests_total[1m])` → 145735,
  # ε≈0.0027).
  countmin:
    mode: window
    window_duration: 30s
    metric_name: "http_requests_total"
    rows: 5
    columns: 1024
    transmit_sketch: true
    # Delta-encoded transmission default — only cells that changed
    # by ≥ delta_threshold since the last flush travel on the wire.
    # Matches the processor factory default.
    delta_transmission: true
    enable_self_monitoring: true
    encoding: msgpack

  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  # OTLP forward to backend, mirroring the per-sketch direct configs.
  # The e2e-overlay's gateway runs `gateway-otlp-forward.yaml`
  # (pure forwarder), so sketches survive the agent → gateway →
  # backend round-trip on the typed `Metric.data` variants.
  otlp/backend:
    endpoint: backend:4317
    tls:
      insecure: true
    # Backend's tonic gRPC server doesn't accept gzip-compressed
    # bodies — keep compression off (mirrors the per-sketch direct
    # configs).
    compression: none

service:
  extensions: [opamp]
  pipelines:
    metrics:
      receivers: [otlp]
      # Order: each sketch processor reads the raw input metrics it
      # recognizes and emits its own typed sketch output alongside
      # (drop_original: false default → raw passes through to the
      # next processor). DDSketch / KLL operate on `*_latency_ms`
      # gauges; HLL on cardinality-bearing series; CS / CMS on the
      # `http_requests_total` counter. `batch` is last so it
      # coalesces all five sketches' output into one OTLP request.
      processors: [ddsketch, KLL, HLL, countsketch, countmin, batch]
      exporters: [otlp/backend]

  telemetry:
    logs:
      level: info

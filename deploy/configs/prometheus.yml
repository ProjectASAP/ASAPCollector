# Prometheus scrape config for the ASAP multi-agent stack.
#
# Architecture note: the **controller is the single aggregator**.
# Agents push batched runtime samples to the controller via
# `sketch-runtime`'s push pipeline (currently HTTP+JSONL; moving
# to gRPC in a follow-up). The controller renders them as
# per-(source, sketch, impl) gauges on `GET /metrics`, and Prom
# scrapes that one endpoint to get every paper §6 signal.
#
# No per-agent scrape is needed — label-keyed gauges on the
# controller carry the equivalent data. Backend + gateway still
# expose their own `/metrics` for query-latency + forwarded-bytes
# that aren't in the sketch-runtime pipeline.

global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  # ── Primary: controller aggregator ──────────────────────────
  # `asap_runtime_*` gauges labelled {source, sketch, impl}
  # come out of RuntimeSamplesStore via metrics_exposer.rs.
  # Paper §6.2 CPU / bandwidth, §6.3 query P99, §6.4 accuracy,
  # §6.5 time_to_plan_ready all land here.
  - job_name: "controller"
    metrics_path: /metrics
    static_configs:
      - targets: ["controller:8080"]

  # ── Backend query-engine internals ──────────────────────────
  # TODO(backend-metrics): precompute_engine does not yet expose
  # a `/metrics` Prometheus endpoint. Re-enable this scrape once
  # the backend adds one (query-latency histograms + served-bytes
  # are paper §6.3 + §6.5 signals — needed before VLDB/SIGMOD
  # submission). Until then, the controller job below covers
  # every agent-push metric; leaving backend unscraped simply
  # means we won't have backend-internal query-latency plots.
  #- job_name: "backend"
  #  metrics_path: /metrics
  #  static_configs:
  #    - targets: ["backend:9465"]

  # ── Gateway aggregator self-telemetry ───────────────────────
  # Forwarded-bytes + processor CPU from the gateway's own
  # pipeline. §6.2 bandwidth-at-gateway reads from here.
  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:8889"]

# Per-agent sketchcol pipeline config — receives OTLP from a
# workload producer, runs the ASAP sketch processors, forwards
# the sketched output to the gateway, and exposes self-telemetry
# for Prometheus.
#
# Pipeline shape, matching paper §5:
#
#   fake-exporter (or real workload)
#       │
#       │  OTLP/gRPC :4317
#       ▼
#   ┌──────────────────────────────────────────┐
#   │  agent (this config)                     │
#   │   receivers:   otlp                      │
#   │   processors:  ddsketch + hll + batch    │
#   │   exporters:   otlp/gateway, prometheus  │
#   └──────────────────────────────────────────┘
#       │                       │
#       │ OTLP :4317            │ /metrics :8889
#       ▼                       ▼
#   gateway → backend        Prometheus scrape
#
# Only DDSketch + HLL are enabled here: together they exercise
# the "quantile + distinct-count" joint path the paper's B2
# baseline walks through. Adding KLL / CountSketch / CountMinSketch
# on the same pipeline is a drop-in — add the processor key
# under `processors:` and include its name in the `processors:`
# list of the pipeline below.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Paper §5.1 — DDSketch for latency-style quantiles. `window`
  # mode + `window_duration: 60s` aligns the aggregation budget
  # with the other 60s baselines (B1 Serf, B3 delta, B5 Gorilla,
  # B0b raw-batched); previous `mode: batch` was per-arrival-
  # batch which made B2's §6.2 comparison apples-to-oranges vs
  # the windowed baselines.
  #
  # `transmit_sketch: true` sends the sketch state itself (not
  # just quantile point-estimates) so the gateway/backend can
  # re-query at different quantiles without another round-trip.
  ddsketch:
    mode: window
    window_duration: 60s
    transmit_sketch: true
    enable_self_monitoring: true
    quantiles: [0.5, 0.9, 0.99]
    metric_suffix: "_quantile"

  # Paper §5.1 — HLL for distinct-count (high-cardinality counters,
  # e.g. unique_users). Pairs with DDSketch to cover the two
  # primary sketch families in one pipeline. Precision is fixed
  # at 14 internally.
  HLL:
    mode: window
    window_duration: 60s
    transmit_sketch: true
    enable_self_monitoring: true

  # Keep batch last so sketch output is coalesced before network
  # send to the gateway.
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  # Forward sketched output to the gateway. Gateway config takes
  # it from here — currently prometheusremotewrite → backend.
  otlp/gateway:
    endpoint: gateway:4317
    tls:
      insecure: true

  # Per-agent /metrics exposer: Prometheus scrapes each agent on
  # :8889. Paper §6.2 per-agent CPU + bandwidth-served numbers
  # come from these counters.
  prometheus:
    endpoint: "0.0.0.0:8889"

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [ddsketch, HLL, batch]
      exporters: [otlp/gateway, prometheus]

  telemetry:
    logs:
      level: info
    metrics:
      # Separate port for otelcol's own runtime self-telemetry so
      # it doesn't collide with the `prometheus` exporter above
      # (same mistake the gateway config used to make). Collector
      # v0.141 uses a `readers:` block with explicit pull exporter
      # — the older `address:` shorthand was removed.
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8890

cleanup_policy:
  name: "circular_buffer"
metrics:
  http_requests_total:
  - zone
  - rack
  - node
  - pod
  http_requests_total_latency_ms:
  - zone
  - rack
  - node
  - pod
queries:
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: sum_over_time(http_requests_total[1m])
- aggregations:
  - aggregation_id: 2
    num_aggregates_to_retain: 6
  query: sum_over_time(http_requests_total_latency_ms[1m])

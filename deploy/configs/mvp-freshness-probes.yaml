# MVP demo freshness probe schema
#
# Three synthetic counter metrics emitted by the fake-exporter at 1Hz.
# Each emission carries a value of `unix_ts_ms_of_emission`
# — the value IS the timestamp.
#
# Replay client polls each probe via `last_over_time(<probe>[10s])`
# every 100ms and computes:
#
#   delta_ms = poll_response_ts_ms − observed_value
#
# Δ is the freshness latency — how long after the sample is
# generated until a query first returns it. Reported per path:
#
#   - http_freshness_probe_raw       → routes to Prometheus B0
#   - http_freshness_probe_warm      → routes to sketch warm tier
#   - http_freshness_probe_archive   → routes to GorillaQueryEngine
#
# Plumbing notes:
#
# 1. fake-exporter must emit these three metrics. Today's
#    fake-exporter (DataCollector/datasets_eval/) has fixed metric
#    names. A small extension is required to add the three
#    timestamp-encoded counters.
#
# 2. agent-side routing — the warm/archive probes go through the
#    sketchcol agent's pipeline; the raw probe is exported via
#    `prometheusremotewrite` to the real Prometheus container in
#    mvp-multi-stage.yml.
#
# 3. backend-storage-routing.yaml maps the warm/archive probes to
#    their respective tiers.

probes:
  - name: http_freshness_probe_raw
    kind: counter
    value_semantics: "unix_ts_ms_of_emission"
    target_path: prometheus_b0
    description: "Raw end-to-end via Prometheus remote_write."

  - name: http_freshness_probe_warm
    kind: counter
    value_semantics: "unix_ts_ms_of_emission"
    target_path: sketch_warm_tier
    description: "Through sketch processor at agent → backend warm."
    sketch_family_override: ddsketch
    sketch_window_secs: 1   # smallest practical to keep p99 freshness bounded

  - name: http_freshness_probe_archive
    kind: counter
    value_semantics: "unix_ts_ms_of_emission"
    target_path: gorilla_archive
    description: "Through gorillas3processor → S3 → GorillaQueryEngine."
    gorilla_window_secs: 5  # match gorillas3processor's flush interval

# Polling configuration the replay client should use:
#
poll:
  interval_ms: 100        # 10 Hz
  query_window: "10s"     # last_over_time(probe[10s])
  measurement_secs: 60    # capture ≥ 60 samples per path
  warmup_secs: 30         # allow agent + backend pipelines to settle

# Per-path expected p99 (priors, not measurements — for sanity
# check, not the verdict):
#
#   raw         → ≤ 1s   (Prometheus scrape interval + ingest)
#   warm        → ≤ sketch_window_secs + 1s (window close + ingest + serve)
#   archive     → ≤ gorilla_window_secs + chunk_upload_latency + gorilla_engine_latency
#                 (≤ ~10s for single-host MinIO)

caveats:
  - "Single-host clock-sync assumed; safe for in-process comparisons."
  - "Archive freshness is bounded by gorillas3processor's flush window. \
     Don't expect sub-second archive freshness — that requires a \
     streaming write path (e.g., Kafka), out of scope for the MVP demo."

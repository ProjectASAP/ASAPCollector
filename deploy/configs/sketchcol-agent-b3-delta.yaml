# Baseline B3 — Delta sketch transmission over fixed 60s window.
#
# Baseline: same DDSketch + HLL semantics as B2 (full
# sketch), but the wire payload is the SKETCH DELTA since the
# last flush, not the full sketch state. Delta = sparse diff of
# only-changed buckets/registers, so per-window bytes drop
# dramatically once the sketch fills in.
#
# Window length is fixed at 60 s here; B4 exposes it as an env
# knob for the window-tuning experiments.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  ddsketch:
    mode: window
    window_duration: 60s
    transmit_sketch: true
    delta_transmission: true
    # Buckets changing by ≥1 count enter the delta; tune to trade
    # accuracy tail vs payload size.
    delta_threshold: 1
    enable_self_monitoring: true
    quantiles: [0.5, 0.9, 0.99]
    metric_suffix: "_quantile"

  HLL:
    mode: window
    window_duration: 60s
    transmit_sketch: true
    delta_transmission: true
    enable_self_monitoring: true

  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  otlp/gateway:
    endpoint: gateway:4317
    tls:
      insecure: true

service:
  pipelines:
    # Per-sketch pipelines, NOT a chain of `[ddsketch, HLL, batch]`.
    # Each sketch processor runs in `mode: window`, where its
    # `ConsumeMetrics` accumulates inputs and `return nil`s — it
    # does NOT forward inputs to the next processor. Chaining
    # them in series therefore drops everything: ddsketch eats
    # the raw inputs, fires its window emit downstream as typed
    # DDSketch data points, HLL receives those typed points, has
    # no `case pmetric.MetricTypeDDSketch:` in its
    # `accumulateIntoWindow` switch, and silently drops them.
    # OTel collector fans-out the same OTLP receiver across all
    # pipelines that reference it, so two pipelines pointing at
    # `receivers: [otlp]` each see every incoming batch.
    metrics/ddsketch:
      receivers: [otlp]
      processors: [ddsketch, batch]
      exporters: [otlp/gateway]
    metrics/hll:
      receivers: [otlp]
      processors: [HLL, batch]
      exporters: [otlp/gateway]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8890

# Per-metric storage-backend routing table — issue #46 MVP demo.
#
# The backend's HTTP query handler consults this on every PromQL
# instant query. For each metric listed below, the handler classifies
# the query's shape (count / topk / rate_post_hoc / quantile / sum /
# last_over_time / other) from the parsed PromQL AST and dispatches
# through `EngineRouter` to the matching target. Unlisted metrics fall
# through to `default`.
#
# Why this file exists: by default the backend bypasses
# `EngineRouter` for every query because `StreamingConfig::from_yaml_data`
# always defaults the per-metric `storage_backend` axis to
# `sketch_warm_tier`. The streaming engine's OTLP-ingest path doesn't
# see Gorilla data anyway (the agent's `gorillas3processor` writes
# chunks directly to S3), so this routing layer overrides those
# defaults rather than teaching the streaming-config loader about it.
# Loaded by the backend via `--backend-storage-routing` (alias env var
# `ASAP_BACKEND_STORAGE_ROUTING`).
#
# Schema — two compatible forms (mix is fine):
#
#   default: <storage_backend>          (optional; default = sketch_warm_tier)
#
#   metrics:                            (single-target form — one engine per metric)
#     <metric>: <storage_backend>
#
#   routes:                             (multi-target form — per-query-shape dispatch)
#     - metric: <metric>
#       targets:
#         - backend: <storage_backend>             # default slot
#         - backend: <storage_backend>
#           applies_to_query_shape: [count, topk, rate_post_hoc]
#
# Valid `storage_backend` values mirror `asap_types::StorageBackend`:
#   sketch_warm_tier      — warm-tier sketches (SimpleEngine)
#   gorilla_s3_archive    — cold archive (GorillaQueryEngine)
#   cold_jsonl_fallback   — local-FS JSONL fallback
#   double_write          — both warm + archive (DoubleWrite)
#
# Valid `applies_to_query_shape` values: [count, topk, rate_post_hoc,
#   quantile, sum, last_over_time, other]. Picking matches the
#   parsed-PromQL classification in the backend's
#   `data_model::classify_query_shape`.

default: sketch_warm_tier

# Dual-routing: http_requests_total fans out to TWO targets.
# - The default slot (warm tier) catches predictable / planned
#   queries — quantile_over_time(...), sum by (zone) (...), bare
#   sum_over_time, etc. These are the criterion ④ accuracy queries
#   the replay suite drives. Routing them to the warm tier means
#   the SimpleEngine's DDSketch / KLL accumulators answer them; the
#   accuracy reducer gets real numbers (no NaN from empty cold
#   windows).
# - The `[count, topk, rate_post_hoc]` slot routes ad-hoc / post-hoc
#   queries to the cold archive. `count(http_requests_total{
#   service="payments"})` is the criterion ⑤ probe — it surfaces
#   `data_source: gorilla_archive` because the cold engine answers
#   it. `topk(...)` and `rate(...)` shapes the warm tier doesn't
#   precompute also drop into the archive's exact streaming path.
#
# Per-query-shape dispatch is the right axis: a single-target form
# would force ④ and ⑤ to be mutually exclusive (quantile-on-warm
# OR count-on-archive, never both); the multi-target form lets a
# single metric serve both classes from the engine each is best at.
routes:
  - metric: http_requests_total
    targets:
      - backend: sketch_warm_tier
        # default slot — every shape not explicitly claimed below
        # routes here (Quantile, Sum, LastOverTime, Other).
      - backend: gorilla_s3_archive
        applies_to_query_shape: [count, topk, rate_post_hoc]

  # The latency-quantile metric stays warm-tier-only. The cold
  # engine returns NaN for empty / partial 60s windows
  # (gorillas3processor flushes 60s chunks; the first chunk is
  # barely landing by query time), so routing this to the cold
  # archive would defeat criterion ④. Single-target; dual-routing
  # is unnecessary for this shape.
  - metric: http_requests_total_latency_ms_quantile
    targets:
      - backend: sketch_warm_tier

  # Freshness probes (criterion ⑥). Both probes route to the cold
  # archive — the GorillaQueryEngine handles `last_over_time(...)`
  # by returning the value of the largest-timestamp sample in the
  # range. The fake-exporter encodes `unix_ts_ms_of_emission` in
  # the cumulative counter value, so the replay client subtracts
  # `(poll_ts - observed_value)` to get a per-path freshness delta.
  #
  # Path semantics:
  #   - http_freshness_probe_warm    routed via gorilla; the agent's
  #     warm-tier sketchprocessor still ingests these probes
  #     end-to-end, but the backend serves the query from the
  #     gorillas3-written chunk in MinIO. The "warm" label on the
  #     freshness path here reflects the agent-side processor
  #     pipeline (sketchprocessor warm-tier ingest), not the
  #     backend-side query engine. Splitting the warm-vs-archive
  #     trade-off all the way down to the warm-tier query path
  #     requires teaching SimpleEngine's pattern matcher about
  #     last_over_time + raw counters; deferred to a follow-up.
  #   - http_freshness_probe_archive routed via gorilla; the agent's
  #     gorillas3processor writes directly to MinIO. End-to-end
  #     archive path.
  - metric: http_freshness_probe_warm
    targets:
      - backend: gorilla_s3_archive
  - metric: http_freshness_probe_archive
    targets:
      - backend: gorilla_s3_archive

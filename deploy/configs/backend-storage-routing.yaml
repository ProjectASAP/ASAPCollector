# Per-metric storage-backend routing table — issue #46 MVP demo.
#
# The backend's HTTP query handler consults this on every PromQL
# instant query. For each metric listed below, the handler dispatches
# through `EngineRouter` to the named storage backend (e.g. cold
# Gorilla-S3 archive); unlisted metrics fall through to `default`
# (which itself defaults to `sketch_warm_tier` — the existing
# warm-tier sketch path served by `SimpleEngine`).
#
# Why this file exists: in the v2 MVP demo the backend bypassed
# `EngineRouter` for every query because `StreamingConfig::from_yaml_data`
# always defaults the per-metric `storage_backend` axis to
# `sketch_warm_tier`. The streaming engine's OTLP-ingest path doesn't
# see Gorilla data anyway (the agent's `gorillas3processor` writes
# chunks directly to S3), so the fix lives in this separate routing
# layer instead of teaching the streaming-config loader about it.
# Loaded by the backend via `--backend-storage-routing` (alias env var
# `ASAP_BACKEND_STORAGE_ROUTING`).
#
# Schema:
#   default: <storage_backend>           (optional; default = sketch_warm_tier)
#   metrics:
#     <metric_name>: <storage_backend>
#
# Valid `storage_backend` values mirror `asap_types::StorageBackend`:
#   sketch_warm_tier      — warm-tier sketches (SimpleEngine)
#   gorilla_s3_archive    — cold archive (GorillaQueryEngine)
#   cold_jsonl_fallback   — local-FS JSONL fallback
#   double_write          — both warm + archive (DoubleWrite)

default: sketch_warm_tier
metrics:
  # The MVP demo's ad-hoc cold-fallback probe is
  # `sum_over_time(http_requests_total[1m])` (or `count(...)`),
  # PromQL shapes the GorillaQueryEngine planner supports.
  # Routing here makes the response carry
  # `data_source: gorilla_archive`, the byte-comparable signal
  # criterion ⑤ demands.
  http_requests_total: gorilla_s3_archive

  # v4: revert the v3 route for the latency-quantile metric
  # back to the warm tier. v3 routed it through gorilla_s3_archive
  # too, which made every replay-suite quantile query land in the
  # cold engine. The cold engine returned NaN for the empty/partial
  # 60s window (gorillas3 writes 60s chunks; the first chunk is
  # barely landing by query time), so the accuracy reducer couldn't
  # compute relative error and criterion ④ surfaced as UNKNOWN. v4
  # keeps the quantile metric on the warm tier (DDSketch / KLL
  # accumulators served by SimpleEngine) so the reducer gets real
  # numbers; criterion ⑤ still verifies cold-archive dispatch via
  # `http_requests_total`.
  http_requests_total_latency_ms_quantile: sketch_warm_tier

  # v4 freshness probes (criterion ⑥). Two synthetic gauges emitted
  # by `measure_freshness.py` push to agent-1's OTLP HTTP receiver;
  # their values encode the unix_ts_ms at generation. The probe polls
  # the backend for `last_over_time(<metric>[10s])` every 100 ms and
  # records (observation_time - observed_value) as Δ. Splitting the
  # metric name lets the routing table dispatch each probe down its
  # own engine path so the freshness number is path-isolated.
  http_freshness_probe_warm: sketch_warm_tier
  http_freshness_probe_archive: gorilla_s3_archive

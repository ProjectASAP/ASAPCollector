# Minimal gateway collector: accept OTLP from agents, aggregate
# per-agent counters, forward to backend. The "gateway
# aggregation saves another N% bandwidth" figures come off this
# pipeline; swap the exporter to the ASAP-patched sketchcol
# build when we want sketches at the gateway tier too.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        # Sketch payloads (DDSketch state + HLL state embedded in
        # gauge attributes) easily exceed the default 4 MiB cap.
        # Bump to 64 MiB so sketch-transmission runs
        # don't drop batches.
        max_recv_msg_size_mib: 64
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  # Drop labels the backend doesn't use — small but non-zero
  # bandwidth savings at scale.
  attributes/drop-internal:
    actions:
      - key: telemetry.sdk.name
        action: delete
      - key: telemetry.sdk.language
        action: delete
      - key: telemetry.sdk.version
        action: delete

exporters:
  # Backend ingests Prometheus remote-write at port 9090 (see
  # precompute_engine --ingest-port), so we use the prometheus
  # remote-write exporter. Switching to OTLP here required OTLP
  # ingest on the backend, which precompute_engine does not
  # expose today. The remote-write exporter drops sketch-typed
  # metrics (DDSketch/HLLSketch) — that's expected; the ASAP
  # query path reads sketch state from the backend's ingest,
  # not from Prometheus.
  prometheusremotewrite/backend:
    endpoint: http://backend:9090/api/v1/write
    tls:
      insecure: true
  # `prometheus` (scrape-style) exporter removed: the stock 0.108
  # build can't translate DDSketch / HLLSketch types and spams
  # `failed to translate metric` errors. Per-agent sketch
  # observability comes from each agent's own /metrics at
  # `agent-*:8889` — Prometheus scrapes those directly.

service:
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      # Self-telemetry port; gateway exporter owns 8889 for
      # pipeline-level metrics, so self-telemetry moves to 8890.
      address: "0.0.0.0:8890"
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [attributes/drop-internal, batch]
      exporters: [prometheusremotewrite/backend]

# Default gateway config — pure forwarder. Receives OTLP from
# agents, drops a few internal labels, forwards to the backend
# over OTLP. No sketch aggregation at this tier.
#
# IMPORTANT: this config requires the `asap/sketchcol:dev` image
# (NOT stock `otel/opentelemetry-collector-contrib:0.108.0`).
# Stock contrib's pdata silently drops typed sketch data points
# (DDSketch / KLLSketch / HLLSketch / CountSketch / CountMinSketch
# on Metric.data tags 13–17) via `ConsumeUnknown` during the
# OTLP-receive → in-memory → OTLP-export round-trip — see
# `opentelemetry-collector/pdata/internal/generated_proto_metric.go`
# `default: proto.ConsumeUnknown(...)`. The sketchcol image is
# built from `opentelemetry-collector-contrib-patch/` which has
# the patched proto + pdata that knows tags 13–17. Forwarder mode
# uses none of the sketch processors — the patched build is
# needed only for the round-trip preservation.
#
# Two alternative configs in this directory:
#   - gateway-aggregate-from-raw.yaml — agents send raw OTLP;
#     gateway runs DDSketch / KLL / HLL / CountSketch / CMS
#     processors at the gateway tier and emits typed sketches
#     downstream.
#   - gateway-aggregate-from-sketches.yaml — agents already
#     sketched; gateway runs CMS-merge / CountSketch-merge to
#     reconstruct full sketch state from delta payloads, then
#     forwards. (DD / KLL / HLL pass through; merge processors
#     for those don't exist yet.)
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        # Sketch payloads (DDSketch state + HLL state embedded in
        # gauge attributes) easily exceed the default 4 MiB cap.
        # Bump to 64 MiB so sketch-transmission runs
        # don't drop batches.
        max_recv_msg_size_mib: 64
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  # Drop labels the backend doesn't use — small but non-zero
  # bandwidth savings at scale.
  attributes/drop-internal:
    actions:
      - key: telemetry.sdk.name
        action: delete
      - key: telemetry.sdk.language
        action: delete
      - key: telemetry.sdk.version
        action: delete

exporters:
  # Backend exposes OTLP gRPC on 4317 (precompute_engine
  # --enable-otel-ingest, or the query_engine_rust binary which
  # has it built in). The OTLP receiver routes both raw metric
  # points and the typed sketch data points
  # ({DDSketch | KLLSketch | HLLSketch | CountSketch | CountMinSketch}
  # on Metric.data tags 13–17) through the precompute engine's
  # worker pool — so unlike the PRW path, sketch-typed metrics
  # are NOT dropped here.
  otlp/backend:
    endpoint: backend:4317
    tls:
      insecure: true
    # Match the receiver's bumped cap; sketch payloads dwarf 4 MiB.
    sending_queue:
      enabled: true
  # PRW exporter retained as a fallback / for legacy deploys.
  # Not in the active pipeline — it drops sketch-typed metrics
  # at the gateway. Add to a pipeline only if a downstream needs
  # the Prometheus remote-write wire format specifically.
  prometheusremotewrite/backend:
    endpoint: http://backend:9090/api/v1/write
    tls:
      insecure: true
  # `prometheus` (scrape-style) exporter removed: the stock 0.108
  # build can't translate DDSketch / HLLSketch types and spams
  # `failed to translate metric` errors. Per-agent sketch
  # observability comes from each agent's own /metrics at
  # `agent-*:8889` — Prometheus scrapes those directly.

service:
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      # Self-telemetry port; gateway exporter owns 8889 for
      # pipeline-level metrics, so self-telemetry moves to 8890.
      address: "0.0.0.0:8890"
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [attributes/drop-internal, batch]
      exporters: [otlp/backend]

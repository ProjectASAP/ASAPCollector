# Warm-tier dispatch table (KLL single-sketch overlay).
#
# Subset of `backend-inference.yaml` (which mirrors PR #79's
# `inference_config.yaml`) restricted to the families that route to
# the KLL accumulator:
#
#   * `quantile_over_time(φ, metric[range])` — Statistic::Quantile;
#     KLL is the rank-quantile sketch (datasketches-cpp KLL). PR #79
#     `tests/inference_yaml_pattern_coverage.rs::quantile_over_time_multi_phi_routes_through_warm_tier`
#     verifies this routing end-to-end.
#   * Spatial `quantile by (label) (φ, metric)` — Statistic::Quantile
#     spatial-of-temporal.
#
# `sum` / `count` / `rate` / `increase` / `topk` excluded (KLL backs
# rank statistics, not additive frequency). Note: KLL has NO delta
# encoding, so the `rate` / `increase` family in the canonical PR #79
# pattern set is paired with an Increase-typed accumulator, not KLL.
#
# Metric: `http_requests_total_latency_ms_kll`. The KLL direct agent
# overlay (`sketchcol-agent-kll-direct.yaml`) uses
# `metric_suffix: "_kll"`.
cleanup_policy:
  name: "circular_buffer"
metrics:
  http_requests_total_latency_ms_kll:
  - zone
  - rack
  - node
  - pod
queries:
# ── Spatial quantile (multi-quantile) ─────────────────────────────────
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile by (zone) (0.5, http_requests_total_latency_ms_kll)
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile by (zone) (0.9, http_requests_total_latency_ms_kll)
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile by (zone) (0.95, http_requests_total_latency_ms_kll)
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile by (zone) (0.99, http_requests_total_latency_ms_kll)
# ── quantile_over_time: multi-quantile × wider ranges ─────────────────
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile_over_time(0.5, http_requests_total_latency_ms_kll[1m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile_over_time(0.9, http_requests_total_latency_ms_kll[1m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile_over_time(0.95, http_requests_total_latency_ms_kll[1m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile_over_time(0.99, http_requests_total_latency_ms_kll[1m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile_over_time(0.5, http_requests_total_latency_ms_kll[2m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile_over_time(0.9, http_requests_total_latency_ms_kll[2m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile_over_time(0.95, http_requests_total_latency_ms_kll[2m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile_over_time(0.99, http_requests_total_latency_ms_kll[2m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile_over_time(0.5, http_requests_total_latency_ms_kll[5m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile_over_time(0.9, http_requests_total_latency_ms_kll[5m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile_over_time(0.95, http_requests_total_latency_ms_kll[5m])
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: quantile_over_time(0.99, http_requests_total_latency_ms_kll[5m])

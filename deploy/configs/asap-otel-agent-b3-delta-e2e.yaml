# B3 delta-sketch transmission, single-sketch (DDSketch) pipeline
# for the e2e harness. The canonical b3-delta config chains
# `[ddsketch, HLL, batch]` — but in `mode: window` each sketch
# processor swallows its input and only emits at window-flush, so
# HLL (which accepts only Gauge/HLLSketch types) silently drops
# DDSketch's output and the pipeline degenerates to "nothing
# downstream of ddsketch flush".
#
# For the e2e flow we just need one sketch type to demonstrate
# the full chain works. To run multiple sketches in parallel
# (paper figures), use named pipelines (`metrics/dd`,
# `metrics/hll`) each with their own [sketch, batch] processor
# list.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  ddsketch:
    mode: window
    window_duration: 30s
    transmit_sketch: true
    delta_transmission: true
    delta_threshold: 1
    enable_self_monitoring: true
    quantiles: [0.5, 0.9, 0.99]
    metric_suffix: "_quantile"

  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  otlp/gateway:
    endpoint: gateway:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [ddsketch, batch]
      exporters: [otlp/gateway]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8890

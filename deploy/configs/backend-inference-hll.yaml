cleanup_policy:
  name: "circular_buffer"
metrics:
  http_requests_total_hll:
  - zone
  - rack
  - node
  - pod
  http_requests_total_latency_ms_hll:
  - zone
  - rack
  - node
  - pod
queries:
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: count(http_requests_total_hll)
- aggregations:
  - aggregation_id: 1
    num_aggregates_to_retain: 6
  query: count_over_time(http_requests_total_hll[1m])
- aggregations:
  - aggregation_id: 2
    num_aggregates_to_retain: 6
  query: count_over_time(http_requests_total_latency_ms_hll[1m])

# Baseline B0b — raw OTel batched over 60s. Same wire bytes as
# B0a (no compression, no sketching), but holds samples for a
# full 60s before flushing. Matches the aggregation budget of
# B1/B2/B3/B5 so the §6.2 bandwidth comparison is apples-to-
# apples on time granularity.
#
# Pipeline: OTLP in → batch(60s) → OTLP out to gateway.
#
# Total bytes/s sent to gateway should be roughly the same as
# B0a (same raw samples, just delayed) — minor savings from
# OTLP framing amortization (fewer gRPC messages, fewer batch
# metadata blocks per unit time). The paper's §6.2 uses B0b as
# the "raw upper bound under the same time budget" datapoint.
#
# `send_batch_size: 1000000` is effectively disabled so the
# timeout drives the flush; otherwise a big burst of samples
# would flush before the 60s mark and defeat the experiment.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 60s
    send_batch_size: 1000000
    send_batch_max_size: 1000000

exporters:
  otlp/gateway:
    endpoint: gateway:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/gateway]

  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8890

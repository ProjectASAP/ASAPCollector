# Scale dials. Every figure is produced by varying `agents.count`
# across {1, 10, 100} while holding the rest fixed.

agents:
  # The N that drives the paper's throughput / bandwidth
  # reduction curves. The chart templates a Deployment with
  # `replicas: {{ .Values.agents.count }}`.
  count: 10
  image: "asap/asap-otel:dev"
  # "realistic edge"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

gateway:
  image: "otel/opentelemetry-collector-contrib:0.108.0"
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: 2,    memory: 4Gi }

backend:
  # data_plane reorg (2026-05): the data plane ships as its own
  # `asap/data-plane:dev` image (entrypoint `/usr/local/bin/data_plane`),
  # built from ASAPQuery-backend's data_plane/Dockerfile.
  image: "asap/data-plane:dev"
  # cold-fallback points at the in-cluster MinIO service by
  # default; flip to a real S3 bucket for scale runs.
  cold:
    endpoint: "http://asap-minio:9000"
    bucket: "raw"
  resources:
    requests: { cpu: 1,    memory: 2Gi }
    limits:   { cpu: 4,    memory: 8Gi }

controller:
  # data_plane reorg (2026-05): the control plane ships as its own
  # `asap/control-plane:dev` image (entrypoint
  # `/usr/local/bin/control_plane`), built from ASAPQuery-backend's
  # control_plane/Dockerfile — no longer a multi-bin reuse of the
  # data-plane image.
  image: "asap/control-plane:dev"
  entrypoint: "/usr/local/bin/control_plane"
  runtimeSamples:
    # Per-key ring buffer depth. 1024 at default agent rates
    # gives ~10 min of freshness — plenty for a replanner that
    # ticks every few seconds.
    perKeyCapacity: 1024
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits:   { cpu: 2,    memory: 2Gi }

minio:
  enabled: true
  # Swap to false + point `backend.cold.endpoint` at an external
  # S3 endpoint for the scale runs — keeps the chart cluster-
  # local by default.
  persistence:
    size: 100Gi

prometheus:
  enabled: true
  retention: 24h

grafana:
  enabled: true

# Workload replay source. The paper covers observability-only
# workloads (see `docs/paper-outline.md` §non-goals), so this
# stays pointed at a cluster-trace replayer.
workload:
  image: "asap/fake-exporter:dev"
  trace: "google-cluster-2019"
  rate: 1000          # samples/sec per metric
  cardinality: 1000   # unique label sets per metric

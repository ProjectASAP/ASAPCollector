extensions:
  opamp:
    server:
      ws:
        endpoint: ws://controller:4320/v1/opamp
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
    enable_series_id: false
    series_id_ttl: 300s
processors:
  ddsketch:
    mode: window
    enable_self_monitoring: true
    transmit_sketch: true
    window_duration: 1m
    relative_accuracy: 0.01
    quantiles:
    - 0.0
    - 0.25
    - 0.5
    - 0.75
    - 0.9
    - 0.99
    - 1.0
exporters:
  otlp/backend:
    endpoint: backend:4317
    tls:
      insecure: true
    compression: none
service:
  extensions:
  - opamp
  pipelines:
    metrics:
      receivers:
      - otlp
      processors:
      - ddsketch
      exporters:
      - otlp/backend

# Max-throughput Gorilla S3 benchmark
# Replace bucket/region and provide AWS credentials before running.

[global_tags]
  scenario = "gorilla_s3_max_throughput"

[agent]
  interval = "1s"
  flush_interval = "1s"
  flush_jitter = "250ms"
  metric_batch_size = 10000
  metric_buffer_limit = 500000
  collection_jitter = "0s"
  round_interval = false
  debug = true
  logfile = "/tmp/telegraf-gorilla-bench.log"

[[inputs.http_listener_v2]]
  service_address = "tcp://:8080"
  paths = ["/telegraf"]
  methods = ["POST"]
  data_format = "influx"
  read_timeout = "30s"
  write_timeout = "30s"
  max_body_size = "512MB"
  max_connections = 0            # unlimited; let the load generator saturate it
  name_override = "bench_http_ingress"
  metric_batch_size = 10000
  metric_buffer_limit = 250000

[[inputs.internal]]
  per_instance = true
  collect_gostats = true

[[outputs.gorilla_s3]]
  bucket = "REPLACE_ME_BUCKET"
  region = "us-east-1"
  prefix = "telegraf-bench/date=%Y-%m-%d/hour=%H/"
  sse_kms_key_id = ""

  # Larger objects improve compression ratio and amortize upload latency.
  max_object_bytes = 134217728      # 128 MiB
  multipart_threshold = 33554432    # 32 MiB before switching to multipart
  multipart_part_bytes = 16777216   # 16 MiB per part (>= 5 MiB required)

  # Give uploads enough time and retries to keep buffer drain steady.
  max_retries = 5
  retry_backoff = "2s"
  upload_timeout = "2m"

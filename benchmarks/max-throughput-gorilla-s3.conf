# Max-throughput Gorilla S3 benchmark
# Replace bucket/region and provide AWS credentials before running.

[global_tags]
  scenario = "gorilla_s3_max_throughput"

[agent]
  interval = "1s"
  flush_interval = "1s"
  flush_jitter = "250ms"
  metric_batch_size = 10000
  metric_buffer_limit = 500000
  collection_jitter = "0s"
  round_interval = false
  debug = true
  logfile = "/tmp/telegraf-gorilla-bench.log"

[[inputs.prometheus]]
  ## Scrape the FakePrometheusExporter endpoints to generate sustained load.
  urls = [
    "http://localhost:8000/metrics",
    "http://localhost:8001/metrics",
  ]
  metric_version = 2
  url_tag = "scrape_url"
  name_prefix = "throughput_"
  timeout = "5s"
  interval = "250ms"
  metric_batch_size = 10000
  metric_buffer_limit = 250000

[[inputs.internal]]
  per_instance = true
  collect_gostats = true

[[aggregators.gorilla]]
  period = "10m"
  drop_original = true
  block_interval = "10m"
  measurement = "gorilla_block"
  max_object_bytes = 134217728

[[outputs.gorilla_s3]]
  # bucket = "REPLACE_ME_BUCKET"
  # region = "us-east-1"
  prefix = "telegraf-bench/date=%Y-%m-%d/hour=%H/"
  sse_kms_key_id = ""
  local_dir = "/data1/gorilla-blocks"

  multipart_threshold = 33554432    # 32 MiB before switching to multipart
  multipart_part_bytes = 16777216   # 16 MiB per part (>= 5 MiB required)

  # Give uploads enough time and retries to keep buffer drain steady.
  max_retries = 5
  retry_backoff = "2s"
  upload_timeout = "2m"

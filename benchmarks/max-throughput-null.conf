# Max-throughput Telegraf core benchmark (null output)

[global_tags]
  scenario = "telegraf_core_null"

[agent]
  interval = "1ms"
  flush_interval = "100ms"
  flush_jitter = "0s"
  collection_jitter = "0s"
  round_interval = false
  metric_batch_size = 100000
  metric_buffer_limit = 25000000
  precision = "1ms"
  debug = true
  logfile = "/tmp/telegraf-null-bench.log"

[[inputs.socket_listener]]
  ## Firehose target: send Influx line protocol to tcp://localhost:8095.
  service_address = "tcp://:8094"
  data_format = "influx"
  name_override = "null_ingest"
  max_connections = 0
  metric_batch_size = 100000
  metric_buffer_limit = 25000000

[[inputs.internal]]
  per_instance = true
  collect_gostats = true

[[inputs.procstat]]
  exe = "telegraf"
  pid_finder = "native"
  interval = "1s"

[[outputs.discard]]
  ## Fastest possible output—drops everything immediately.

[[outputs.file]]
  ## Still capture internal_* metrics for analysis.
  files = ["../benchmarks/results/null-bench-internal.lp"]
  data_format = "influx"
  use_batch_format = false
  rotation_interval = "10m"
  rotation_max_size = "50MB"
  rotation_max_archives = 5
  namepass = ["internal_*", "procstat"]

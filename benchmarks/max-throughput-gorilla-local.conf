# Max-throughput Gorilla compression benchmark (local file target)

[global_tags]
  scenario = "gorilla_s3_local_max"

[agent]
  interval = "250ms"
  flush_interval = "250ms"
  flush_jitter = "0s"
  round_interval = false
  collection_jitter = "0s"
  metric_batch_size = 10000
  metric_buffer_limit = 500000
  debug = true
  logfile = "/tmp/telegraf-gorilla-local.log"

[[inputs.prometheus]]
  urls = [
    "http://localhost:8000/metrics",
    "http://localhost:8001/metrics",
  ]
  metric_version = 2
  url_tag = "scrape_url"
  name_prefix = "gorilla_local_"
  timeout = "5s"
  interval = "250ms"
  metric_batch_size = 10000
  metric_buffer_limit = 250000

[[inputs.internal]]
  per_instance = true
  collect_gostats = true

[[outputs.gorilla_s3]]
  ## New local mode: omit bucket/region and set local_dir to capture .gorilla files on disk.
  local_dir = "../benchmarks/results/gorilla-local"
  prefix = "objects/%Y%m%d/%H%M"

  max_object_bytes = 134217728      # 128 MiB objects
  multipart_threshold = 33554432    # still used if you later point at S3
  multipart_part_bytes = 16777216
  max_retries = 3
  retry_backoff = "2s"
  upload_timeout = "2m"

# Max-throughput Prometheus loop benchmark

[global_tags]
  scenario = "prometheus_loop_max"

[agent]
  interval = "1ms"
  flush_interval = "1ms"
  flush_jitter = "0s"
  collection_jitter = "0s"
  round_interval = false
  metric_batch_size = 10000
  metric_buffer_limit = 500000
  precision = "1ms"
  debug = true
  logfile = "/tmp/telegraf-prometheus-loop.log"

[[inputs.socket_listener]]
  ## Infinite firehose target: pump Influx line protocol into tcp://localhost:8094
  ## using nc/socat/custom generators to push Telegraf to its limits.
  service_address = "tcp://:8094"
  data_format = "influx"
  name_override = "loop_ingest"
  max_connections = 0
  metric_batch_size = 100000
  metric_buffer_limit = 25000000

[[inputs.internal]]
  per_instance = true
  collect_gostats = true

[[outputs.file]]
  files = ["../benchmarks/results/prometheus-loop-internal.lp"]
  data_format = "influx"
  use_batch_format = false
  rotation_interval = "1m"
  rotation_max_size = "50MB"
  rotation_max_archives = 5
  namepass = ["internal_*"]

[[outputs.prometheus_client]]
  listen = ":9203"
  path = "/metrics"
  metric_version = 2
  export_timestamp = true
  expiration_interval = "30s"

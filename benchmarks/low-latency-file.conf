# Low-latency local file benchmark

[global_tags]
  scenario = "file_low_latency"

[agent]
  interval = "500ms"
  flush_interval = "500ms"
  flush_jitter = "0s"
  collection_jitter = "0s"
  round_interval = true
  precision = "1ms"
  metric_batch_size = 250
  metric_buffer_limit = 10000
  debug = false
  logfile = "/tmp/telegraf-file-bench.log"

[[inputs.prometheus]]
  ## Point to the FakePrometheusExporter instances
  urls = [
    "http://localhost:8000/metrics",
    "http://localhost:8001/metrics",
  ]
  metric_version = 2
  url_tag = "scrape_url"
  name_prefix = "latency_"
  timeout = "2s"
  # Scrape twice per second to keep latency low but manageable
  interval = "500ms"

[[inputs.internal]]
  per_instance = true

[[outputs.file]]
  files = ["../benchmarks/results/telegraf-low-latency.lp"]
  data_format = "influx"
  use_batch_format = false       # write line-by-line to minimize flush latency
  rotation_interval = "30s"
  rotation_max_size = "10MB"
  rotation_max_archives = 6
